    <!-- JavaScript Module Hooking Firebase, Worker & R2 -->
    <script type="module">

        // Firebase Client Configuration
        const firebaseConfig = {

            authDomain: "audiory-distribution.firebaseapp.com",
            databaseURL: "https://audiory-distribution-default-rtdb.firebaseio.com",
            projectId: "audiory-distribution",
            storageBucket: "audiory-distribution.firebasestorage.app",

            appId: "1:944053428828:web:30277072355728f9c8fc99",
            measurementId: "G-MXDJH52XX4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Production Configuration Endpoints
        const WORKER_BASE_URL = "https://audiorydistribution.dandredurkofficial.workers.dev";

        // Genre Mapping Constant
        window.GENRE_MAP = {

            'Hip-Hop/Rap': ['Trap', 'Boom Bap', 'Drill', 'Conscious Hip-Hop', 'Melodic Rap', 'Cloud Rap'],
            'Pop': ['Dance Pop', 'Synth-Pop', 'Indie Pop', 'K-Pop', 'Electropop'],
            'R&B/Soul': ['Contemporary R&B', 'Neo-Soul', 'Alternative R&B', 'Soul'],
            'Electronic/Dance': ['House', 'Techno', 'Deep House', 'EDM', 'Dubstep', 'Trance'],
            'Rock': ['Alternative Rock', 'Indie Rock', 'Hard Rock', 'Pop Punk'],
            'Reggae/Dancehall': ['Dancehall', 'Roots Reggae', 'Reggaeton', 'Dub'],
            'Latin': ['Reggaeton', 'Bachata', 'Salsa', 'Latin Trap'],
            'Gospel/Christian': ['Contemporary Gospel', 'Christian Hip-Hop', 'Worship']
        };

        // Available DSP Stores Data
        const MASTER_DSP_LIST = [
            { id: 'spotify', name: 'Spotify', icon: 'fa-brands fa-spotify text-green-500' },
            { id: 'apple', name: 'Apple Music', icon: 'fa-brands fa-apple text-pink-500' },
            { id: 'amazon', name: 'Amazon Music', icon: 'fa-brands fa-amazon text-amber-500' },
            { id: 'youtube', name: 'YouTube Music', icon: 'fa-brands fa-youtube text-red-500' },
            { id: 'tiktok', name: 'TikTok', icon: 'fa-brands fa-tiktok text-cyan-400' },
            { id: 'deezer', name: 'Deezer', icon: 'fa-solid fa-compact-disc text-purple-400' },
            { id: 'tidal', name: 'Tidal', icon: 'fa-solid fa-wave-square text-white' },
            { id: 'pandora', name: 'Pandora', icon: 'fa-solid fa-radio text-blue-400' },
            { id: 'soundcloud', name: 'SoundCloud', icon: 'fa-brands fa-soundcloud text-orange-500' },
            { id: 'napster', name: 'Napster', icon: 'fa-solid fa-cat text-blue-500' },
            { id: 'audiomack', name: 'Audiomack', icon: 'fa-solid fa-music text-yellow-500' },
            { id: 'boomplay', name: 'Boomplay', icon: 'fa-solid fa-play text-red-400' }
        ];

        // Global State Variables
        window.currentUser = null;
        window.releasesCatalog = [];
        window.currentStep = 1;

        window.releaseState = {
            metadata: {
                title: '',
                version: '',
                catalogNumber: '',
                upc: '',
                type: 'Single',
                language: 'English',
                explicit: false,
                primaryGenre: '',
                secondaryGenre: ''
            },
            artists: [
                { name: '', role: 'Primary' }
            ],
            label: { name: '', cLine: '', pLine: '' },
            dates: { releaseDate: '', timezone: 'Africa/Nairobi', salesStart: '', preOrderDate: '' },
            territories: { mode: 'Worldwide', selectedCountries: [] },
            dsps: MASTER_DSP_LIST.map(d => d.id),
            artwork: { file: null, url: '', inspected: null },
            tracks: [
                {
                    metadata: { title: '', version: '', genre: '', subgenre: '', explicit: false },
                    discNumber: 1,
                    isrc: '',
                    audioFile: null,
                    previewUrl: '',
                    tiktokStartTime: '00:30',
                    lyrics: { plain: '' }
                }
            ],
            agreements: { termsAccepted: false, rightsConfirmed: false }
        };

        const COUNTRY_LIST = [
            'United States', 'United Kingdom', 'Canada', 'Germany', 'France', 'Japan', 
            'Australia', 'Kenya', 'Nigeria', 'South Africa', 'Brazil', 'India'
        ];

        // Auth Observer Hook
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                const nameEl = document.getElementById('userName');
                const emailEl = document.getElementById('userEmail');
                const initEl = document.getElementById('userInitials');
                if (nameEl) nameEl.innerText = user.displayName || user.email.split('@')[0];
                if (emailEl) emailEl.innerText = user.email;
                if (initEl) initEl.innerText = (user.displayName || user.email).substring(0, 2).toUpperCase();
        
                await loadLiveCatalog();
                window.switchView('home');
            } else {
                window.location.href = '/login/';
            }
        });

        window.handleSignOut = () => signOut(auth).then(() => window.location.href = '/login/');

        // UI Toast Alert
        window.showToast = function(message, isError = true) {
            let toastBox = document.getElementById('toastContainer');
            if (!toastBox) {
                toastBox = document.createElement('div');
                toastBox.id = 'toastContainer';
                toastBox.className = 'fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none';
                document.body.appendChild(toastBox);
            }
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-xs font-semibold shadow-xl border backdrop-blur-md transition-all duration-300 pointer-events-auto flex items-center gap-2 ${
                isError ? 'bg-red-950/90 border-red-500/50 text-red-200' : 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200'
            }`;
            toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i> <span>${message}</span>`;
            toastBox.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        };

        async function loadLiveCatalog() {
            try {
                const res = await fetch(`${WORKER_BASE_URL}/api/releases`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (res.ok) {
                    const data = await res.json();
                    window.releasesCatalog = Array.isArray(data) ? data : (data.data || []);
                    renderCatalogView();
                } else {
                    console.error("Failed to fetch live catalog from API gateway:", res.status);
                }
            } catch (err) {
                console.error("Error loading catalog:", err);
            }
        }

        // Direct Multipart Upload to Cloudflare Worker R2 Bucket
        async function uploadFileToR2(file, folder = 'audio') {
            const token = await window.currentUser.getIdToken();
            const formData = new FormData();
            formData.append('file', file);
            formData.append('folder', folder);

            const res = await fetch(`${WORKER_BASE_URL}/api/upload`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Worker upload failed with status ${res.status}: ${errText}`);
            }

            const data = await res.json();
            if (!data.success || !data.url) {
                throw new Error(`Upload failed: ${data.error || 'No public URL returned from Worker'}`);
            }

            return data.url;
        }

        // View Router
        window.switchView = function(viewName) {
            ['home', 'catalog', 'create', 'analytics', 'settings'].forEach(v => {
                const btn = document.getElementById(`nav_${v}`);
                if (btn) {
                    btn.className = (v === viewName)
                        ? "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-brand-accent bg-brand-dark border border-brand-border/80 transition-all"
                        : "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all";
                }
            });

            const viewport = document.getElementById('mainViewport');
            if (!viewport) return;

            if (viewName === 'home') viewport.innerHTML = renderHomeView();
            if (viewName === 'catalog') viewport.innerHTML = renderCatalogView();
            if (viewName === 'create') {
                viewport.innerHTML = window.renderCreateReleaseView();
                window.currentStep = 1;
                window.renderStepContent(1);
            }
            if (viewName === 'analytics') viewport.innerHTML = renderAnalyticsView();
            if (viewName === 'settings') viewport.innerHTML = renderSettingsView();

            const sidebar = document.getElementById('sidebarNav');
            if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
            }
        };

        window.toggleMobileSidebar = () => document.getElementById('sidebarNav').classList.toggle('-translate-x-full');

        // Views
        function renderHomeView() {
            return `
                <div class="max-w-7xl mx-auto space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-brand-border/60">
                        <div>
                            <h1 class="text-2xl font-bold text-white tracking-tight">Welcome, <span class="text-brand-accent">${window.currentUser?.displayName || 'Partner'}</span></h1>
                            <p class="text-xs text-gray-400">Live production telemetry & Too Lost API gateway pipeline.</p>
                        </div>
                        <button onclick="switchView('create')" class="px-5 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs flex items-center gap-2 shadow-lg shadow-cyan-500/10">
                            <i class="fa-solid fa-plus text-[10px]"></i> New Release
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Active Catalog</p>
                            <h3 class="text-2xl font-black text-white font-mono">${window.releasesCatalog.length}</h3>
                        </div>
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Pipeline Status</p>
                            <span class="text-xs font-bold text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> Cloudflare R2 Connected</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCatalogView() {
            if (!window.releasesCatalog || window.releasesCatalog.length === 0) {
                return `
                    <div class="text-center py-24 bg-brand-card rounded-2xl border border-brand-border space-y-4 max-w-xl mx-auto">
                        <div class="w-16 h-16 rounded-full bg-cyan-500/10 text-cyan-400 flex items-center justify-center mx-auto text-2xl">

                        </div>
                        <h3 class="text-lg font-bold text-white">No Releases Found</h3>
                        <p class="text-xs text-gray-400">Start distributing your music to over 150+ streaming platforms.</p>
                        <button onclick="switchView('create')" class="px-5 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs hover:opacity-90 transition">
                            + Create New Release
                        </button>
                    </div>
                `;
            }

            return `
                <div class="max-w-7xl mx-auto space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-brand-border pb-5">
                        <div>
                            <h1 class="text-2xl font-bold text-white tracking-tight">Releases Catalog</h1>
                            <p class="text-xs text-gray-400">Manage, edit, and track your active music submissions</p>
                        </div>
                        <button onclick="switchView('create')" class="px-4 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs flex items-center justify-center gap-2 hover:opacity-90 transition">
                            <i class="fa-solid fa-plus"></i> New Release
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${window.releasesCatalog.map((rel, idx) => {
                            const title = rel.title || rel.metadata?.title || 'Untitled Release';
                            const artistNames = rel.artists ? rel.artists.map(a => a.name).join(', ') : (rel.artist || 'Unknown Artist');
                            const cover = rel.cover_url || rel.coverUrl || rel.artwork?.url || 'https://placehold.co/400x400/1e293b/06b6d4?text=Music+Cover';
                            const releaseType = rel.type || rel.metadata?.type || 'Single';
                            const status = rel.status || 'Submitted';
                            const upc = rel.upc || 'Pending';

                            return `
                                <div class="group relative rounded-2xl bg-brand-card border border-brand-border p-4 flex gap-4 hover:border-cyan-500/50 transition-all shadow-lg">

                                        <span class="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-md bg-black/70 backdrop-blur-md text-[9px] font-bold text-cyan-400 uppercase tracking-wider">
                                            ${releaseType}
                                        </span>
                                    </div>

                                    <div class="flex-1 min-w-0 flex flex-col justify-between">
                                        <div class="space-y-1">
                                            <div class="flex items-start justify-between gap-2">

                                            <p class="text-xs text-gray-400 truncate" title="${artistNames}">${artistNames}</p>
                                            <p class="text-[10px] font-mono text-gray-500">UPC: ${upc}</p>
                                        </div>

                                                ● ${status}
                                            </span>
                                            <div class="flex items-center gap-1">
                                                <button type="button" onclick="editReleaseCatalog(${idx})" title="Edit Release" class="p-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-brand-dark transition">

                                                </button>
                                                <button type="button" onclick="deleteReleaseCatalog('${rel.id || idx}')" title="Delete Release" class="p-1.5 rounded-lg text-gray-400 hover:text-red-400 hover:bg-brand-dark transition">
                                                    <i class="fa-solid fa-trash text-xs"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // Catalog Actions
        window.editReleaseCatalog = function(index) {
            const item = window.releasesCatalog[index];
            if (!item) return;

        window.handleCoverArtSelection = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            window.releaseState.artwork.file = file;
            const previewContainer = document.getElementById('artworkPreviewContainer');
            const previewImg = document.getElementById('artworkPreviewImg');
            const specsBox = document.getElementById('artworkSpecsBox');

            const previewUrl = URL.createObjectURL(file);
            window.releaseState.artwork.url = previewUrl;
            if (previewImg) previewImg.src = previewUrl;

            const inspected = await inspectImageFile(file);
            window.releaseState.artwork.inspected = inspected;

            if (specsBox) {
                specsBox.innerHTML = `
                    <p>File Name: ${inspected.filename}</p>
                    <p>Dimensions: ${inspected.width}x${inspected.height} px</p>
                    <p>Format: ${inspected.mime}</p>
                    <p class="${inspected.valid ? 'text-emerald-400' : 'text-red-400'} font-bold">
                        ${inspected.valid ? '✓ Artwork Meets Requirements' : '✗ Invalid Dimensions or Format'}
                    </p>
                `;
            }
            if (previewContainer) previewContainer.classList.remove('hidden');
        };

        async function inspectImageFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = (e) => {
                    const arr = (new Uint8Array(e.target.result)).subarray(0, 4);
                    let header = "";
                    for (let i = 0; i < arr.length; i++) header += arr[i].toString(16);
                    
                    let mime = "unknown";
                    if (header.startsWith("89504e47")) mime = "image/png";
                    else if (header.startsWith("ffd8ff")) mime = "image/jpeg";

                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    img.onload = () => {
                        resolve({
                            filename: file.name,
                            mime: mime,
                            width: img.width,
                            height: img.height,
                            fileSize: `${(file.size / (1024 * 1024)).toFixed(2)} MB`,
                            valid: (mime !== "unknown" && img.width >= 3000 && img.height >= 3000)
                        });
                    };
                };
                reader.readAsArrayBuffer(file.slice(0, 4));
            });
        }

                                        <label class="too-lost-form-label">Explicit Status *</label>
                                        <select onchange="window.releaseState.tracks[${idx}].metadata.explicit = (this.value === 'true')" class="too-lost-input">
                                            <option value="false" ${!track.metadata?.explicit ? 'selected' : ''}>Clean / Non-Explicit</option>
                                            <option value="true" ${track.metadata?.explicit ? 'selected' : ''}>Explicit</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">Track Genre *</label>
                                        <select onchange="handleTrackGenreChange(${idx}, this.value)" class="too-lost-input">
                                            <option value="">Select Genre</option>
                                            ${Object.keys(GENRE_MAP).map(g => `
                                                <option value="${g}" ${track.metadata?.genre === g ? 'selected' : ''}>${g}</option>
                                            `).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">Track Subgenre *</label>
                                        <select id="track_subgenre_${idx}" onchange="window.releaseState.tracks[${idx}].metadata.subgenre = this.value" 
                                                class="too-lost-input" ${!track.metadata?.genre ? 'disabled' : ''}>
                                            <option value="">${track.metadata?.genre ? 'Select Subgenre' : '-- Select Genre First --'}</option>
                                            ${track.metadata?.genre && GENRE_MAP[track.metadata.genre] 
                                                ? GENRE_MAP[track.metadata.genre].map(sub => `
                                                    <option value="${sub}" ${track.metadata?.subgenre === sub ? 'selected' : ''}>${sub}</option>
                                                  `).join('') 
                                                : ''}
                                        </select>
                                    </div>
                                </div>

                                <!-- Audio Upload & Audio Preview -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="too-lost-form-label">Audio File (WAV/FLAC) *</label>
                                        <input type="file" accept="audio/wav,audio/flac" 
                                               onchange="handleAudioPreview(${idx}, this)" 
                                               class="too-lost-input text-xs">
                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">Audio Preview</label>
                                        <div id="audio_preview_container_${idx}" class="flex items-center h-10 px-3 rounded-xl bg-brand-dark border border-brand-border">
                                            ${track.previewUrl || track.audioUrl ? `
                                                <audio controls class="w-full h-8">
                                                    <source src="${track.previewUrl || track.audioUrl}" type="audio/mpeg">
                                                    Your browser does not support audio playback.
                                                </audio>
                                            ` : '<span class="text-xs text-gray-500">No audio uploaded yet</span>'}
                                        </div>
                                    </div>
                                </div>

                                <!-- ISRC & TikTok Start Time -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="too-lost-form-label">ISRC (Optional - Leave blank to auto-generate)</label>
                                        <input type="text" value="${track.isrc || ''}" 
                                               oninput="window.releaseState.tracks[${idx}].isrc = this.value" 
                                               class="too-lost-input" placeholder="e.g. USABC1234567">
                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">TikTok Clip Start Time (MM:SS)</label>
                                        <input type="text" value="${track.tiktokStartTime || '00:30'}" 
                                               oninput="window.releaseState.tracks[${idx}].tiktokStartTime = this.value" 
                                               class="too-lost-input" placeholder="00:30">
                                    </div>
                                </div>

                                <!-- Lyrics -->
                                <div>
                                    <label class="too-lost-form-label">Plain Lyrics</label>
                                    <textarea oninput="window.releaseState.tracks[${idx}].lyrics = { plain: this.value }" 
                                              class="too-lost-input h-20" placeholder="Type plain text lyrics here...">${track.lyrics?.plain || ''}</textarea>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.handleTrackGenreChange = function(idx, genre) {
            window.releaseState.tracks[idx].metadata.genre = genre;
            window.releaseState.tracks[idx].metadata.subgenre = '';
            
            const subSelect = document.getElementById(`track_subgenre_${idx}`);
            if (!subSelect) return;

            if (genre && GENRE_MAP[genre]) {
                subSelect.disabled = false;
                subSelect.innerHTML = `<option value="">Select Subgenre</option>` + 
                    GENRE_MAP[genre].map(sub => `<option value="${sub}">${sub}</option>`).join('');
            } else {
                subSelect.disabled = true;
                subSelect.innerHTML = `<option value="">-- Select Genre First --</option>`;
            }
        };

        // Audio Preview Handler
        window.handleAudioPreview = function(trackIndex, inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            window.releaseState.tracks[trackIndex].audioFile = file;
            const previewUrl = URL.createObjectURL(file);
            window.releaseState.tracks[trackIndex].previewUrl = previewUrl;

            const container = document.getElementById(`audio_preview_container_${trackIndex}`);
            if (container) {
                container.innerHTML = `
                    <audio controls class="w-full h-8">
                        <source src="${previewUrl}" type="${file.type}">
                        Your browser does not support audio playback.
                    </audio>
                `;
            }
        };

        // Add Track for EP/Album
        window.addTrackToRelease = function() {
            window.releaseState.tracks.push({
                metadata: { title: '', version: '', genre: window.releaseState.metadata.primaryGenre || '', subgenre: window.releaseState.metadata.secondaryGenre || '', explicit: false },
                discNumber: 1,
                isrc: '',
                audioFile: null,
                previewUrl: '',
                tiktokStartTime: '00:30',
                lyrics: { plain: '' }
            });
            const container = document.getElementById('wizardStepContainer');
            if (container && window.currentStep === 4) container.innerHTML = renderStep4Content();
        };

        // Remove Track
        window.removeTrackFromRelease = function(index) {
            if (window.releaseState.tracks.length <= 1) return;
            window.releaseState.tracks.splice(index, 1);
            const container = document.getElementById('wizardStepContainer');
            if (container && window.currentStep === 4) container.innerHTML = renderStep4Content();
        };

        // Automatic track count adjustments when Release Type changes in Step 1
        window.adjustTracksForReleaseType = function() {
            const type = window.releaseState.metadata.type;
            if (type === 'Single') {
                window.releaseState.tracks = [window.releaseState.tracks[0] || {
                    metadata: { title: window.releaseState.metadata.title || '', explicit: false },
                    discNumber: 1
                }];
            }
        };

        // STEP 5 CONTENT
        function renderStep5Content() {
            return `
                <div class="space-y-4">
                    <div class="p-5 rounded-2xl bg-brand-dark border border-brand-border space-y-4 text-xs text-gray-300">
                        <h3 class="font-bold text-white text-sm">Legal & Copyright Affirmation</h3>
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" ${window.releaseState.agreements.termsAccepted ? 'checked' : ''} onchange="window.releaseState.agreements.termsAccepted = this.checked" class="mt-0.5 rounded border-brand-border">
                            <span>I certify that I am authorized to grant distribution rights for all masters, lyrics, and metadata supplied in this submission package.</span>
                        </label>
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" ${window.releaseState.agreements.rightsConfirmed ? 'checked' : ''} onchange="window.releaseState.agreements.rightsConfirmed = this.checked" class="mt-0.5 rounded border-brand-border">
                            <span>I confirm all underlying samples, interpolations, and performances are fully cleared for commercial distribution worldwide.</span>
                        </label>
                    </div>
                </div>
            `;
        }

        // STEP 6 CONTENT
        function renderStep6Content() {
            const s = window.releaseState;
            return `
                <div class="p-6 rounded-2xl bg-brand-dark border border-brand-border space-y-4 text-xs font-mono text-gray-300">
                    <h3 class="text-sm font-bold text-white">Release Submission Package Summary</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-b border-brand-border pb-4">
                        <div>
                            <p><strong class="text-gray-400">Title:</strong> ${s.metadata.title || 'Untitled'}</p>
                            <p><strong class="text-gray-400">Type:</strong> ${s.metadata.type}</p>
                            <p><strong class="text-gray-400">Primary Genre:</strong> ${s.metadata.primaryGenre || 'N/A'}</p>
                            <p><strong class="text-gray-400">Subgenre:</strong> ${s.metadata.secondaryGenre || 'N/A'}</p>
                        </div>
                        <div>
                            <p><strong class="text-gray-400">Artists:</strong> ${s.artists.map(a => a.name).filter(Boolean).join(', ') || 'None'}</p>
                            <p><strong class="text-gray-400">Release Date:</strong> ${s.dates.releaseDate || 'Immediate'}</p>
                            <p><strong class="text-gray-400">Selected Stores:</strong> ${s.dsps.length} Platforms</p>
                            <p><strong class="text-gray-400">Total Tracks:</strong> ${s.tracks.length}</p>
                        </div>
                    </div>
                    <div class="text-[11px] text-cyan-400">
                        ✓ All required fields compiled. Ready to dispatch assets to Cloudflare R2 and gateway API.
                    </div>
                </div>
            `;
        }

        // Final Submission Handler
        window.handleFormSubmission = async function(event) {
            event.preventDefault();
            
            if (!window.releaseState.agreements.termsAccepted) {
                return window.showToast('Please confirm rights affirmation in Step 5 before submitting.');
            }

            try {
                window.showToast('Preparing release assets...', false);
                
                // Artwork upload if file selected
                if (window.releaseState.artwork.file) {
                    window.showToast('Uploading cover artwork to Cloudflare R2...', false);
                    const coverUrl = await uploadFileToR2(window.releaseState.artwork.file, 'artwork');
                    window.releaseState.artwork.url = coverUrl;
                }

                // Audio tracks upload if local files selected
                for (let i = 0; i < window.releaseState.tracks.length; i++) {
                    if (window.releaseState.tracks[i].audioFile) {
                        window.showToast(`Uploading track ${i + 1} audio master...`, false);
                        const trackUrl = await uploadFileToR2(window.releaseState.tracks[i].audioFile, 'audio');
                        window.releaseState.tracks[i].audioUrl = trackUrl;
                    }
                }

                // Payload construction for Too Lost / Worker Gateway
                const payload = {
                    title: window.releaseState.metadata.title,
                    type: window.releaseState.metadata.type,
                    language: window.releaseState.metadata.language,
                    genre: window.releaseState.metadata.primaryGenre,
                    subgenre: window.releaseState.metadata.secondaryGenre,
                    artists: window.releaseState.artists,
                    label: window.releaseState.label,
                    releaseDate: window.releaseState.dates.releaseDate,
                    timezone: window.releaseState.dates.timezone,
                    dsps: window.releaseState.dsps,
                    cover_url: window.releaseState.artwork.url,
                    tracks: window.releaseState.tracks.map(t => ({
                        title: t.metadata.title,
                        version: t.metadata.version,
                        explicit: t.metadata.explicit,
                        isrc: t.isrc,
                        audio_url: t.audioUrl,
                        tiktok_start_time: t.tiktokStartTime,
                        lyrics: t.lyrics?.plain
                    })),
                    submittedBy: window.currentUser ? window.currentUser.uid : 'anonymous',
                    createdAt: new Date().toISOString()
                };

                const token = await window.currentUser.getIdToken();
                const res = await fetch(`${WORKER_BASE_URL}/api/releases`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Failed to create release on server API');

                window.showToast('Release submitted successfully!', false);
                await loadLiveCatalog();
                window.switchView('catalog');

            } catch (err) {
                console.error('Submission Error:', err);
                window.showToast(`Submission failed: ${err.message}`);
            }
        };

    </script>
</body>
</html>
