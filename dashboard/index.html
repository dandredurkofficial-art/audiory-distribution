        // Auth Observer Hook
        onAuthStateChanged(auth, async (user) => {
            if (user) {

                document.getElementById('userName').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('userEmail').innerText = user.email;

                window.location.href = '/login/';
            }
        });

        window.handleSignOut = () => signOut(auth).then(() => window.location.href = '/login/');

        // Fetch Live Releases from Firestore
        async function loadLiveCatalog() {
            try {
                const q = query(collection(db, "releases"), where("userId", "==", window.currentUser.uid));
                const querySnapshot = await getDocs(q);
                window.releasesCatalog = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (err) {
                console.error("Error loading live catalog:", err);
            }
        }

        // Direct R2 Binary Upload via Cloudflare Worker Pre-Signed URLs
        async function uploadFileToR2(file, folder = 'audio') {
            const fileName = `${folder}/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
            const token = await window.currentUser.getIdToken();

            const res = await fetch(`${WORKER_BASE_URL}/api/presigned-url`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ key: fileName, contentType: file.type })
            });

            if (!res.ok) throw new Error('Failed to retrieve upload URL from Worker');
            const { uploadUrl, publicUrl } = await res.json();

            // Direct binary PUT to R2 Bucket
            const uploadRes = await fetch(uploadUrl, {
                method: 'PUT',
                headers: { 'Content-Type': file.type },
                body: file
            });

            if (!uploadRes.ok) throw new Error('Failed uploading binary to Cloudflare R2');
            return publicUrl;
        }

                    <button type="button" id="nextStepBtn" onclick="navigateStep(1)" class="px-4 py-2 rounded-lg bg-brand-accent text-brand-dark text-xs font-bold">Next Step</button>
                    <button type="submit" id="submitReleaseBtn" class="hidden px-6 py-2 rounded-lg bg-emerald-500 text-black text-xs font-bold">Upload & Submit Release</button>
                </div>
            </form>
        </div>
    `;
};

// 4. File Quality Inspection
async function inspectImageFile(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = (e) => {
            const arr = (new Uint8Array(e.target.result)).subarray(0, 4);
            let header = "";
            for (let i = 0; i < arr.length; i++) header += arr[i].toString(16);
            
            let mime = "unknown";
            if (header.startsWith("89504e47")) mime = "image/png";
            else if (header.startsWith("ffd8ff")) mime = "image/jpeg";

            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                resolve({ mime, width: img.width, height: img.height, valid: (mime !== "unknown" && img.width >= 3000 && img.height >= 3000) });
            };
        };
        reader.readAsArrayBuffer(file.slice(0, 4));
    });
}

async function inspectAudioFile(file) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

    return {
        filename: file.name,
        format: file.name.split('.').pop().toUpperCase(),
        sampleRate: `${audioBuffer.sampleRate / 1000} kHz`,
        bitDepth: '24-bit (inspected)',
        channels: audioBuffer.numberOfChannels === 2 ? 'Stereo' : 'Mono',
        duration: `${Math.floor(audioBuffer.duration / 60).toString().padStart(2, '0')}:${Math.floor(audioBuffer.duration % 60).toString().padStart(2, '0')}`,
        fileSize: `${(file.size / (1024 * 1024)).toFixed(2)} MB`
    };
}

// 5. Dynamic Track Control Functions
window.addTrackToState = function() {

        isrc: '',
        artists: [{ name: '', role: 'Primary Artist' }],
        contributors: [],
        writers: [{ name: '', role: 'Composer', ipi: '' }],

window.removeTrackFromState = function(idx) {

// 6. Step 2 UI Renderer
function renderStep2() {

window.toggleDsp = function(dsp, isChecked) {
    if (isChecked && !window.releaseState.dsps.includes(dsp)) {

    } else if (!isChecked) {
        window.releaseState.dsps = window.releaseState.dsps.filter(d => d !== dsp);

};

// 7. Step Validation Engine
function validateCurrentStep() {
    const state = window.releaseState;
    if (window.currentStep === 1) {
        if (!state.metadata.title) return "Release Title is required.";
        if (!state.artists.some(a => a.name)) return "At least one Artist Name is required.";
        if (!state.label.name || !state.label.cLine || !state.label.pLine) return "Record Label and Copyright lines are required.";
    }
    if (window.currentStep === 2) {
        if (!state.dates.releaseDate) return "Digital Release Date is required.";
        if (state.dsps.length === 0) return "Please select at least one DSP.";
    }
    if (window.currentStep === 3) {
        if (!state.artwork.file) return "Artwork upload is required.";
        if (state.artwork.inspected && !state.artwork.inspected.valid) {
            return "Artwork fails DDEX validation (Must be PNG/JPG and at least 3000x3000px).";
        }
    }
    if (window.currentStep === 4) {
        for (let i = 0; i < state.tracks.length; i++) {
            const t = state.tracks[i];
            if (!t.metadata.title) return `Track #${i + 1} requires a Title.`;
            if (!t.audioFile) return `Track #${i + 1} requires an Audio Binary.`;
        }
    }
    return null;
}

// 8. Navigation Control
window.navigateStep = async function(direction) {
    if (direction === 1) {
        const error = validateCurrentStep();
        if (error) {
            alert(error);
            return;
        }
    }

    const next = window.currentStep + direction;
    if (next < 1 || next > 6) return;

    document.getElementById(`step_${window.currentStep}_content`).classList.add('hidden');
    document.getElementById(`step_tab_${window.currentStep}`).className = "p-2 rounded-lg bg-brand-card text-gray-400 border border-brand-border";

    window.currentStep = next;

    document.getElementById(`step_${window.currentStep}_content`).classList.remove('hidden');
    document.getElementById(`step_tab_${window.currentStep}`).className = "p-2 rounded-lg bg-brand-accent text-brand-dark font-bold";
    document.getElementById('stepCounter').innerText = window.currentStep;

    document.getElementById('prevStepBtn').disabled = (window.currentStep === 1);

    if (window.currentStep === 1) renderStep1();
    if (window.currentStep === 2) renderStep2();
    if (window.currentStep === 4) renderTracksEditor();
    if (window.currentStep === 6) renderDeliverySummary();

    if (window.currentStep === 6) {
        document.getElementById('nextStepBtn').classList.add('hidden');
        document.getElementById('submitReleaseBtn').classList.remove('hidden');
    } else {
        document.getElementById('nextStepBtn').classList.remove('hidden');
        document.getElementById('submitReleaseBtn').classList.add('hidden');
    }
};

window.mockFetchArtistProfile = function(idx) {
    const name = window.releaseState.artists[idx].name;
    if (!name) return alert('Please enter an artist name first.');
    window.releaseState.artists[idx].isNew = false;
    window.releaseState.artists[idx].spotifyId = `spotify:artist:${Math.random().toString(36).substring(7)}`;
    window.releaseState.artists[idx].appleId = `${Math.floor(100000000 + Math.random() * 900000000)}`;
    renderStep1();
};

// 10. Artwork Handler
window.handleCoverArtSelection = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    window.releaseState.artwork.file = file;
    const previewContainer = document.getElementById('artworkPreviewContainer');
    const previewImg = document.getElementById('artworkPreviewImg');
    const specsBox = document.getElementById('artworkSpecsBox');

    previewImg.src = URL.createObjectURL(file);
    previewContainer.classList.remove('hidden');

    const inspected = await inspectImageFile(file);
    window.releaseState.artwork.inspected = inspected;

    specsBox.innerHTML = `
        <p><strong>Inspected Format:</strong> ${inspected.mime}</p>
        <p><strong>Dimensions:</strong> ${inspected.width} x ${inspected.height} px</p>
        <p><strong>DDEX Quality Check:</strong> ${inspected.valid ? '<span class="text-emerald-400">PASSED</span>' : '<span class="text-red-400">FAILED (Must be PNG/JPG & ≥ 3000x3000px)</span>'}</p>
    `;
};

// 11. Tracks Editor & Inspection Renderer

function renderTechSpecs(specs) {
    return `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px]">

            <div><span class="text-gray-500">Sample Rate:</span> ${specs.sampleRate}</div>
            <div><span class="text-gray-500">Bit Depth:</span> ${specs.bitDepth}</div>
            <div><span class="text-gray-500">Channels:</span> ${specs.channels}</div>
            <div><span class="text-gray-500">Duration:</span> ${specs.duration}</div>
            <div><span class="text-gray-500">File Size:</span> ${specs.fileSize}</div>
        </div>
    `;
}

window.handleTrackAudioUpload = async (e, index) => {
    const file = e.target.files[0];
    if (!file) return;

    window.releaseState.tracks[index].audioFile = file;
    const specs = await inspectAudioFile(file);
    window.releaseState.tracks[index].techSpecs = specs;
    renderTracksEditor();
};

function renderDeliverySummary() {
    const box = document.getElementById('deliverySummary');
    if (!box) return;
    box.innerHTML = `

        <p><strong>Label:</strong> ${window.releaseState.label.name || 'Unspecified'}</p>

    `;

// 12. Cloudflare R2 Upload Helper
async function uploadFileToR2(file, folder) {
    return `https://r2-storage.yourdomain.com/${folder}/${Date.now()}_${file.name}`;
}

// 13. Form Submission Handler
window.handleFormSubmission = async function(e) {
    e.preventDefault();
    if (!window.releaseState.agreements.termsAccepted) {
        alert("You must accept the terms & rights confirmation before submitting.");
        return;
    }

    const btn = document.getElementById('submitReleaseBtn');
    btn.disabled = true;
    btn.innerHTML = `Processing Assets to R2...`;

    try {
        if (window.releaseState.artwork.file) {
            window.releaseState.artwork.url = await uploadFileToR2(window.releaseState.artwork.file, 'artworks');
        }

        for (let i = 0; i < window.releaseState.tracks.length; i++) {
            if (window.releaseState.tracks[i].audioFile) {
                window.releaseState.tracks[i].audioUrl = await uploadFileToR2(window.releaseState.tracks[i].audioFile, 'audio');
            }
        }

        const token = await window.currentUser.getIdToken();
        const res = await fetch(`${WORKER_BASE_URL}/api/releases/submit`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                ...window.releaseState,
                userId: window.currentUser.uid,
                auditHistory: [{ action: 'SUBMITTED', timestamp: new Date().toISOString(), user: window.currentUser.email }]
            })
        });

        if (!res.ok) throw new Error('Worker rejected submission pipeline.');

        alert('Release successfully dispatched to Too Lost Distribution!');
        switchView('catalog');

    } catch (err) {
        console.error('Submission Error:', err);
        alert(`Error delivering release: ${err.message}`);
    } finally {
        btn.disabled = false;
        btn.innerHTML = `Upload & Submit Release`;
    }
};

}
