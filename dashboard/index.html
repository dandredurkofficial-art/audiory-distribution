<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiory Distribution Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0F17',
                            card: '#121824',
                            border: '#1E293B',
                            accent: '#00F2FE',
                            hover: '#1A2333',
                            text: '#94A3B8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F17; color: #F8FAFC; }
        .too-lost-input { width: 100%; background-color: #0B0F17; border: 1px solid #1E293B; border-radius: 0.75rem; padding: 0.65rem 1rem; color: #ffffff; font-size: 0.875rem; outline: none; transition: all 0.2s; }
        .too-lost-input:focus { border-color: #00F2FE; box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.15); }
        .too-lost-form-label { display: block; font-size: 0.75rem; font-weight: 600; color: #94A3B8; margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F17; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00F2FE; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-brand-dark text-slate-100 overflow-x-hidden">

    <!-- Mobile Header Navigation -->
    <header class="lg:hidden flex items-center justify-between p-4 bg-brand-card border-b border-brand-border sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-black shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-wave-square text-xs"></i>
            </div>
            <span class="font-bold tracking-wider text-sm font-display text-white">AUDIORY</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="switchView('create')" class="px-3 py-1.5 rounded-lg bg-brand-accent text-brand-dark font-bold text-xs flex items-center gap-1.5 shadow-md shadow-cyan-500/10">
                <i class="fa-solid fa-plus text-[10px]"></i> New Release
            </button>
            <button onclick="toggleMobileSidebar()" class="p-2 rounded-lg bg-brand-dark border border-brand-border text-gray-300">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 relative">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebarNav" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-brand-card border-r border-brand-border flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
            <!-- Brand Logo -->
            <div class="p-5 border-b border-brand-border flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-black shadow-lg shadow-cyan-500/20">
                        <i class="fa-solid fa-wave-square text-sm"></i>
                    </div>
                    <div>
                        <h1 class="font-black text-sm tracking-widest text-white">AUDIORY</h1>
                        <p class="text-[10px] text-brand-accent font-mono uppercase tracking-wider">Distribution Hub</p>
                    </div>
                </div>
                <button onclick="toggleMobileSidebar()" class="lg:hidden text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- User Mini Profile -->
            <div class="p-4 mx-3 my-3 rounded-xl bg-brand-dark border border-brand-border flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-8 h-8 rounded-lg bg-cyan-500/20 text-brand-accent font-bold flex items-center justify-center text-xs border border-cyan-500/30 flex-shrink-0">IK</div>
                    <div class="overflow-hidden">
                        <p class="text-xs font-bold text-white truncate">ismael kea</p>
                        <p class="text-[10px] text-gray-400 truncate">ismaelkea818@gmail.com</p>
                    </div>
                </div>
                <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.6)] flex-shrink-0" title="Connected"></span>
            </div>

            <!-- Nav Links -->
            <nav class="flex-1 px-3 space-y-1.5 overflow-y-auto py-2">
                <p class="px-3 pb-2 text-[10px] font-bold text-gray-500 uppercase tracking-widest">Core Workspace</p>
                <button onclick="switchView('home')" id="nav_home" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-brand-accent bg-brand-dark border border-brand-border/80 transition-all">
                    <i class="fa-solid fa-house w-4"></i> Dashboard Home
                </button>
                <button onclick="switchView('catalog')" id="nav_catalog" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-compact-disc w-4"></i> Releases Catalog
                </button>
                <button onclick="switchView('create')" id="nav_create" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-circle-plus w-4 text-cyan-400"></i> Create New Release
                </button>
                <button onclick="switchView('analytics')" id="nav_analytics" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-chart-line w-4"></i> Analytics & Earnings
                </button>
                <button onclick="switchView('settings')" id="nav_settings" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-sliders w-4"></i> Settings & Payouts
                </button>
            </nav>

            <!-- Sidebar Footer Status -->
            <div class="p-4 border-t border-brand-border bg-brand-card/50 flex items-center justify-between text-[11px] text-gray-400">
                <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Too Lost API Ready</span>
                <i class="fa-solid fa-gear text-gray-500 hover:text-white cursor-pointer" onclick="switchView('settings')"></i>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="flex-1 flex flex-col min-w-0 bg-brand-dark">
            
            <!-- Top Nav Bar (Desktop) -->
            <header class="hidden lg:flex items-center justify-between px-8 py-4 bg-brand-card border-b border-brand-border">
                <div class="flex items-center gap-3 max-w-md w-full relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-xs text-gray-500"></i>
                    <input type="text" placeholder="Search catalog, UPCs, ISRCs, or artists..." class="too-lost-input pl-9 py-2 text-xs bg-brand-dark/60">
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="switchView('create')" class="px-4 py-2 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs hover:bg-cyan-300 transition-all flex items-center gap-2 shadow-lg shadow-cyan-500/10">
                        <i class="fa-solid fa-plus text-[10px]"></i> New Release
                    </button>
                    <div class="flex items-center gap-3 pl-4 border-l border-brand-border">
                        <div class="w-8 h-8 rounded-xl bg-cyan-500/20 text-brand-accent font-bold flex items-center justify-center text-xs border border-cyan-500/30">IS</div>
                        <div>
                            <p class="text-xs font-bold text-white">ismael kea</p>
                            <p class="text-[9px] text-cyan-400 font-mono tracking-wider">Verified Label Portal</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dynamic Viewport Area -->
            <div id="mainViewport" class="flex-1 p-4 sm:p-8 overflow-y-auto">
                <!-- Injected dynamically via JS router -->
            </div>
        </main>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Global State & Mock DB storage
        window.userState = { uid: "user_ismael_kea_01" };
        window.releasesCatalog = [
            {
                id: "rel_01",
                title: "Cybernetic Genesis",
                artist: "Official Bigi",
                type: "Single",
                genre: "Electronic",
                upc: "198429104821",
                status: "Live on DSPs",
                releaseDate: "2026-06-15",
                coverUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80",
                tracks: [{ name: "Cybernetic Genesis", isrc: "US-AUD-26-10042", audioFileName: "cybernetic_master_final.wav" }]
            }
        ];
        window.formTrackList = [
            { id: Date.now(), name: '', version: '', language: 'English', artists: [{ name: 'Official Bigi', role: 'Primary' }], writers: [{ name: '', role: 'Writer' }], audioFileName: null }
        ];

        // Router View Switching
        function switchView(viewName) {
            // Update active styles on sidebar
            ['home', 'catalog', 'create', 'analytics', 'settings'].forEach(v => {
                const btn = document.getElementById(`nav_${v}`);
                if (btn) {
                    if (v === viewName) {
                        btn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-brand-accent bg-brand-dark border border-brand-border/80 transition-all";
                    } else {
                        btn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all";
                    }
                }
            });

            const viewport = document.getElementById('mainViewport');
            if (viewName === 'home') viewport.innerHTML = renderHomeView();
            if (viewName === 'catalog') viewport.innerHTML = renderCatalogView();
            if (viewName === 'create') viewport.innerHTML = renderCreateReleaseView();
            if (viewName === 'analytics') viewport.innerHTML = renderAnalyticsView();
            if (viewName === 'settings') viewport.innerHTML = renderSettingsView();

            // Close mobile sidebar if open
            const sidebar = document.getElementById('sidebarNav');
            if (!sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
            }
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebarNav');
            sidebar.classList.toggle('-translate-x-full');
        }

        // 1. HOME VIEW
        function renderHomeView() {
            const totalStreams = window.releasesCatalog.length * 14250;
            return `
                <div class="max-w-7xl mx-auto space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-brand-border/60">
                        <div>
                            <h1 class="text-2xl font-bold text-white tracking-tight">Welcome back, <span class="text-brand-accent">ismael kea</span></h1>
                            <p class="text-xs text-gray-400">Real-time stats and Too Lost distribution pipeline management.</p>
                        </div>
                        <button onclick="switchView('create')" class="px-5 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs hover:bg-cyan-300 transition-all flex items-center gap-2 shadow-lg shadow-cyan-500/10 self-start sm:self-auto">
                            <i class="fa-solid fa-plus text-[10px]"></i> New Release
                        </button>
                    </div>

                    <!-- Stat Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Total Streams</p>
                            <h3 class="text-2xl font-black text-white font-mono">${totalStreams.toLocaleString()}</h3>
                            <span class="text-[10px] text-emerald-400 flex items-center gap-1 font-semibold"><i class="fa-solid fa-arrow-trend-up"></i> +12.4% this month</span>
                        </div>
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Available Royalties</p>
                            <h3 class="text-2xl font-black text-brand-accent font-mono">$1,420.50</h3>
                            <span class="text-[10px] text-gray-400">Ready for direct payout</span>
                        </div>
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Active Catalog</p>
                            <h3 class="text-2xl font-black text-white font-mono">${window.releasesCatalog.length}</h3>
                            <span class="text-[10px] text-cyan-400">Global DSP Delivery</span>
                        </div>
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Too Lost API Connection</p>
                            <div class="flex items-center gap-2 pt-1">
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span class="text-xs font-bold text-emerald-400">Connected & Ready</span>
                            </div>
                            <span class="text-[10px] text-gray-400">Encrypted pipeline sync</span>
                        </div>
                    </div>

                    <!-- Recent Catalog Feed -->
                    <div class="p-6 rounded-2xl bg-brand-card border border-brand-border space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm font-bold text-white uppercase tracking-wider font-mono">Recent Deliveries</h2>
                            <button onclick="switchView('catalog')" class="text-xs text-brand-accent hover:underline">View All Catalog</button>
                        </div>
                        <div class="divide-y divide-brand-border">
                            ${window.releasesCatalog.map(rel => `
                                <div class="py-3 flex items-center justify-between gap-4">
                                    <div class="flex items-center gap-3">
                                        <img src="${rel.coverUrl}" class="w-10 h-10 rounded-lg object-cover border border-brand-border">
                                        <div>
                                            <p class="text-xs font-bold text-white">${rel.title}</p>
                                            <p class="text-[10px] text-gray-400">${rel.artist} • UPC: ${rel.upc}</p>
                                        </div>
                                    </div>
                                    <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-cyan-500/10 text-brand-accent border border-cyan-500/20">${rel.status}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. CATALOG VIEW
        function renderCatalogView() {
            return `
                <div class="max-w-7xl mx-auto space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-brand-border/60">
                        <div>
                            <h1 class="text-2xl font-bold text-white tracking-tight">Releases Catalog</h1>
                            <p class="text-xs text-gray-400">Manage your active music catalog, check ISRCs, and monitor DSP distribution status.</p>
                        </div>
                        <button onclick="switchView('create')" class="px-5 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs hover:bg-cyan-300 transition-all flex items-center gap-2 shadow-lg shadow-cyan-500/10 self-start sm:self-auto">
                            <i class="fa-solid fa-plus text-[10px]"></i> Create Release
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${window.releasesCatalog.map(rel => `
                            <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-4 hover:border-cyan-500/40 transition-all flex flex-col justify-between">
                                <div class="space-y-3">
                                    <div class="relative aspect-square rounded-xl overflow-hidden bg-brand-dark border border-brand-border">
                                        <img src="${rel.coverUrl}" class="w-full h-full object-cover">
                                        <span class="absolute top-3 right-3 px-2 py-0.5 rounded-md text-[10px] font-bold bg-black/70 backdrop-blur text-brand-accent border border-brand-border">${rel.type}</span>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-white text-sm truncate">${rel.title}</h3>
                                        <p class="text-xs text-gray-400">${rel.artist}</p>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2 text-[11px] font-mono pt-2 border-t border-brand-border">
                                        <div><span class="text-gray-500 block text-[9px] uppercase">UPC Code</span><span class="text-white">${rel.upc}</span></div>
                                        <div><span class="text-gray-500 block text-[9px] uppercase">Genre</span><span class="text-white">${rel.genre}</span></div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between pt-3 border-t border-brand-border">
                                    <span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">${rel.status}</span>
                                    <button onclick="alert('Viewing metadata & asset details for UPC: ${rel.upc}')" class="text-xs text-brand-accent hover:underline font-semibold">Manage Release</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 3. CREATE NEW RELEASE VIEW
        function renderCreateReleaseView() {
            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="pb-4 border-b border-brand-border/60">
                        <h1 class="text-2xl font-bold font-display text-white">Create New Release</h1>
                        <p class="text-xs text-gray-400">Complete all technical metadata fields to trigger release submission through Too Lost APIs.</p>
                    </div>

                    <form id="productionReleaseForm" onsubmit="handleProductionFormSubmit(event)" class="space-y-8 bg-brand-card p-6 sm:p-8 rounded-2xl border border-brand-border">
                        
                        <!-- 1. COVER ART SECTION -->
                        <div class="space-y-4">
                            <h3 class="text-sm font-bold text-brand-accent uppercase tracking-wider font-mono">1. Artwork & Cover Art</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
                                <div class="space-y-2">
                                    <label class="too-lost-form-label">Cover Art (3000x3000px)</label>
                                    <div class="w-full aspect-square rounded-xl bg-brand-dark border-2 border-dashed border-brand-border flex flex-col items-center justify-center p-4 text-center relative group overflow-hidden">
                                        <img id="coverArtPreview" class="absolute inset-0 w-full h-full object-cover hidden">
                                        <i class="fa-solid fa-music text-4xl text-gray-600 mb-2 group-hover:scale-110 transition-transform"></i>
                                        <span class="text-[10px] text-gray-400 mb-2">Select Artwork File</span>
                                        <input type="file" id="coverArtFileInput" accept="image/*" onchange="handleCoverArtUpload(event)" required class="absolute inset-0 opacity-0 cursor-pointer">
                                        <button type="button" class="px-3 py-1.5 rounded bg-white text-black font-bold text-[10px] shadow pointer-events-none">Upload Cover Art</button>
                                    </div>
                                </div>
                                <div class="md:col-span-2 space-y-4">
                                    <label class="too-lost-form-label">Generative AI tools used in cover art?</label>
                                    <div class="flex items-center gap-6 text-xs text-gray-300">
                                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="aiCoverArt" value="None" checked class="accent-brand-accent"> None</label>
                                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="aiCoverArt" value="Some" class="accent-brand-accent"> Some</label>
                                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="aiCoverArt" value="All" class="accent-brand-accent"> All</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. RELEASE METADATA -->
                        <div class="space-y-4 pt-6 border-t border-brand-border">
                            <h3 class="text-sm font-bold text-brand-accent uppercase tracking-wider font-mono">2. Release Metadata</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="too-lost-form-label">Release Title *</label>
                                    <input type="text" id="releaseTitle" required placeholder="Release Title" class="too-lost-input">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Release Version</label>
                                    <input type="text" id="releaseVersion" placeholder="Deluxe / Remix" class="too-lost-input">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Metadata Language</label>
                                    <select id="metadataLanguage" class="too-lost-input">
                                        <option value="English">English</option>
                                        <option value="Spanish">Spanish</option>
                                        <option value="French">French</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="too-lost-form-label">Primary Artists *</label>
                                    <input type="text" id="primaryArtists" required value="Official Bigi" class="too-lost-input">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Format Type *</label>
                                    <select id="releaseFormatType" onchange="handleFormatTypeChange(this.value)" class="too-lost-input font-bold text-brand-accent">
                                        <option value="Single">Single Release (1 Track)</option>
                                        <option value="EP">EP (2-6 Tracks)</option>
                                        <option value="Album">Album (7+ Tracks)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="too-lost-form-label">UPC</label>
                                    <input type="text" readonly value="Assigned on submission" class="too-lost-input bg-brand-dark/50 text-gray-500 font-mono">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Genre *</label>
                                    <select id="genreSelect" required class="too-lost-input">
                                        <option value="">Please select</option>
                                        <option value="Pop">Pop</option>
                                        <option value="Hip-Hop/Rap">Hip-Hop/Rap</option>
                                        <option value="Electronic">Electronic</option>
                                        <option value="Afrobeats">Afrobeats</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Label Name</label>
                                    <input type="text" id="labelName" value="Audiory Distribution" class="too-lost-input">
                                </div>
                            </div>
                        </div>

                        <!-- 3. TRACKS & AUDIO DETAILS SECTION -->
                        <div class="space-y-6 pt-6 border-t border-brand-border">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h3 class="text-sm font-bold text-brand-accent uppercase tracking-wider font-mono">3. Track Details & Audio Files</h3>
                                    <p class="text-xs text-gray-400">Upload uncompressed WAV/FLAC audio files.</p>
                                </div>
                                <button type="button" id="addTrackBtn" onclick="addNewTrackItem()" class="hidden px-3.5 py-2 rounded-lg bg-brand-accent text-brand-dark font-bold text-xs hover:bg-cyan-300 transition-all flex items-center gap-2">
                                    <i class="fa-solid fa-plus"></i> Add Track
                                </button>
                            </div>
                            <div id="tracksContainer" class="space-y-6">
                                <!-- Dynamic track cards rendered here -->
                            </div>
                        </div>

                        <!-- 4. TIMELINE & TERRITORIES -->
                        <div class="space-y-4 pt-6 border-t border-brand-border">
                            <h3 class="text-sm font-bold text-brand-accent uppercase tracking-wider font-mono">4. Release Timeline</h3>
                            <div class="p-4 rounded-xl bg-brand-dark border border-brand-border grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="too-lost-form-label">Target Release Date *</label>
                                    <input type="date" id="targetReleaseDate" required class="too-lost-input">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Territory Rights</label>
                                    <select id="territoryRights" class="too-lost-input">
                                        <option value="Worldwide">Worldwide (All Territories)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- FORM ACTIONS -->
                        <div class="pt-6 border-t border-brand-border flex justify-between items-center">
                            <button type="button" onclick="switchView('catalog')" class="px-6 py-2.5 rounded-xl border border-brand-border bg-brand-dark text-xs text-gray-300 font-semibold">Cancel</button>
                            <button type="submit" id="submitProductionFormBtn" class="px-8 py-3 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs hover:bg-cyan-300 transition-all flex items-center gap-2 shadow-xl">
                                <i class="fa-solid fa-floppy-disk"></i> Save & Submit Release
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        // Render Track Cards Helper
        window.renderTrackCards = function() {
            const container = document.getElementById('tracksContainer');
            if (!container) return;

            container.innerHTML = window.formTrackList.map((track, idx) => `
                <div class="p-5 rounded-2xl bg-brand-dark border border-brand-border space-y-6">
                    <div class="flex items-center justify-between border-b border-brand-border pb-3">
                        <span class="text-xs font-bold text-white font-mono flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-brand-card border border-brand-border flex items-center justify-center text-brand-accent">${idx + 1}</span>
                            Track Audio & Metadata
                        </span>
                        ${window.formTrackList.length > 1 ? `<button type="button" onclick="removeTrackItem(${idx})" class="text-gray-500 hover:text-red-400 text-xs"><i class="fa-solid fa-trash-can"></i> Remove</button>` : ''}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="too-lost-form-label">Audio File (WAV / FLAC)</label>
                            <div class="relative">
                                <input type="file" accept="audio/*" onchange="handleTrackAudioUpload(event, ${idx})" class="too-lost-input opacity-0 absolute inset-0 cursor-pointer">
                                <div class="too-lost-input truncate text-gray-400 flex items-center justify-between pointer-events-none">
                                    <span>${track.audioFileName || 'Choose audio file...'}</span>
                                    <i class="fa-solid fa-file-audio text-brand-accent"></i>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="too-lost-form-label">ISRC Code</label>
                            <div class="flex gap-2">
                                <input type="text" id="isrc_${idx}" value="${track.isrc || ''}" placeholder="Auto-generated" class="too-lost-input font-mono flex-1">
                                <button type="button" onclick="generateIsrcForTrack(${idx})" class="px-3 py-1.5 bg-black text-white text-[10px] font-bold rounded border border-brand-border">Generate</button>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="too-lost-form-label">Song Name *</label>
                            <input type="text" required onchange="window.formTrackList[${idx}].name = this.value" value="${track.name}" placeholder="Track Title" class="too-lost-input">
                        </div>
                        <div>
                            <label class="too-lost-form-label">Writers & Composers *</label>
                            <input type="text" required placeholder="Full Legal Name" class="too-lost-input">
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.handleFormatTypeChange = function(type) {
            const addBtn = document.getElementById('addTrackBtn');
            if (type === 'Single') {
                window.formTrackList = [window.formTrackList[0]];
                if (addBtn) addBtn.classList.add('hidden');
            } else {
                if (addBtn) addBtn.classList.remove('hidden');
            }
            renderTrackCards();
        };

        window.addNewTrackItem = function() {
            window.formTrackList.push({ id: Date.now(), name: '', version: '', language: 'English', artists: [{ name: 'Official Bigi', role: 'Primary' }], writers: [{ name: '', role: 'Writer' }], audioFileName: null });
            renderTrackCards();
        };

        window.removeTrackItem = function(idx) {
            window.formTrackList.splice(idx, 1);
            renderTrackCards();
        };

        window.handleCoverArtUpload = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const preview = document.getElementById('coverArtPreview');
                    preview.src = evt.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        window.handleTrackAudioUpload = function(e, idx) {
            const file = e.target.files[0];
            if (file) {
                window.formTrackList[idx].audioFileName = file.name;
                renderTrackCards();
            }
        };

        window.generateIsrcForTrack = function(idx) {
            const isrc = "US-AUD-26-" + Math.floor(10000 + Math.random() * 90000);
            window.formTrackList[idx].isrc = isrc;
            const field = document.getElementById(`isrc_${idx}`);
            if (field) field.value = isrc;
        };

        window.handleProductionFormSubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitProductionFormBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Submitting to Too Lost Pipeline...`;

            setTimeout(() => {
                const newRel = {
                    id: "rel_" + Date.now(),
                    title: document.getElementById('releaseTitle').value,
                    artist: document.getElementById('primaryArtists').value,
                    type: document.getElementById('releaseFormatType').value,
                    genre: document.getElementById('genreSelect').value,
                    upc: "19" + Math.floor(10000000000 + Math.random() * 90000000000).toString(),
                    status: 'Live on DSPs',
                    releaseDate: document.getElementById('targetReleaseDate').value,
                    coverUrl: document.getElementById('coverArtPreview').src || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400',
                    tracks: window.formTrackList
                };
                window.releasesCatalog.unshift(newRel);
                switchView('catalog');
            }, 1000);
        };

        // 4. ANALYTICS & EARNINGS VIEW
        function renderAnalyticsView() {
            return `
                <div class="max-w-7xl mx-auto space-y-6">
                    <div class="pb-4 border-b border-brand-border/60">
                        <h1 class="text-2xl font-bold text-white tracking-tight">Analytics & Earnings</h1>
                        <p class="text-xs text-gray-400">Stream telemetry, platform breakdowns, and royalty revenue reports.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div class="p-6 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Total Revenue</p>
                            <h3 class="text-3xl font-black text-white font-mono">$1,420.50</h3>
                        </div>
                        <div class="p-6 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Spotify Streams</p>
                            <h3 class="text-3xl font-black text-brand-accent font-mono">42,850</h3>
                        </div>
                        <div class="p-6 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Apple Music Streams</p>
                            <h3 class="text-3xl font-black text-white font-mono">18,210</h3>
                        </div>
                    </div>

                    <div class="p-6 rounded-2xl bg-brand-card border border-brand-border space-y-4">
                        <h2 class="text-sm font-bold text-white uppercase tracking-wider font-mono">DSP Breakdown</h2>
                        <div class="space-y-3">
                            <div>
                                <div class="flex justify-between text-xs mb-1"><span>Spotify</span><span class="font-mono">65%</span></div>
                                <div class="w-full h-2 rounded-full bg-brand-dark"><div class="h-full bg-brand-accent rounded-full" style="width: 65%;"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs mb-1"><span>Apple Music</span><span class="font-mono">25%</span></div>
                                <div class="w-full h-2 rounded-full bg-brand-dark"><div class="h-full bg-blue-500 rounded-full" style="width: 25%;"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between text-xs mb-1"><span>TikTok / IG</span><span class="font-mono">10%</span></div>
                                <div class="w-full h-2 rounded-full bg-brand-dark"><div class="h-full bg-purple-500 rounded-full" style="width: 10%;"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. SETTINGS & PAYOUTS VIEW
        function renderSettingsView() {
            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="pb-4 border-b border-brand-border/60">
                        <h1 class="text-2xl font-bold text-white tracking-tight">Settings & Payouts</h1>
                        <p class="text-xs text-gray-400">Manage account preferences, artist profiles, and payout accounts.</p>
                    </div>

                    <div class="space-y-6 bg-brand-card p-6 sm:p-8 rounded-2xl border border-brand-border">
                        <div class="space-y-4">
                            <h3 class="text-sm font-bold text-brand-accent uppercase tracking-wider font-mono">Account Information</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="too-lost-form-label">Full Name</label>
                                    <input type="text" value="ismael kea" class="too-lost-input">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Email Address</label>
                                    <input type="email" value="ismaelkea818@gmail.com" class="too-lost-input">
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4 pt-6 border-t border-brand-border">
                            <h3 class="text-sm font-bold text-brand-accent uppercase tracking-wider font-mono">Payout Gateway</h3>
                            <div class="p-4 rounded-xl bg-brand-dark border border-brand-border flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <i class="fa-solid fa-wallet text-xl text-brand-accent"></i>
                                    <div>
                                        <p class="text-xs font-bold text-white">Stripe Connect / Bank Transfer</p>
                                        <p class="text-[10px] text-gray-400">Connected account ready for automatic monthly payouts</p>
                                    </div>
                                </div>
                                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Active</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize default view on load
        document.addEventListener('DOMContentLoaded', () => {
            switchView('home');
        });
    </script>
</body>
</html>
