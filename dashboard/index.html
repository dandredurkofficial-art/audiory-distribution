        async function loadLiveCatalog() {
    try {
        const currentUid =
            window.currentUser
                ? (window.currentUser.uid || window.currentUser.id)
                : null;

        if (!currentUid) {
            window.releasesCatalog = [];
            renderCatalogView();
            return;
        }

        let serverReleases = [];

        // =========================================================
        // 1. FETCH LIVE DATA FROM TOO LOST THROUGH WORKER
        // =========================================================

        try {
            const token =
                await window.currentUser.getIdToken();

            const workerUrl =
                window.WORKER_BASE_URL || WORKER_BASE_URL;

            const res = await fetch(
                `${workerUrl}/api/releases`,
                {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                }
            );

            if (res.ok) {
                const data = await res.json();

                const rawList =
                    Array.isArray(data)
                        ? data
                        : (
                            data.data ||
                            data.releases ||
                            []
                        );

                serverReleases = rawList.filter(item => {
                    const itemUserId =
                        item.submittedBy ||
                        item.userId ||
                        item.user_id ||
                        item.uid;

                    return (
                        !itemUserId ||
                        String(itemUserId) === String(currentUid)
                    );
                });
            } else {
                console.error(
                    'Catalog API returned:',
                    res.status,
                    await res.text()
                );
            }

        } catch (fetchErr) {
            console.error(
                'API Gateway fetch error:',
                fetchErr
            );
        }

        // =========================================================
        // 2. LOAD LOCAL CACHE
        // =========================================================

        const userLocalStorageKey =
            `audiory_releases_${currentUid}`;

        let allLocalReleases = [];

        try {
            allLocalReleases =
                JSON.parse(
                    localStorage.getItem(
                        userLocalStorageKey
                    ) ||
                    localStorage.getItem(
                        'audiory_local_releases'
                    ) ||
                    '[]'
                );
        } catch (e) {
            allLocalReleases = [];
        }

        const localReleases =
            Array.isArray(allLocalReleases)
                ? allLocalReleases.filter(item => {
                    const itemUserId =
                        item.submittedBy ||
                        item.userId ||
                        item.user_id;

                    return (
                        !itemUserId ||
                        String(itemUserId) === String(currentUid)
                    );
                })
                : [];

        // =========================================================
        // 3. COVER RESOLVER
        // =========================================================

        const resolveCoverUrl = (item) => {
            if (!item) return '';

            if (typeof item.artwork === 'string') {
                return item.artwork;
            }

            if (
                item.artwork &&
                typeof item.artwork === 'object'
            ) {
                return (
                    item.artwork.url ||
                    item.artwork.cover_art ||
                    item.artwork.path ||
                    ''
                );
            }

            return (
                item.coverUrl ||
                item.compressedArtwork ||
                item.artworkUrl ||
                item.cover_url ||
                item.cover_art ||
                item.image ||
                ''
            );
        };

        // =========================================================
        // 4. MERGE
        // =========================================================

        const releaseMap = new Map();

        // ---------------------------------------------------------
        // LOCAL DATA FIRST
        // ---------------------------------------------------------

        localReleases.forEach(item => {
            if (!item?.id) return;

            const key = String(item.id);

            releaseMap.set(key, {
                ...item,
                submittedBy: currentUid,
                coverUrl: resolveCoverUrl(item),
                __fromTooLost: false
            });
        });

        // ---------------------------------------------------------
        // TOO LOST DATA LAST
        // ---------------------------------------------------------
        // This means Too Lost always wins for:
        // status
        // title
        // type
        // UPC
        // participants
        // releaseDate
        // etc.
        // ---------------------------------------------------------

        serverReleases.forEach(item => {
            if (!item?.id) return;

            const key = String(item.id);

            const existing =
                releaseMap.get(key);

            releaseMap.set(key, {
                ...(existing || {}),
                ...item,

                submittedBy:
                    item.submittedBy ||
                    existing?.submittedBy ||
                    currentUid,

                coverUrl:
                    resolveCoverUrl(item) ||
                    existing?.coverUrl ||
                    '',

                status:
                    item.status ??
                    item.releaseStatus ??
                    item.release_status ??
                    item.state ??
                    existing?.status ??
                    'Unknown',

                __fromTooLost: true
            });
        });
        // =========================================================
        // 5. FINAL CATALOG
        // =========================================================
        window.releasesCatalog =
            Array.from(
                releaseMap.values()
            );

        // =========================================================
        // 6. RENDER
        // =========================================================
        renderCatalogView();

    } catch (err) {
        console.error(
            'Error loading live catalog:',
            err
        );
    }
}
        
        // Direct Multipart Upload to Cloudflare Worker R2 Bucket
        async function uploadFileToR2(file, folder = 'audio') {
            const token = await window.currentUser.getIdToken();
            const formData = new FormData();
            formData.append('file', file);
            formData.append('folder', folder);

            const res = await fetch(`${WORKER_BASE_URL}/api/upload`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Worker upload failed with status ${res.status}: ${errText}`);
            }

            const data = await res.json();
            if (!data.success || !data.url) {
                throw new Error(`Upload failed: ${data.error || 'No public URL returned from Worker'}`);
            }

            return data.url;
        }

// Updated Dashboard Initialization Function
async function initHomeDashboard() {
    const catalogTbody = document.getElementById('home-recent-catalog-tbody');
    if (catalogTbody) {
        const catalog = window.releasesCatalog || [];
        if (catalog.length === 0) {
            catalogTbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-gray-500">No releases found. Click "New Release" to start.</td></tr>`;
        } else {
            catalogTbody.innerHTML = catalog.slice(0, 5).map(rel => {
                const title = rel.title || rel.metadata?.title || 'Untitled Release';
                const artistName = resolveArtistName(rel);

                let rawCover = rel.coverUrl || rel.compressedArtwork || rel.artworkUrl || rel.cover_url;
                if (!rawCover && rel.artwork) {
                    rawCover = typeof rel.artwork === 'string' ? rel.artwork : (rel.artwork.url || rel.artwork.cover_art);
                }
                const coverArt = (typeof rawCover === 'string' && rawCover.trim() !== '') ? rawCover : '';

                let status = rel.status || 'Submitted';
                if (status.toLowerCase() === 'draft' || status.toLowerCase().includes('gateway')) {
                    status = 'Submitted';
                }

                return `
                    <tr class="flex flex-col md:table-row border-b border-brand-border/50 hover:bg-white/5 transition-colors p-3 md:p-0 space-y-2 md:space-y-0">
                        <td class="py-1 md:py-3 px-0 md:px-2">
                            <div class="flex items-center gap-3 min-w-0">
                                ${coverArt 
                                    ? `<img src="${coverArt}" class="w-10 h-10 rounded-lg object-cover border border-brand-border/60 shrink-0" alt="Cover" />`
                                    : `<div class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center shrink-0"><i class="fa-solid fa-music text-gray-400"></i></div>`
                                }
                                <div class="min-w-0 flex-1">
                                    <span class="font-semibold text-white block truncate">${title}</span>
                                    <span class="text-gray-400 text-[11px] block md:hidden truncate">${artistName}</span>
                                </div>
                            </div>
                        </td>
                        <td class="hidden md:table-cell py-3 px-2 text-gray-300 max-w-[150px] truncate">${artistName}</td>
                        <td class="py-1 md:py-3 px-0 md:px-2 text-gray-400 font-mono text-[11px] md:text-xs flex md:table-cell justify-between items-center">
                            <span class="md:hidden text-gray-500">UPC:</span>
                            <span>${rel.upc || 'Pending'}</span>
                        </td>
                        <td class="py-1 md:py-3 px-0 md:px-2 md:text-right flex md:table-cell justify-between items-center">
                            <span class="md:hidden text-gray-500">Status:</span>
                            <span class="px-2 py-0.5 text-[10px] font-medium rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 capitalize">${status}</span>
                        </td>
                    </tr>
                `;
            }).join('');
        }
    }

    // Fetch Overview Analytics
    try {
        if (!window.currentUser) return;
        const token = typeof window.currentUser.getIdToken === 'function' 
            ? await window.currentUser.getIdToken() 
            : window.currentUser.accessToken;

        if (!token) return;

        const workerUrl = window.WORKER_BASE_URL || 'https://audiorydistribution.dandredurkofficial.workers.dev';
        const res = await fetch(`${workerUrl}/api/analytics/overview?period=lastThirtyDays`, {
            headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
        });

        if (res.ok) {
            const json = await res.json();
            const data = json.data || json;

            const streamsEl = document.getElementById('home-stat-streams');
            const savesEl = document.getElementById('home-stat-saves');
            const engEl = document.getElementById('home-stat-engagement');

            if (streamsEl) streamsEl.innerText = Number(data.totalStreams || 0).toLocaleString();
            if (savesEl) savesEl.innerText = Number(data.totalSaves || 0).toLocaleString();
            if (engEl) engEl.innerText = data.engagement ? Number(data.engagement).toFixed(2) + '%' : 'N/A';

            renderHomeChart(data.chart || []);
        }
    } catch (err) {
        console.error("Home Dashboard API error:", err);
    }
}
        
function renderHomeChart(chartData) {
    const canvas = document.getElementById('homeOverviewChart');
    if (!canvas) return;

    if (homeChartInstance) {
        homeChartInstance.destroy();
    }

    const labels = chartData.map(p => p.date);
    const streams = chartData.map(p => p.totalStreams);

    const ctx = canvas.getContext('2d');
    homeChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Streams',
                data: streams,
                borderColor: '#06b6d4',
                backgroundColor: 'rgba(6, 182, 212, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.35,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#9ca3af', font: { size: 10 } } },
                y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#9ca3af', font: { size: 10 } } }
            }
        }
    });
}

                                <th class="pb-3 px-2">Method</th>
                                <th class="pb-3 px-2">Details</th>

                            <option value="mpesa">M-Pesa</option>

                    <div class="pt-2 flex items-center justify-end gap-3">
                        <button type="button" onclick="closeWithdrawModal()" class="px-4 py-2 rounded-xl bg-white/5 text-gray-300 text-xs font-semibold hover:bg-white/10">Cancel</button>
                        <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-500 text-brand-dark font-bold text-xs hover:bg-emerald-400 transition">Submit Request</button>
                    </div>

            </div>
        </div>
    `;
}

let pieChartInstance = null;

async function getAuthToken() {
    const activeUser = window.currentUser || (window.auth && window.auth.currentUser);
    if (activeUser && typeof activeUser.getIdToken === 'function') {
        try {
            return await activeUser.getIdToken();
        } catch (err) {
            console.warn("Failed to get fresh Firebase token:", err);
        }
    }
    return localStorage.getItem('auth_token') || '';
}

function handleWithdrawClick() {
    const modal = document.getElementById('withdrawModal');
    const balInput = document.getElementById('modal-available-balance');
    const userBal = window.currentBalance || 0;

    if (balInput) balInput.value = `$${userBal.toFixed(2)}`;
    renderPayoutFields();
    if (modal) modal.classList.remove('hidden');
}

function closeWithdrawModal() {
    const modal = document.getElementById('withdrawModal');
    if (modal) modal.classList.add('hidden');
}

            <div>
                <label class="block text-[11px] font-medium text-gray-400 mb-1">Registered Name</label>

function getWorkerBaseUrl() {
    return (window.WORKER_BASE_URL || 'https://audiorydistribution.dandredurkofficial.workers.dev').replace(/\/$/, "");
}

async function submitWithdrawal(e) {
    e.preventDefault();

    const token = await getAuthToken();
    if (!token) {
        if (typeof showToast === 'function') showToast("Authentication token missing.", true);
        return;
    }

    const amount = parseFloat(document.getElementById('withdrawAmount').value);
    const userBal = window.currentBalance || 0;

    if (amount > userBal) {
        if (typeof showToast === 'function') showToast("Requested amount exceeds current available balance.", true);
        return;
    }

    const method = document.getElementById('payoutMethod').value;
    let detailString = '';
    if (method === 'mpesa') {
        detailString = `Phone: ${document.getElementById('field_mpesa_phone').value} (${document.getElementById('field_mpesa_name').value})`;
    } else if (method === 'bank') {
        detailString = `${document.getElementById('field_bank_name').value} - ${document.getElementById('field_bank_acc').value}`;
    } else if (method === 'payoneer') {
        detailString = `Email: ${document.getElementById('field_payoneer_email').value}`;
    } else if (method === 'tipalti') {
        detailString = `ID: ${document.getElementById('field_tipalti_id').value}`;
    }

    try {
        const response = await fetch(`${getWorkerBaseUrl()}/api/withdrawals`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                amount: amount,
                method: method,
                details: detailString
            })
        });

        const resData = await response.json();

        if (!response.ok) {
            throw new Error(resData.error || 'Failed to process request.');
        }

        closeWithdrawModal();
        await initEarningsDashboard();
        if (typeof showToast === 'function') showToast("Withdrawal request submitted successfully!", false);

    } catch (err) {
        if (typeof showToast === 'function') showToast(err.message, true);
    }
}

async function fetchUserWithdrawals() {
    try {
        const token = await getAuthToken();
        if (!token) return [];

        const response = await fetch(`${getWorkerBaseUrl()}/api/withdrawals`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) return [];
        return await response.json();
    } catch {
        return [];
    }
}

async function fetchTooLostSalesData() {
    try {
        const token = await getAuthToken();
        if (!token) return { overview: null, territories: [], streamRates: [], artistSales: [], releaseSales: [] };

        const [overviewRes, territoriesRes, ratesRes, artistsRes, releasesRes] = await Promise.all([
            fetch(`${getWorkerBaseUrl()}/api/toolost/sales/overview`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            }),
            fetch(`${getWorkerBaseUrl()}/api/toolost/sales/territories`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            }),
            fetch(`${getWorkerBaseUrl()}/api/toolost/sales/stream-rates`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            }),
            fetch(`${getWorkerBaseUrl()}/api/toolost/sales/artists`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            }),
            fetch(`${getWorkerBaseUrl()}/api/toolost/sales/releases`, {
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            })
        ]);

        const overview = overviewRes.ok ? await overviewRes.json() : null;
        const rawTerritories = territoriesRes.ok ? await territoriesRes.json() : [];
        const rawRates = ratesRes.ok ? await ratesRes.json() : [];
        const rawArtists = artistsRes.ok ? await artistsRes.json() : [];
        const rawReleases = releasesRes.ok ? await releasesRes.json() : [];

        const normalize = (res) => Array.isArray(res) ? res : (res?.data || res?.results || []);

        return {
            overview,
            territories: normalize(rawTerritories),
            streamRates: normalize(rawRates),
            artistSales: normalize(rawArtists),
            releaseSales: normalize(rawReleases)
        };
    } catch (err) {
        console.error("Error fetching Too Lost sales data:", err);
        return { overview: null, territories: [], streamRates: [], artistSales: [], releaseSales: [] };
    }
}

async function loadTrackChannels() {
    const input = document.getElementById('track-isrc-input');
    const tbody = document.getElementById('earnings-channels-tbody');
    if (!input || !tbody) return;

    const isrc = input.value.trim();
    if (!isrc) {
        tbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-amber-400">Please enter a valid Track ISRC code.</td></tr>`;
        return;
    }

    tbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Fetching channels for ISRC: ${isrc}...</td></tr>`;

    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/toolost/sales/tracks/${encodeURIComponent(isrc)}/channels`, {
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });

        if (!response.ok) throw new Error("Failed to load channels for this ISRC.");

        const resData = await response.json();
        const channels = Array.isArray(resData) ? resData : (resData?.data || resData?.channels || []);

        if (channels.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-gray-500">No channel sales found for ISRC: ${isrc}</td></tr>`;
            return;
        }

        tbody.innerHTML = channels.map(c => {
            const channelName = c.name || c.channel || c.dsp || 'Store';
            const quantity = Number(c.quantity || c.streams || c.count || 0);
            const total = Number(c.total || c.revenue || c.amount || 0);

            return `
                <tr class="border-b border-brand-border/50 hover:bg-white/5">
                    <td class="py-3 px-2 font-semibold text-white">${channelName}</td>
                    <td class="py-3 px-2 text-right font-mono text-gray-300">${quantity.toLocaleString()}</td>
                    <td class="py-3 px-2 text-right font-mono font-bold text-emerald-400">$${total.toFixed(2)}</td>
                </tr>
            `;
        }).join('');

    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-red-400">${err.message}</td></tr>`;
    }
}

async function initEarningsDashboard() {
    const requests = await fetchUserWithdrawals();
    const tbody = document.getElementById('earnings-withdrawals-tbody');
    
    let pendingSum = 0;
    let paidSum = 0;

    if (Array.isArray(requests) && requests.length > 0) {
        requests.forEach(r => {
            const amt = Number(r.amount) || 0;
            const status = (r.status || '').toLowerCase();
            if (status === 'paid') {
                paidSum += amt;
            } else if (status === 'pending') {
                pendingSum += amt;
            }
        });

        if (tbody) {
            tbody.innerHTML = requests.map(r => {
                const isPaid = (r.status || '').toLowerCase() === 'paid';
                const statusBadge = isPaid
                    ? `<span class="px-2 py-0.5 text-[10px] font-medium rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Paid</span>`
                    : `<span class="px-2 py-0.5 text-[10px] font-medium rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20">Pending</span>`;

                return `
                    <tr class="border-b border-brand-border/50 hover:bg-white/5 transition-colors">
                        <td class="py-3 px-2 font-mono">${new Date(r.date).toLocaleDateString()}</td>
                        <td class="py-3 px-2 font-semibold text-white">${r.method}</td>
                        <td class="py-3 px-2 text-gray-400 truncate max-w-xs">${r.details}</td>
                        <td class="py-3 px-2 text-right font-mono font-bold text-white">$${Number(r.amount).toFixed(2)}</td>
                        <td class="py-3 px-2 text-right">${statusBadge}</td>
                    </tr>
                `;
            }).join('');
        }
    } else if (tbody) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-500">No withdrawal records found.</td></tr>`;
    }

    const pendingEl = document.getElementById('earnings-pending-amount');
    const paidEl = document.getElementById('earnings-lifetime-paid');
    if (pendingEl) pendingEl.innerText = `$${pendingSum.toFixed(2)}`;
    if (paidEl) paidEl.innerText = `$${paidSum.toFixed(2)}`;

    const { overview, territories, streamRates, artistSales, releaseSales } = await fetchTooLostSalesData();

    // 1. Render Territories Table
    const territoryTbody = document.getElementById('earnings-territory-tbody');
    if (territoryTbody) {
        if (territories.length === 0) {
            territoryTbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-gray-500">No territory revenue data available.</td></tr>`;
        } else {
            territoryTbody.innerHTML = territories.map(t => {
                const country = t.country || t.territory || t.name || 'Unknown';
                const quantity = Number(t.quantity || t.streams || t.count || 0);
                const revenue = Number(t.total || t.revenue || t.amount || 0);

                return `
                    <tr class="border-b border-brand-border/50 hover:bg-white/5">
                        <td class="py-3 px-2 font-semibold text-white">${country}</td>
                        <td class="py-3 px-2 text-right font-mono text-gray-300">${quantity.toLocaleString()}</td>
                        <td class="py-3 px-2 text-right font-mono font-bold text-emerald-400">$${revenue.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
        }
    }

    // 2. Render Stream Rates Table
    const ratesTbody = document.getElementById('earnings-streamrates-tbody');
    if (ratesTbody) {
        if (streamRates.length === 0) {
            ratesTbody.innerHTML = `<tr><td colspan="2" class="py-6 text-center text-gray-500">No stream rate information available.</td></tr>`;
        } else {
            ratesTbody.innerHTML = streamRates.map(s => {
                const store = s.store || s.service || s.name || 'DSP';
                const rate = Number(s.rate || s.price || s.amount || 0);

                return `
                    <tr class="border-b border-brand-border/50 hover:bg-white/5">
                        <td class="py-3 px-2 font-semibold text-white">${store}</td>
                        <td class="py-3 px-2 text-right font-mono font-bold text-cyan-400">$${rate.toFixed(6)}</td>
                    </tr>
                `;
            }).join('');
        }
    }

    // 3. Render Artist Sales Table
    const artistsTbody = document.getElementById('earnings-artists-tbody');
    if (artistsTbody) {
        if (artistSales.length === 0) {
            artistsTbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-gray-500">No artist sales records available.</td></tr>`;
        } else {
            artistsTbody.innerHTML = artistSales.map(a => {
                const artistName = a.artist || a.name || 'Artist';
                const units = Number(a.quantity || a.units || a.count || 0);
                const revenue = Number(a.total || a.revenue || a.amount || 0);

                return `
                    <tr class="border-b border-brand-border/50 hover:bg-white/5">
                        <td class="py-3 px-2 font-semibold text-white">${artistName}</td>
                        <td class="py-3 px-2 text-right font-mono text-gray-300">${units.toLocaleString()}</td>
                        <td class="py-3 px-2 text-right font-mono font-bold text-emerald-400">$${revenue.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
        }
    }

    // 4. Render Release Sales Table
    const releasesTbody = document.getElementById('earnings-releases-tbody');
    if (releasesTbody) {
        if (releaseSales.length === 0) {
            releasesTbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-gray-500">No release sales records available.</td></tr>`;
        } else {
            releasesTbody.innerHTML = releaseSales.map(r => {
                const releaseName = r.title || r.release || r.id || 'Release';
                const units = Number(r.quantity || r.units || r.count || 0);
                const revenue = Number(r.total || r.revenue || r.amount || 0);

                return `
                    <tr class="border-b border-brand-border/50 hover:bg-white/5">
                        <td class="py-3 px-2 font-semibold text-white">${releaseName}</td>
                        <td class="py-3 px-2 text-right font-mono text-gray-300">${units.toLocaleString()}</td>
                        <td class="py-3 px-2 text-right font-mono font-bold text-emerald-400">$${revenue.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
        }
    }

    // 5. Calculate Total Balance via /sales/overview array schema fix
    const grossRevenue = Array.isArray(overview?.data)
        ? overview.data.reduce((acc, curr) => acc + Number(curr.total || 0), 0)
        : (Number(overview?.total) || territories.reduce((acc, curr) => acc + Number(curr.total || 0), 0));

    const availableBalance = Math.max(0, grossRevenue - (pendingSum + paidSum));
    window.currentBalance = availableBalance;

    const totalBalEl = document.getElementById('earnings-total-balance');
    if (totalBalEl) totalBalEl.innerText = `$${window.currentBalance.toFixed(2)}`;

    // 6. Render Territory Chart & Top 5 Country Flag List (Prevents overflow scrollbar & massive vertical gaps)
    const countryCodeMap = {
        'united states': 'us', 'usa': 'us', 'us': 'us',
        'united kingdom': 'gb', 'uk': 'gb', 'great britain': 'gb',
        'canada': 'ca', 'germany': 'de', 'australia': 'au', 'japan': 'jp',
        'france': 'fr', 'netherlands': 'nl', 'sweden': 'se', 'norway': 'no',
        'brazil': 'br', 'new zealand': 'nz', 'switzerland': 'ch', 'mexico': 'mx',
        'italy': 'it', 'spain': 'es', 'kenya': 'ke', 'south africa': 'za', 'nigeria': 'ng'
    };

    const colorPalette = [
        '#1db954', '#fc3c44', '#ff0000', '#00a8e1', '#a238ff', 
        '#e1306c', '#0084ff', '#ff9900', '#10b981', '#f59e0b'
    ];

    const canvas = document.getElementById('territoryEarningsPieChart');
    const legendContainer = document.getElementById('territory-legend-list');
    const chartContainer = canvas ? canvas.parentElement : null;

    if (canvas) {
        const hasData = territories.length > 0 && territories.some(t => Number(t.total || t.revenue || t.amount || 0) > 0);

        if (hasData) {
            const existingMsg = chartContainer?.querySelector('.empty-chart-msg');
            if (existingMsg) existingMsg.remove();

            canvas.style.display = 'block';
            if (pieChartInstance) pieChartInstance.destroy();

            // Sort territories by highest revenue
            const sortedTerritories = [...territories].sort((a, b) => 
                Number(b.total || b.revenue || b.amount || 0) - Number(a.total || a.revenue || a.amount || 0)
            );

            // Sliced to Top 5 for clean card display
            const topTerritories = sortedTerritories.slice(0, 5);
            const chartDataValues = sortedTerritories.map(t => Number(t.total || t.revenue || t.amount || 0));
            const totalSum = chartDataValues.reduce((a, b) => a + b, 0);

            const ctx = canvas.getContext('2d');
            pieChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: sortedTerritories.map(t => t.country || t.territory || t.name || 'Unknown'),
                    datasets: [{
                        data: chartDataValues,
                        backgroundColor: colorPalette.slice(0, sortedTerritories.length),
                        borderWidth: 0,
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '72%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const val = context.raw || 0;
                                    const pct = totalSum > 0 ? ((val / totalSum) * 100).toFixed(1) : 0;
                                    return ` $${val.toFixed(2)} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });

            // Render top 5 sleek rows with flags & no scrollbar
            if (legendContainer) {
                legendContainer.innerHTML = topTerritories.map((t, idx) => {
                    const countryName = t.country || t.territory || t.name || 'Unknown';
                    const rev = Number(t.total || t.revenue || t.amount || 0);
                    const pct = totalSum > 0 ? ((rev / totalSum) * 100).toFixed(1) : '0.0';
                    const color = colorPalette[idx % colorPalette.length];
                    
                    const code = countryCodeMap[countryName.toLowerCase()] || 'un';
                    const flagUrl = `https://flagcdn.com/w40/${code}.png`;

                    return `
                        <div class="flex items-center justify-between text-xs py-1 px-2 rounded-lg hover:bg-white/5 transition-colors">
                            <div class="flex items-center gap-2.5 truncate pr-2">
                                <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${color}"></span>
                                <img src="${flagUrl}" alt="${countryName}" class="w-4 h-3 rounded-sm object-cover flex-shrink-0" onerror="this.style.display='none'" />
                                <span class="font-medium text-gray-200 truncate text-[13px]">${countryName}</span>
                            </div>
                            <div class="text-right flex-shrink-0 font-mono">
                                <span class="font-bold text-white text-[13px]">$${rev.toFixed(2)}</span>
                                <span class="text-[11px] text-gray-400 ml-1">(${pct}%)</span>
                            </div>
                        </div>
                    `;
                }).join('');

function formatReleaseStatus(status) {
    if (status === null || status === undefined || status === '') {
        return 'Unknown';
    }

    const normalized = String(status)
        .trim()
        .toLowerCase();

    const labels = {
        draft: 'Draft',
        submitted: 'Submitted',
        pending: 'Pending',
        processing: 'Processing',
        in_review: 'In Review',
        'in-review': 'In Review',
        review: 'In Review',
        approved: 'Approved',
        rejected: 'Rejected',
        delivered: 'Delivered',
        live: 'Live',
        takedown: 'Takedown'
    };

    return labels[normalized] ||
        String(status)
            .trim()
            .replace(/[_-]/g, ' ')
            .replace(/\b\w/g, c => c.toUpperCase());
}

// Catalog Actions - Edit Release
window.editReleaseCatalog = function(index) {
    const item = window.releasesCatalog[index];
    if (!item) return;

    // 1. Extract Artists/Participants reliably
    let extractedArtists = [];
    if (Array.isArray(item.participants) && item.participants.length > 0) {
        extractedArtists = item.participants.map(p => ({
            name: typeof p === 'string' ? p : (p.name || ''),
            role: Array.isArray(p.role) ? (p.role[0] || 'primary') : (p.role || 'primary')
        }));
    } else if (Array.isArray(item.artists) && item.artists.length > 0) {
        extractedArtists = item.artists.map(a => ({
            name: typeof a === 'string' ? a : (a.name || ''),
            role: Array.isArray(a.role) ? (a.role[0] || 'primary') : (a.role || 'primary')
        }));
    } else if (item.artist) {
        extractedArtists = [{
            name: typeof item.artist === 'string' ? item.artist : (item.artist.name || ''),
            role: 'primary'
        }];
    }

    if (extractedArtists.length === 0) {
        extractedArtists = [{ name: '', role: 'primary' }];
    }

    // 2. Extract Label cleanly
    const labelName = typeof item.label === 'object' 
        ? (item.label.name || item.label.label || '') 
        : (item.label || '');

    // 3. Set standard releaseState with editing tracking
    window.releaseState = {
        editingId: item.id || null, // Track ID to prevent creating duplicates
        metadata: {
            title: item.title || item.metadata?.title || '',
            type: item.type || item.metadata?.type || 'Single',
            language: item.language || item.metadata?.language || 'English',
            explicit: item.explicit || item.metadata?.explicit || false,
            primaryGenre: item.genre || item.primary_genre || item.metadata?.primaryGenre || item.genre_id || '',
            secondaryGenre: item.subgenre || item.secondary_genre || item.metadata?.secondaryGenre || ''
        },
        artists: extractedArtists,
        label: {
            name: labelName,
            cLine: item.cLine || item.c_line || item.label?.cLine || '',
            pLine: item.pLine || item.p_line || item.label?.pLine || ''
        },
        dates: {
            releaseDate: item.releaseDate || item.release_date || '',
            timezone: item.timezone || 'Africa/Nairobi'
        },
        dsps: item.dsps || (typeof MASTER_DSP_LIST !== 'undefined' ? MASTER_DSP_LIST.map(d => d.id) : []),
        artwork: {
            file: null,
            url: item.coverUrl || item.cover_url || item.compressedArtwork || item.cover_art || '',
            inspected: null
        },
        tracks: Array.isArray(item.tracks) && item.tracks.length > 0 
            ? item.tracks.map(t => ({
                metadata: {
                    title: t.title || t.metadata?.title || '',
                    version: t.version || t.metadata?.version || '',
                    genre: t.genre || t.metadata?.genre || '',
                    subgenre: t.subgenre || t.metadata?.subgenre || '',
                    explicit: t.explicit || t.metadata?.explicit || false
                },
                discNumber: t.discNumber || t.disc_number || 1,
                isrc: t.isrc || '',
                audioUrl: t.audio_url || t.audioUrl || '',
                tiktokStartTime: t.tiktok_start_time || t.tiktokStartTime || '00:30',
                lyrics: { plain: t.lyrics?.plain || t.lyrics || '' }
            }))
            : [{
                metadata: { title: item.title || '', explicit: false },
                discNumber: 1,
                isrc: '',
                audioUrl: '',
                tiktokStartTime: '00:30',
                lyrics: { plain: '' }
            }],
        agreements: { termsAccepted: true, rightsConfirmed: true }
    };

    // 4. Switch View & Render Step
    switchView('create');

    if (typeof window.renderStepContent === 'function') {
        window.renderStepContent(1);
    }

    // 5. Explicitly populate form fields from releaseState
    setTimeout(() => {
        populateFormFromState();
    }, 50);

    window.showToast('Release loaded for editing', false);
};

// Helper function to force form inputs to sync with window.releaseState
function populateFormFromState() {
    const state = window.releaseState;
    if (!state) return;

    // Title
    const titleInput = document.querySelector('input[name="title"]') || document.getElementById('release-title');
    if (titleInput) titleInput.value = state.metadata.title;

    // Type
    const typeSelect = document.querySelector('select[name="type"]') || document.getElementById('release-type');
    if (typeSelect) typeSelect.value = state.metadata.type;

    // Primary Genre
    const genreSelect = document.querySelector('select[name="primaryGenre"]') || document.getElementById('primary-genre');
    if (genreSelect && state.metadata.primaryGenre) genreSelect.value = state.metadata.primaryGenre;

    // Label
    const labelInput = document.querySelector('input[name="label"]') || document.getElementById('record-label');
    if (labelInput) labelInput.value = state.label.name;

    // Render / Sync Artist Inputs
    if (typeof window.renderArtistInputs === 'function') {
        window.renderArtistInputs();
    } else {
        const artistContainer = document.getElementById('artists-container') || document.querySelector('.artists-wrapper');
        if (artistContainer && state.artists.length > 0) {
            const firstArtistInput = artistContainer.querySelector('input');
            if (firstArtistInput) firstArtistInput.value = state.artists[0].name;
        }
    }
}

window.deleteReleaseCatalog = async function(releaseId) {
    try {
        const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
        
        const res = await fetch(`${WORKER_BASE_URL}/api/releases/${releaseId}`, { 
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (!res.ok) throw new Error('Failed to delete release on gateway');

        // Remove from memory
        window.releasesCatalog = (window.releasesCatalog || []).filter(r => String(r.id) !== String(releaseId));

        // Remove from Local Storage
        let localSavedReleases = JSON.parse(localStorage.getItem('audiory_local_releases') || '[]');
        localSavedReleases = localSavedReleases.filter(r => String(r.id) !== String(releaseId));
        localStorage.setItem('audiory_local_releases', JSON.stringify(localSavedReleases));

        window.showToast('Release deleted successfully', false);

        if (typeof window.loadLiveCatalog === 'function') {
            await window.loadLiveCatalog();
        } else {
            const container = document.getElementById('mainViewport');
            if (container && typeof renderCatalogView === 'function') {
                container.innerHTML = renderCatalogView();
            }
        }
    } catch (err) {
        console.error('Delete error:', err);

        // Fallback: Remove locally from storage and state if API route fails
        window.releasesCatalog = (window.releasesCatalog || []).filter(r => String(r.id) !== String(releaseId));
        let localSavedReleases = JSON.parse(localStorage.getItem('audiory_local_releases') || '[]');
        localSavedReleases = localSavedReleases.filter(r => String(r.id) !== String(releaseId));
        localStorage.setItem('audiory_local_releases', JSON.stringify(localSavedReleases));

        const container = document.getElementById('mainViewport');
        if (container && typeof renderCatalogView === 'function') {
            container.innerHTML = renderCatalogView();
        }
        window.showToast('Release removed from catalog', false);
    }
};

    async function initAnalyticsDashboard(period = 'lastThirtyDays') {
        currentAnalyticsPeriod = period;

        const periodSelect = document.getElementById('analytics-period-select');
        if (periodSelect) {
            periodSelect.value = period;
            if (!periodSelect.dataset.listenerAttached) {
                periodSelect.dataset.listenerAttached = "true";
                periodSelect.addEventListener('change', (e) => initAnalyticsDashboard(e.target.value));
            }
        }

        renderActiveTabContent();
    }

    function switchAnalyticsTab(tabName) {
        activeAnalyticsTab = tabName;
        document.querySelectorAll('.analytics-tab-btn').forEach(btn => {
            btn.classList.remove('bg-brand-primary', 'text-white');
            btn.classList.add('text-gray-400');
        });
        const selectedBtn = document.getElementById(`tab-btn-${tabName}`);
        if (selectedBtn) {
            selectedBtn.classList.add('bg-brand-primary', 'text-white');
            selectedBtn.classList.remove('text-gray-400');
        }
        renderActiveTabContent();
    }

    async function getAuthToken() {
        if (!window.currentUser) return null;
        return typeof window.currentUser.getIdToken === 'function'
            ? await window.currentUser.getIdToken(true)
            : window.currentUser.accessToken || null;
    }

    async function fetchOverviewData() {
        const token = await getAuthToken();
        if (!token) return showAlert("Authentication required. Please sign in again.", "error");

        const workerUrl = window.WORKER_BASE_URL || 'https://audiorydistribution.dandredurkofficial.workers.dev';

        try {
            const [overviewRes, tracksRes] = await Promise.all([
                fetch(`${workerUrl}/api/analytics/overview?period=${currentAnalyticsPeriod}`, { headers: { 'Authorization': `Bearer ${token}` } }),
                fetch(`${workerUrl}/api/analytics/tracks?period=${currentAnalyticsPeriod}&page=1&perPage=10`, { headers: { 'Authorization': `Bearer ${token}` } })
            ]);

            if (overviewRes.ok) {
                const overviewJson = await overviewRes.json();
                const data = overviewJson.data || overviewJson;
                renderKPIs(data);
                renderChart(data.chart || []);
            }

            if (tracksRes.ok) {
                const tracksJson = await tracksRes.json();
                renderTracksTable(tracksJson.data || []);
            }
        } catch (err) {
            showAlert("Failed to load analytics overview.", "error");
        }
    }

    async function fetchPlatformData(platform = 'spotify') {
        const token = await getAuthToken();
        if (!token) return;

        const workerUrl = window.WORKER_BASE_URL || 'https://audiorydistribution.dandredurkofficial.workers.dev';

        try {
            const res = await fetch(`${workerUrl}/api/analytics/platforms?platform=${platform}&period=${currentAnalyticsPeriod}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const json = await res.json();

            if (res.ok) {
                const payload = json.data || json;
                const totalStreams = payload.totalStreams || payload.streams || 0;
                
                const streamsCountEl = document.getElementById('platform-streams-count');
                if (streamsCountEl) {
                    streamsCountEl.innerText = Number(totalStreams).toLocaleString();
                }

                renderPlatformChart(payload.chart || []);
                renderPlatformTracks(payload.tracks || []);
                renderPlatformCountries(payload.countries || []);
            }
        } catch (err) {
            showAlert("Error loading platform streams.", "error");
        }
    }

    function renderPlatformChart(chartData) {
        const canvas = document.getElementById('platformStreamsChart');
        if (!canvas) return;

        if (platformChartInstance) {
            platformChartInstance.destroy();
        }

        const labels = chartData.length > 0 ? chartData.map(p => p.date) : ['2026-05-28', '2026-06-27'];
        const streams = chartData.length > 0 ? chartData.map(p => p.streams || p.totalStreams) : [0, 0];

        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 300);
        gradient.addColorStop(0, 'rgba(124, 58, 237, 0.35)');
        gradient.addColorStop(1, 'rgba(124, 58, 237, 0.0)');

        platformChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Total Streams',
                    data: streams,
                    borderColor: '#8b5cf6',
                    backgroundColor: gradient,
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: 'rgba(255, 255, 255, 0.03)' }, ticks: { color: '#6b7280', font: { size: 10 } } },
                    y: { grid: { color: 'rgba(255, 255, 255, 0.03)' }, ticks: { color: '#6b7280', font: { size: 10 } } }
                }
            }
        });
    }

    function renderPlatformTracks(tracks) {
        const container = document.getElementById('platform-tracks-list');
        if (!container) return;

        if (!tracks || tracks.length === 0) {
            container.innerHTML = `<div class="text-xs text-gray-500 text-center py-6">No track data for this platform.</div>`;
            return;
        }

        const maxStreams = Math.max(...tracks.map(t => t.streams || 0)) || 1;

        container.innerHTML = tracks.map(t => {
            const pct = Math.round(((t.streams || 0) / maxStreams) * 100);
            return `
                <div class="flex items-center justify-between p-2 rounded-xl hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-3">
                        <img src="${t.coverUrl || 'https://via.placeholder.com/40'}" class="w-9 h-9 rounded-lg object-cover" />
                        <div>
                            <p class="text-xs font-semibold text-white truncate max-w-[150px]">${t.title || 'Untitled Track'}</p>
                            <p class="text-[10px] text-gray-400">${t.artist || 'Unknown Artist'}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-indigo-400">${pct.toFixed(2)}%</span>
                        <p class="text-[10px] text-gray-400">${Number(t.streams || 0).toLocaleString()} streams</p>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderPlatformCountries(countries) {
        const container = document.getElementById('platform-countries-list');
        if (!container) return;

        if (!countries || countries.length === 0) {
            container.innerHTML = `<div class="text-xs text-gray-500 text-center py-6">No country data for this platform.</div>`;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[ch]));
}

function showToast(message, isError = false) {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border text-xs font-medium shadow-2xl transition-all duration-300 transform translate-y-2 opacity-0 ${
    isError 
      ? 'bg-red-500/10 border-red-500/30 text-red-400 backdrop-blur-md' 
      : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 backdrop-blur-md'
  }`;

  toast.innerHTML = `
    <i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'} text-sm"></i>
    <span>${message}</span>
  `;

  container.appendChild(toast);

  // Animate in
  setTimeout(() => {
    toast.classList.remove('translate-y-2', 'opacity-0');
  }, 10);

  // Auto Dismiss
  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

function showModalAlert(message, isError = false) {
  const alertEl = document.getElementById('modalAlert');
  if (!alertEl) return;

  alertEl.className = `p-3 rounded-xl text-xs flex items-center gap-2 ${
    isError 
      ? 'bg-red-500/10 border border-red-500/20 text-red-400' 
      : 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-400'
  }`;
  alertEl.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i> ${message}`;
  alertEl.classList.remove('hidden');
}

function clearModalAlert() {
  const alertEl = document.getElementById('modalAlert');
  if (alertEl) alertEl.classList.add('hidden');
}

async function handlePasswordChange(event) {
  event.preventDefault();
  clearModalAlert();

  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword !== confirmPassword) {
    showModalAlert('New passwords do not match.', true);
    return;
  }

  try {
    let token = "";

    // Re-authenticate via Firebase SDK directly if present
    if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
      const user = firebase.auth().currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, currentPassword);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(newPassword);
    } else {
      // Fallback: Call Cloudflare Worker endpoint
      if (typeof auth !== 'undefined' && auth.currentUser) {
        token = await auth.currentUser.getIdToken();
      }

      if (!token) {
        throw new Error('User session expired. Please sign in again.');
      }

      const res = await fetch(`${WORKER_BASE_URL}/api/auth/change-password`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ currentPassword, newPassword })
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Password change failed.');
    }

    showToast('Password updated successfully! Please sign in with your new password.');
    closeSettingsModal();
  } catch (err) {
    showModalAlert(err.message || 'Error updating password.', true);
  }
}
        
async function load2FAStatus() {
  const badge = document.getElementById('2faStatusBadge');
  const setupArea = document.getElementById('2faSetupArea');

    });

    if (data.is_2fa_enabled) {
      badge.textContent = 'Enabled';
      badge.className = 'text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-medium';
      if (setupArea) {
        setupArea.innerHTML = `

              <i class="fa-solid fa-shield-check text-emerald-400 text-xl"></i>
            </div>
            <p class="text-xs text-emerald-300 font-semibold">Authenticator 2FA is enabled.</p>
            <p class="text-[10px] text-gray-400">Your account requires an authenticator code during protected login.</p>
            <button onclick="disable2FA()" class="w-full py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 font-medium text-xs rounded-lg transition">Disable 2FA</button>
          </div>`;
      }

    }

    badge.textContent = 'Disabled';
    badge.className = 'text-[10px] bg-yellow-500/20 text-yellow-400 px-2 py-0.5 rounded font-medium';

async function begin2FASetup() {
  const loading = document.getElementById('2faSetupLoading');
  const content = document.getElementById('2faSetupContent');
  if (!loading || !content) return;

  try {
    const token = await getAuthToken();
    if (!token) throw new Error('Authentication required.');

    const response = await fetch(`${getWorkerBaseUrl()}/api/auth/2fa/setup`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.qrCodeUrl) throw new Error(data.error || 'Unable to start 2FA setup.');

    const qr = document.getElementById('twoFaQrCode');
    const secret = document.getElementById('twoFaManualSecret');
    if (qr) qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(data.qrCodeUrl)}`;
    if (secret) secret.textContent = `Manual setup key: ${data.secret || ''}`;

    loading.classList.add('hidden');
    content.classList.remove('hidden');
    window.pending2FARecoveryCodes = data.recoveryCodes || [];
  } catch (err) {
    loading.textContent = err.message || 'Unable to prepare 2FA setup.';
    loading.className = 'text-xs text-red-400';
  }
}

async function verify2FASetup() {
  clearModalAlert();
  const input = document.getElementById('totpCode');
  const code = String(input?.value || '').replace(/\D/g, '');
  if (!/^\d{6}$/.test(code)) {
    showModalAlert('Enter the current 6-digit code from your authenticator app.', true);
    return;
  }

  try {
    const token = await getAuthToken();
    const response = await fetch(`${getWorkerBaseUrl()}/api/auth/2fa/verify`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.success) throw new Error(data.error || '2FA verification failed.');

    const codes = data.recovery_codes || window.pending2FARecoveryCodes || [];
    const list = document.getElementById('twoFaRecoveryCodeList');
    const box = document.getElementById('twoFaRecoveryCodes');
    if (list && codes.length) {
      list.innerHTML = codes.map(code => `<span>${escapeHtml(code)}</span>`).join('');
      box?.classList.remove('hidden');
    }

    showToast('Two-Factor Authentication successfully enabled!');
    await load2FAStatus();
  } catch (err) {
    showModalAlert(err.message || 'Unable to enable 2FA.', true);
  }
}

async function disable2FA() {
  const confirmed = await showCustomConfirm('Disable 2FA', 'Disable authenticator protection for this account?');
  if (!confirmed) return;
  try {
    const token = await getAuthToken();
    const response = await fetch(`${getWorkerBaseUrl()}/api/auth/2fa/disable`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.success) throw new Error(data.error || 'Unable to disable 2FA.');
    showToast('Two-Factor Authentication disabled.');
    await load2FAStatus();
  } catch (err) {
    showToast(err.message || 'Unable to disable 2FA.', true);
  }
}

function submitAppleClaim() {
  clearModalAlert();
  const url = document.getElementById('appleArtistUrl')?.value?.trim() || '';
  if (!/^https:\/\/music\.apple\.com\//i.test(url)) {
    showModalAlert('Please enter a valid Apple Music artist profile URL.', true);
    return;
  }
  // The Worker owns the OAuth/claim flow. Keep the URL available for the callback flow.
  sessionStorage.setItem('audioryAppleArtistUrl', url);
  startOAuthFlow('Apple Music');
}

function startOAuthFlow(platform) {
  const routes = {
    'SoundCloud': '/api/integrations/soundcloud/connect',
    'Audiomack': '/api/integrations/audiomack/connect',
    'Apple Music': '/api/integrations/apple-music/connect'
  };
  const route = routes[platform];
  if (!route) {
    showToast(`Unsupported integration: ${platform}`, true);
    return;
  }

  const base = getWorkerBaseUrl();
  if (!base) {
    showToast('Worker base URL is not configured.', true);
    return;
  }

  showToast(`Connecting ${platform}...`);
  closeSettingsModal();

  // The integration endpoint must support authenticated browser navigation.
  // Preferred implementation: Worker accepts a short-lived signed/query state generated
  // by an authenticated POST before redirecting to the provider.
  const tokenPromise = getAuthToken();
  tokenPromise.then(token => {
    const separator = route.includes('?') ? '&' : '?';
    window.location.href = `${base}${route}${separator}token=${encodeURIComponent(token)}`;
  }).catch(() => showToast(`Unable to start ${platform} authorization.`, true));
}

// Modal Confirm System
let confirmResolve = null;
function showCustomConfirm(title, message) {
    return new Promise((resolve) => {
        confirmResolve = resolve;
        const modal = document.getElementById('customConfirmModal');
        const titleEl = document.getElementById('confirmModalTitle');
        const msgEl = document.getElementById('confirmModalMessage');
        const actionBtn = document.getElementById('confirmModalActionBtn');

        if (titleEl) titleEl.textContent = title;
        if (msgEl) msgEl.textContent = message;

        if (actionBtn) {
            actionBtn.onclick = () => closeConfirmModal(true);
        }

        if (modal) modal.classList.remove('hidden');
    });
}

function closeConfirmModal(result) {
    const modal = document.getElementById('customConfirmModal');
    if (modal) modal.classList.add('hidden');
    if (confirmResolve) {
        confirmResolve(result);
        confirmResolve = null;
    }
}

// Page Initialization Controller
async function initSettingsView() {
    const user = window.currentUser || (window.firebase && firebase.auth().currentUser) || {};
    const nameInput = document.getElementById('settings-user-name');
    const emailInput = document.getElementById('settings-user-email');

    if (emailInput) emailInput.value = user.email || '';

    // 1. First load from KV (The Source of Truth)
    let kvLoaded = false;
    try {
      const token = await getAuthToken();
      const response = await fetch(`${getWorkerBaseUrl()}/api/profile`, { 
        headers: { 'Authorization': `Bearer ${token}` } 
      });
      
      if (response.ok) {
        const profile = await response.json();
        window.audioryProfile = profile || {};
        
        if (profile.displayName) {
          if (nameInput) nameInput.value = profile.displayName;
          updateDashboardProfileName(profile.displayName);
          
          // Also sync locally to window.currentUser if present
          if (window.currentUser) window.currentUser.displayName = profile.displayName;
          
          kvLoaded = true; // Mark as loaded, do not exit early
        }
      }
    } catch (err) {
      console.warn("Could not load profile from Worker KV:", err);
    }

    // 2. Fallback to Firebase user data if KV is empty
    if (!kvLoaded) {
      if (nameInput) {
        nameInput.value = user.displayName || user.email?.split('@')[0] || '';
      }
      updateDashboardProfileName(user.displayName || user.email?.split('@')[0]);
    }

    // 3. Always run secondary data queries regardless of KV profile status
    await Promise.all([
        loadAccountMembers(),
        loadPayoutPreferences(),
        loadBillingHistory(),
        loadTaxDetails(),
        loadLoginHistory()
    ]);
}
        
// Centralized DOM updater for profile display names
function updateDashboardProfileName(name) {
    if (!name) return;
    
    // Update global state
    window.audioryProfile = window.audioryProfile || {};
    window.audioryProfile.displayName = name;
    if (window.currentUser) window.currentUser.displayName = name;

    const selectors = [
      '[data-user-display-name]', '#userDisplayName', '#dashboardUserName',
      '#profileDisplayName', '.dashboard-user-name'
    ];
    
    selectors.forEach(selector => {
      document.querySelectorAll(selector).forEach(el => { el.textContent = name; });
    });
}

// Profile Save Handler
async function handleSaveProfile(e) {
    e.preventDefault();
    const nameInput = document.getElementById('settings-user-name');
    if (!nameInput) return;
    
    const newName = nameInput.value.trim();
    if (!newName) {
      showToast('Display name is required.', true);
      return;
    }

    try {
        const user = window.currentUser || (window.firebase && firebase.auth().currentUser);
        const token = await getAuthToken();

        // 1. Save to Worker KV
        const response = await fetch(`${getWorkerBaseUrl()}/api/profile`, {
            method: 'POST',
            headers: { 
              'Authorization': `Bearer ${token}`, 
              'Content-Type': 'application/json' 
            },
            body: JSON.stringify({ displayName: newName })
        });
        
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Failed to update profile name.');

        // 2. Sync with client Firebase SDK and force refresh user instance
        if (user && typeof user.updateProfile === 'function') {
            try { 
              await user.updateProfile({ displayName: newName });
              if (typeof user.reload === 'function') {
                await user.reload(); // Ensures SDK cache is refreshed
              }
            } catch (fbErr) {
              console.warn("Firebase SDK update profile warning:", fbErr);
            }
        }

        // 3. Update local state & DOM immediately
        window.audioryProfile = data.profile || { displayName: newName };
        updateDashboardProfileName(newName);
        nameInput.value = newName;
        
        showToast('Profile name updated successfully!');
    } catch (err) {
        showToast(err.message || 'Failed to update profile name.', true);
    }
}

async function savePayoutMethod(e) {
    if(e) e.preventDefault();
    const selectedType = document.querySelector('input[name="payoutMethod"]:checked')?.value || 'bank';
    
    let details = {};
    if (selectedType === 'bank') {
        details = {
            holder: document.getElementById('bank-holder')?.value || '',
            bankName: document.getElementById('bank-name')?.value || '',
            accountNumber: document.getElementById('bank-acc')?.value || '',
            swiftCode: document.getElementById('bank-swift')?.value || ''
        };
    } else if (selectedType === 'paypal') {
        details = {
            paypalEmail: document.getElementById('paypal-email')?.value || ''
        };
    } else if (selectedType === 'mobile_money') {
        details = {
            provider: document.getElementById('mobile-provider')?.value || 'mpesa',
            phoneNumber: document.getElementById('mobile-number')?.value || ''
        };
    }

    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/payout-preferences`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ payoutType: selectedType, details })
        });

        if (!response.ok) throw new Error("Failed to save payout preferences.");
        showToast("Payout preferences saved successfully!");
    } catch (err) {
        showToast(err.message, true);
    }
}

async function loadPayoutPreferences() {
    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/payout-preferences`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) return;

        const data = await response.json();
        if (data && data.payoutType) {
            const radio = document.querySelector(`input[name="payoutMethod"][value="${data.payoutType}"]`);
            if (radio) {
                radio.checked = true;
                togglePayoutFields(data.payoutType);
            }
            if (data.details) {
                if (document.getElementById('bank-holder')) document.getElementById('bank-holder').value = data.details.holder || '';
                if (document.getElementById('bank-name')) document.getElementById('bank-name').value = data.details.bankName || '';
                if (document.getElementById('bank-acc')) document.getElementById('bank-acc').value = data.details.accountNumber || '';
                if (document.getElementById('bank-swift')) document.getElementById('bank-swift').value = data.details.swiftCode || '';
                if (document.getElementById('paypal-email')) document.getElementById('paypal-email').value = data.details.paypalEmail || '';
                if (document.getElementById('mobile-provider')) document.getElementById('mobile-provider').value = data.details.provider || 'mpesa';
                if (document.getElementById('mobile-number')) document.getElementById('mobile-number').value = data.details.phoneNumber || '';
            }
        }
    } catch {
        // Fallback default UI state
    }
}

function formatDateTime(value) {
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return escapeHtml(value);
  return date.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
}

// Billing History Controller
async function loadBillingHistory() {
    const tbody = document.getElementById('settings-billing-tbody');
    const badge = document.getElementById('subscriptionPlanBadge');
    const details = document.getElementById('subscriptionDetails');
    if (!tbody) return;

    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/billing-history`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = response.ok ? await response.json() : {};
        const subscription = data.subscription || null;
        const history = Array.isArray(data.history) ? data.history : (Array.isArray(data) ? data : []);

        if (badge) {
          if (subscription) {
            const name = subscription.planName || subscription.name || subscription.planId || 'No active plan';
            const status = subscription.status || 'Pending';
            badge.textContent = `${name} ${status}`;
            badge.className = `px-3 py-1 rounded-full text-[10px] font-mono font-bold uppercase ${String(status).toLowerCase() === 'active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}`;
          } else {
            badge.textContent = 'No active subscription';
          }
        }
        if (details) {
          details.innerHTML = subscription ? `

// IRS Tax Form Specific Selector Logic
function selectTaxForm(type) {
    document.getElementById('tax-form-type').value = type;

    document.querySelectorAll('.tax-form-btn').forEach(btn => {
        btn.classList.remove('border-amber-500/50', 'bg-amber-500/10', 'border-cyan-500/50', 'bg-cyan-500/10', 'border-indigo-500/50', 'bg-indigo-500/10');
        btn.classList.add('border-brand-border', 'bg-white/5');
    });

    const btn = document.getElementById(`tax-form-btn-${type}`);
    const badge = document.getElementById('tax-form-header-badge');
    const w9Section = document.getElementById('tax-section-w9');
    const w8Section = document.getElementById('tax-section-w8');
    const w8beneSection = document.getElementById('tax-section-w8bene');

    w9Section.classList.add('hidden');
    w8Section.classList.add('hidden');
    w8beneSection.classList.add('hidden');

    if (type === 'w9') {

        w9Section.classList.remove('hidden');
    } else if (type === 'w8ben') {
        if (btn) btn.classList.add('border-cyan-500/50', 'bg-cyan-500/10');
        if (badge) badge.innerHTML = `<span class="font-semibold"><i class="fa-solid fa-earth-americas mr-1.5"></i> Completing: IRS Form W-8BEN (Foreign Individual)</span><span class="text-[10px] font-mono bg-cyan-500/20 px-2 py-0.5 rounded text-cyan-200">30% Standard / Treaty Reduced Rate</span>`;
        w8Section.classList.remove('hidden');
    } else if (type === 'w8bene') {

// Save IRS Tax Compliance Details
async function handleSaveTaxDetails(e) {
    e.preventDefault();
    const formType = document.getElementById('tax-form-type')?.value || 'w9';
    const legalName = document.getElementById('tax-legal-name')?.value.trim() || '';
    const street = document.getElementById('tax-address-street')?.value.trim() || '';
    const city = document.getElementById('tax-address-city')?.value.trim() || '';
    const state = document.getElementById('tax-address-state')?.value.trim() || '';
    const zip = document.getElementById('tax-address-zip')?.value.trim() || '';
    const signature = document.getElementById('tax-signature')?.value.trim() || '';

    if (!legalName || !street || !city || !zip || !signature || !document.getElementById('tax-certify-check')?.checked) {
      showToast('Complete all required tax fields and certification before submitting.', true);
      return;
    }

    let country = '';
    let tin = '';
    let classification = 'individual';
    if (formType === 'w9') {
      tin = document.getElementById('tax-w9-tin')?.value.trim() || '';
      classification = document.getElementById('tax-w9-classification')?.value || 'individual';
      country = 'United States';
    } else {
      country = document.getElementById('tax-w8-citizenship')?.value.trim() || '';
      tin = document.getElementById('tax-w8-ftin')?.value.trim() || '';
      classification = formType === 'w8bene' ? (document.getElementById('tax-w8bene-fatca')?.value || 'foreign_entity') : 'foreign_individual';
    }

    if (!country || !tin) {
      showToast('Country and foreign tax identification number are required for this form.', true);
      return;
    }

    const payload = {
      formType,
      legalName,
      classification,
      country,
      tin,
      address: { street, city, state, zip },
      dbaName: document.getElementById('tax-dba-name')?.value.trim() || '',
      signature,
      certifiedAt: new Date().toISOString(),
      w9Details: formType === 'w9' ? { classification, tin } : null,
      w8Details: formType !== 'w9' ? {
        citizenship: country,
        foreignTin: tin,
        usTin: document.getElementById('tax-w8-us-tin')?.value.trim() || '',
        dob: document.getElementById('tax-w8-dob')?.value || '',
        treatyClaimed: document.getElementById('tax-w8-treaty-claim')?.checked || false,
        treatyCountry: document.getElementById('tax-treaty-country')?.value.trim() || '',
        claimedRate: document.getElementById('tax-treaty-rate')?.value || '0',
        fatcaStatus: formType === 'w8bene' ? (document.getElementById('tax-w8bene-fatca')?.value || '') : ''
      } : null
    };

    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/tax-details`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Failed to submit tax form.');
        showToast('Tax compliance form successfully saved.');
        await loadTaxDetails();
    } catch (err) {
        showToast(err.message || 'Failed to save tax details.', true);
    }
}

// Load Tax Details
async function loadTaxDetails() {
    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/tax-details`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) return;

        const data = await response.json();
        if (data && data.formType) {
            selectTaxForm(data.formType);
            if (document.getElementById('tax-legal-name')) document.getElementById('tax-legal-name').value = data.legalName || '';
            if (document.getElementById('tax-dba-name')) document.getElementById('tax-dba-name').value = data.dbaName || '';
            if (data.address) {
                if (document.getElementById('tax-address-street')) document.getElementById('tax-address-street').value = data.address.street || '';
                if (document.getElementById('tax-address-city')) document.getElementById('tax-address-city').value = data.address.city || '';
                if (document.getElementById('tax-address-state')) document.getElementById('tax-address-state').value = data.address.state || '';
                if (document.getElementById('tax-address-zip')) document.getElementById('tax-address-zip').value = data.address.zip || '';
            }
            if (data.w9Details && document.getElementById('tax-w9-tin')) {
                document.getElementById('tax-w9-tin').value = data.w9Details.tin || '';
                document.getElementById('tax-w9-classification').value = data.w9Details.classification || 'individual';
            }
            if (data.w8Details) {
                if (document.getElementById('tax-w8-citizenship')) document.getElementById('tax-w8-citizenship').value = data.w8Details.citizenship || '';
                if (document.getElementById('tax-w8-ftin')) document.getElementById('tax-w8-ftin').value = data.w8Details.foreignTin || '';
                if (document.getElementById('tax-w8-us-tin')) document.getElementById('tax-w8-us-tin').value = data.w8Details.usTin || '';
                if (document.getElementById('tax-w8-dob')) document.getElementById('tax-w8-dob').value = data.w8Details.dob || '';
                if (document.getElementById('tax-treaty-country')) document.getElementById('tax-treaty-country').value = data.w8Details.treatyCountry || '';
                if (document.getElementById('tax-treaty-rate')) document.getElementById('tax-treaty-rate').value = data.w8Details.claimedRate || '0';
            }
        }
    } catch {
        // Fallback default UI state
    }
}
