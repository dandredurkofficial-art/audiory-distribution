function extractApiError(response) {
    if (!response) {
        return 'No response received from the distribution gateway.';
    }

    if (typeof response === 'string') {
        return response;
    }

    if (response.errors) {
        if (Array.isArray(response.errors)) {
            return response.errors
                .map(error => {
                    if (typeof error === 'string') {
                        return error;
                    }
                    return (
                        error.message ||
                        error.detail ||
                        JSON.stringify(error)
                    );
                })
                .join('\n');
        }

        if (typeof response.errors === 'object') {
            return Object.entries(response.errors)
                .map(([field, value]) =>
                    `${field}: ${
                        typeof value === 'string'
                            ? value
                            : JSON.stringify(value)
                    }`
                )
                .join('\n');
        }
    }

    return (
        response.message ||
        response.error ||
        response.detail ||
        'Unknown distribution API error.'
    );
}

window.handleFormSubmission = async function(event) {
    if (event) event.preventDefault();

    const validationErrors = window.validateReleaseForSubmission ? window.validateReleaseForSubmission() : [];
    const deliveryErrors = window.validateDelivery ? window.validateDelivery() : [];
    const allErrors = [...validationErrors, ...deliveryErrors];

    if (allErrors.length > 0) {
        return window.showToast(`Cannot submit: ${allErrors[0]}`);
    }

    if (!window.releaseState.agreements?.termsAccepted) {
        return window.showToast('Please confirm that you are authorized to distribute this release.');
    }

    if (!window.releaseState.agreements?.rightsConfirmed) {
        return window.showToast('Please confirm that all samples, interpolations and performances are cleared.');
    }

    const hasArtworkFile = Boolean(window.releaseState.artwork?.file);
    const existingArtworkUrl = window.releaseState.artwork?.url || '';
    
    if (!hasArtworkFile && !existingArtworkUrl) {
        return window.showToast('Please upload cover artwork before submitting.');
    }

    // =========================================================
    // 1. FAIL-SAFE GENRE & METADATA EXTRACTION (DOM + STATE FALLBACK)
    // =========================================================
    const primaryGenreSelect = document.getElementById('primaryGenreSelect') || 
                               document.getElementById('primaryGenre') || 
                               document.querySelector('[name="primaryGenre"]');
                               
    const secondaryGenreSelect = document.getElementById('secondaryGenreSelect') || 
                                 document.getElementById('secondaryGenre') || 
                                 document.querySelector('[name="secondaryGenre"]');

    const domPrimaryGenre = primaryGenreSelect ? primaryGenreSelect.value : '';
    const domSecondaryGenre = secondaryGenreSelect ? secondaryGenreSelect.value : '';

    const primaryGenre = String(
        window.releaseState.metadata?.primaryGenre ||
        window.releaseState.metadata?.primary_genre ||
        window.releaseState.metadata?.genre ||
        window.releaseState.primaryGenre ||
        window.releaseState.primary_genre ||
        window.releaseState.genre ||
        domPrimaryGenre ||
        ''
    ).trim();

    const secondaryGenre = String(
        window.releaseState.metadata?.secondaryGenre ||
        window.releaseState.metadata?.secondary_genre ||
        window.releaseState.metadata?.subgenre ||
        window.releaseState.secondaryGenre ||
        window.releaseState.secondary_genre ||
        window.releaseState.subgenre ||
        domSecondaryGenre ||
        ''
    ).trim();

    if (!primaryGenre) {
        return window.showToast('Please select a Primary Genre for this release.');
    }

    // Synchronize resolved values back into state to prevent downstream drops
    if (!window.releaseState.metadata) window.releaseState.metadata = {};
    window.releaseState.metadata.primaryGenre = primaryGenre;
    window.releaseState.metadata.secondaryGenre = secondaryGenre;

    const submitBtn = document.getElementById('submitReleaseBtn');
    const progressCard = document.getElementById('submission-progress-card');
    const statusText = document.getElementById('progress-status-text');
    const percentageText = document.getElementById('progress-percentage');
    const progressFill = document.getElementById('progress-bar-fill');

    const updateProgress = (percent, message) => {
        if (progressFill) progressFill.style.width = `${percent}%`;
        if (percentageText) percentageText.innerText = `${Math.round(percent)}%`;
        if (statusText) statusText.innerText = message;
    };

    let originalBtnHTML = '';
    if (submitBtn) {
        originalBtnHTML = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.style.opacity = '0.7';
        submitBtn.innerHTML = `
            <span style="display: inline-flex; align-items: center; gap: 8px;">
                <svg style="animation: spin 1s linear infinite; width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"></circle>
                </svg>
                Submitting...
            </span>
        `;
    }

    if (progressCard) progressCard.style.display = 'block';
    updateProgress(5, 'Initializing submission pipeline...');

    try {
        const totalTracks = window.releaseState.tracks?.length || 0;
        const instrumentalCount = (window.releaseState.tracks || []).filter(t => Boolean(t.instrumentalFile)).length;
        const totalUploadSteps = (hasArtworkFile ? 1 : 0) + totalTracks + instrumentalCount;
        let completedSteps = 0;

        let finalCoverUrl = existingArtworkUrl;
        if (hasArtworkFile) {
            updateProgress(10, 'Uploading Cover Artwork...');
            const uploadRes = await uploadFileToR2(window.releaseState.artwork.file, 'artwork');
            finalCoverUrl = typeof uploadRes === 'string' ? uploadRes : (uploadRes?.url || uploadRes?.location || uploadRes?.path || '');

            if (!finalCoverUrl) throw new Error('Artwork upload succeeded but returned an invalid URL.');

            window.releaseState.artwork.url = finalCoverUrl;
            completedSteps++;
            const stepPercent = 10 + Math.floor((completedSteps / (totalUploadSteps || 1)) * 60);
            updateProgress(stepPercent, 'Cover Artwork uploaded successfully!');
        } else {
            updateProgress(20, 'Using existing artwork...');
        }

        for (let i = 0; i < totalTracks; i++) {

    const track = window.releaseState.tracks[i];

    // =========================================================
    // MASTER AUDIO → AUDIORY R2
    // =========================================================

    if (track.audioFile) {

        updateProgress(
            20 +
            Math.floor(
                (completedSteps /
                (totalUploadSteps || 1)) * 60
            ),
            `Uploading Track ${i + 1} of ${totalTracks}: "${track.metadata?.title || 'Master Audio'}"...`
        );

        const trackRes =
            await uploadFileToR2(
                track.audioFile,
                'audio'
            );

        const trackUrl =
            typeof trackRes === 'string'
                ? trackRes
                : (
                    trackRes?.url ||
                    trackRes?.location ||
                    ''
                );

        if (!trackUrl) {
            throw new Error(
                `Track ${i + 1} R2 upload returned no URL.`
            );
        }

        window.releaseState.tracks[i].audioUrl =
            trackUrl;
    }

    // =========================================================
    // INSTRUMENTAL → AUDIORY R2
    // =========================================================

    if (track.instrumentalFile) {

        updateProgress(
            50,
            `Uploading Track ${i + 1} Instrumental...`
        );

        const instrumentalRes =
            await uploadFileToR2(
                track.instrumentalFile,
                'instrumental'
            );

        const instrumentalUrl =
            typeof instrumentalRes === 'string'
                ? instrumentalRes
                : (
                    instrumentalRes?.url ||
                    instrumentalRes?.location ||
                    instrumentalRes?.path ||
                    ''
                );

        if (!instrumentalUrl) {
            throw new Error(
                `Track ${i + 1} instrumental upload returned no URL.`
            );
        }

        window.releaseState.tracks[i].instrumentalUrl =
            instrumentalUrl;
    }

    completedSteps++;
}

        updateProgress(80, 'Formatting release metadata & participant roles...');

        const labelNameInput = typeof window.releaseState.label === 'object' 
            ? (window.releaseState.label.name || window.releaseState.label.label) 
            : window.releaseState.label;

        const labelString = (labelNameInput && labelNameInput.trim()) ? labelNameInput.trim() : 'Independent';
        const ALLOWED_ROLES = ['primary', 'featuring', 'remixer'];

        const mappedParticipants = (window.releaseState.artists || [])
            .map(artist => {
                let rawRoles = Array.isArray(artist.role) ? artist.role : [artist.role || 'primary'];
                const cleanedRoles = rawRoles.map(r => {
                    const norm = String(r).toLowerCase().trim();
                    if (norm.includes('feat')) return 'featuring';
                    if (norm.includes('remix')) return 'remixer';
                    if (ALLOWED_ROLES.includes(norm)) return norm;
                    return 'primary';
                });

                const artistName = typeof artist === 'string' ? artist : (artist.name || artist.artist_name || '');
                return {
                    name: artistName.trim(),
                    role: Array.from(new Set(cleanedRoles)),
                    spotify_id: artist.spotify_id || '',
                    apple_id: artist.apple_id || ''
                };
            })
            .filter(p => p.name !== '');

        if (mappedParticipants.length === 0) throw new Error('Please specify at least one Primary Artist name.');

        const editingId = window.releaseState.editingId;
        const isEditing = Boolean(editingId);

        const currentYear = new Date().getFullYear().toString();
        const labelObject =
            window.releaseState.label && typeof window.releaseState.label === 'object'
                ? window.releaseState.label
                : {};

        const rawCLine = labelObject.cLine || window.releaseState.cLine || '';
        const rawPLine = labelObject.pLine || window.releaseState.pLine || '';

        const cYearMatch = rawCLine.match(/\b(19|20)\d{2}\b/);
        const pYearMatch = rawPLine.match(/\b(19|20)\d{2}\b/);

        const extractedCYear = cYearMatch ? cYearMatch[0] : (window.releaseState.label?.cYear || currentYear);
        const extractedPYear = pYearMatch ? pYearMatch[0] : (window.releaseState.label?.pYear || currentYear);

        const primaryGenreId = !isNaN(Number(primaryGenre)) && primaryGenre !== '' ? Number(primaryGenre) : null;
        const secondaryGenreId = !isNaN(Number(secondaryGenre)) && secondaryGenre !== '' ? Number(secondaryGenre) : null;

        // Standardized Payload with all fallback keys
        const payload = {
            title: window.releaseState.metadata?.title || '',
            type: window.releaseState.metadata?.type || 'Single',
            language: window.releaseState.metadata?.language || 'en',

            // Canonical Genre Keys (Strings & Numeric IDs)
            primaryGenre: primaryGenre,
            primary_genre: primaryGenre,
            primary_genre_id: primaryGenreId,
            genre: primaryGenre,

            secondaryGenre: secondaryGenre || null,
            secondary_genre: secondaryGenre || null,
            secondary_genre_id: secondaryGenreId,
            subgenre: secondaryGenre || null,

            label: labelString,
            cLine: rawCLine,
            c_line: rawCLine,
            cYear: extractedCYear,
            c_year: extractedCYear,
            pLine: rawPLine,
            p_line: rawPLine,
            pYear: extractedPYear,
            p_year: extractedPYear,
            
            participants: mappedParticipants,
            artists: mappedParticipants,
            
            releaseDate: window.releaseState.dates?.releaseDate || null,
            release_date: window.releaseState.dates?.releaseDate || null,

            releaseTime: window.releaseState.dates?.releaseTime || null,
            timeZone: window.releaseState.dates?.timezone || 'Africa/Nairobi',

            originalReleaseDate:
                window.releaseState.dates?.originalReleaseDate || null,

            applePreorder:
                Boolean(window.releaseState.applePreorder?.enabled),

            applePreorderDate:
                window.releaseState.applePreorder?.enabled
                    ? (window.releaseState.applePreorder?.date || null)
                    : null,

            licenseType:
                window.releaseState.license?.type || 'Copyright',

            licenseInfo:
                window.releaseState.license?.info?.trim() || null,
            
            dsps: window.releaseState.dsps || [],
            platforms: window.releaseState.dsps || [],
            delivery: window.releaseState.delivery || {},
            
            cover_url: finalCoverUrl,
            coverUrl: finalCoverUrl,
            cover_art: finalCoverUrl,
            artwork: finalCoverUrl,
            compressed_artwork: finalCoverUrl,
            compressedArtwork: finalCoverUrl,
            
            tracks: (window.releaseState.tracks || []).map(t => ({
                title: t.metadata?.title?.trim() || '',
                version: t.metadata?.version?.trim() || null,
                explicit: Boolean(t.metadata?.explicit),
                isrc: t.isrc?.trim() || null,
                audio_url: t.audioUrl || null,
                audioUrl: t.audioUrl || null,
                instrumental_url: t.instrumentalUrl || null,
                instrumentalUrl: t.instrumentalUrl || null,
                tiktok_start_time: t.tiktokStartTime?.trim() || null,
                lyrics: {
                    content: t.lyrics?.content || null,
                    explicit: Boolean(t.lyrics?.explicit),
                    clean_version: Boolean(t.lyrics?.cleanVersion)
                },
                artists: (t.artists || []).filter(a => a.name?.trim()).map(a => ({
                    name: a.name.trim(),
                    role: a.role || 'primary'
                })),
                writers: (t.writers || []).filter(w => w.name?.trim()).map(w => ({
                    name: w.name.trim(),
                    role: w.role === 'lyricist' ? 'lyricist' : 'instrumentalist'
                })),
                credits: t.credits?.trim() || null
            })),
            submittedBy: window.currentUser ? window.currentUser.uid : 'anonymous',
            createdAt: new Date().toISOString()
        };

        updateProgress(90, 'Dispatching metadata to Gateway...');

        const token = window.currentUser?.getIdToken
            ? await window.currentUser.getIdToken()
            : '';

        let releaseId = editingId || null;
        let submitResponseData = null;

        // CREATE OR UPDATE RELEASE DRAFT
        const releaseEndpoint = releaseId
            ? `${WORKER_BASE_URL}/api/releases/${releaseId}`
            : `${WORKER_BASE_URL}/api/releases`;

        const res = await fetch(releaseEndpoint, {
            method: isEditing ? 'PUT' : 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
        });

        const serverResponse = await res.json().catch(() => null);

        if (!res.ok) {
            const apiErrMessage = serverResponse?.error || serverResponse?.message || 'Failed to save release draft.';
            throw new Error(apiErrMessage);
        }

        releaseId =
            serverResponse?.releaseId ||
            serverResponse?.id ||
            serverResponse?.data?.id ||
            serverResponse?.createResponse?.data?.id ||
            serverResponse?.metadataResponse?.data?.id ||
            releaseId;

        if (!releaseId) {
            throw new Error(
                'Release was created but the server did not return a release ID.'
            );
        }

        // =============================================================
// UPLOAD TRACK AUDIO FILES TO TOO LOST
// NOW THAT releaseId EXISTS
// =============================================================

for (let i = 0; i < totalTracks; i++) {

    const track = window.releaseState.tracks[i];

    // =========================================================
    // MASTER AUDIO → TOO LOST
    // =========================================================

    if (track.audioFile) {

        updateProgress(
            82,
            `Sending Track ${i + 1} to Too Lost...`
        );

        const tooLostForm = new FormData();

        tooLostForm.append(
            'file',
            track.audioFile,
            track.audioFile.name
        );

        tooLostForm.append(
            'kind',
            'audio'
        );

        const tooLostUploadResponse =
            await fetch(
                `${WORKER_BASE_URL}/api/releases/${releaseId}/tracks/upload`,
                {
                    method: 'POST',

                    headers: {
                        'Authorization':
                            `Bearer ${token}`
                    },

                    body: tooLostForm
                }
            );

        const tooLostUploadText =
            await tooLostUploadResponse.text();

        let tooLostUploadData = {};

        try {
            tooLostUploadData =
                JSON.parse(
                    tooLostUploadText || "{}"
                );
        } catch (e) {
            tooLostUploadData = {
                raw: tooLostUploadText
            };
        }

        if (!tooLostUploadResponse.ok) {
            throw new Error(
                `Too Lost master audio upload failed (${tooLostUploadResponse.status}): ${
                    tooLostUploadData?.error ||
                    tooLostUploadData?.details ||
                    tooLostUploadText
                }`
            );
        }

        const audioFileKey =
            tooLostUploadData?.fileKey;

        if (!audioFileKey) {
            throw new Error(
                `Too Lost did not return an audio fileKey for Track ${i + 1}.`
            );
        }

        window.releaseState.tracks[i].audioFileKey =
            audioFileKey;
    }

    // =========================================================
    // INSTRUMENTAL → TOO LOST
    // =========================================================

    if (track.instrumentalFile) {

        updateProgress(
            86,
            `Sending Track ${i + 1} instrumental...`
        );

        const instrumentalForm =
            new FormData();

        instrumentalForm.append(
            'file',
            track.instrumentalFile,
            track.instrumentalFile.name
        );

        instrumentalForm.append(
            'kind',
            'instrumental'
        );

        const instrumentalTooLostResponse =
            await fetch(
                `${WORKER_BASE_URL}/api/releases/${releaseId}/tracks/upload`,
                {
                    method: 'POST',

                    headers: {
                        'Authorization':
                            `Bearer ${token}`
                    },

                    body: instrumentalForm
                }
            );

        const instrumentalTooLostText =
            await instrumentalTooLostResponse.text();

        let instrumentalTooLostData = {};

        try {
            instrumentalTooLostData =
                JSON.parse(
                    instrumentalTooLostText || "{}"
                );
        } catch (e) {
            instrumentalTooLostData = {
                raw: instrumentalTooLostText
            };
        }

        if (!instrumentalTooLostResponse.ok) {
            throw new Error(
                `Too Lost instrumental upload failed (${instrumentalTooLostResponse.status}): ${
                    instrumentalTooLostData?.error ||
                    instrumentalTooLostData?.details ||
                    instrumentalTooLostText
                }`
            );
        }

        const instrumentalFileKey =
            instrumentalTooLostData?.fileKey;

        if (!instrumentalFileKey) {
            throw new Error(
                `Too Lost did not return an instrumental fileKey for Track ${i + 1}.`
            );
        }

        window.releaseState.tracks[i].instrumentalFileKey =
            instrumentalFileKey;
    }
}

        // =============================================================
        // ATTACH TRACKS TO TOO LOST RELEASE
        // =============================================================

        updateProgress(
            88,
            'Saving release tracks...'
        );

        const tooLostTracks =
            (window.releaseState.tracks || []).map(
                (track) => {

                    const artists =
                        (track.artists || [])
                            .filter(
                                artist =>
                                    artist?.name?.trim()
                            )
                            .map(
                                (artist) => ({
                                    name:
                                        artist.name.trim(),

                                    role:
                                        Array.isArray(artist.role)
                                            ? artist.role
                                            : [
                                                String(
                                                    artist.role ||
                                                    'primary'
                                                ).toLowerCase()
                                            ],

                                    ...(artist.default !== undefined
                                        ? {
                                            default:
                                                Boolean(
                                                    artist.default
                                                )
                                        }
                                        : {})
                                })
                            );

                    const writers = [];

                    for (const writer of (track.writers || [])) {
                        const name = writer?.name?.trim();

                        if (!name) {
                            continue;
                        }

                        const roles = Array.isArray(writer.role)
                            ? writer.role
                            : [
                                String(
                                    writer.role || 'instrumentalist'
                                ).toLowerCase()
                            ];

                        const existingWriter = writers.find(
                            existing =>
                                existing.name.toLowerCase() === name.toLowerCase()
                        );

                        if (existingWriter) {
                            // Same writer already exists.
                            // Merge any additional roles instead of
                            // sending a duplicate writer object.
                            for (const role of roles) {
                                if (!existingWriter.role.includes(role)) {
                                    existingWriter.role.push(role);
                                }
                            }
                        } else {
                            writers.push({
                                name,
                                role: roles
                            });
                        }
                    }

                    if (!track.audioFileKey) {
                        throw new Error(
                            `Track "${track.metadata?.title || 'Untitled'}" is missing its audio fileKey.`
                        );
                    }

                    if (!artists.length) {
                        throw new Error(
                            `Track "${track.metadata?.title || 'Untitled'}" has no artists.`
                        );
                    }

                    if (!writers.length) {
                        throw new Error(
                            `Track "${track.metadata?.title || 'Untitled'}" has no writers.`
                        );
                    }

                    const trackBody = {
                        title:
                            track.metadata?.title?.trim() ||
                            '',

                        language:
                            window.releaseState.metadata?.language ||
                            'en',

                        audioFileKey:
                            track.audioFileKey,

                        artists,

                        writers
                    };

                    // Optional fields
                    if (
                        track.instrumentalFileKey
                    ) {
                        trackBody.instrumentalFileKey =
                            track.instrumentalFileKey;
                    }

                    if (
                        track.dolbyFileKey
                    ) {
                        trackBody.dolbyFileKey =
                            track.dolbyFileKey;
                    }

                    if (
                        track.isrc?.trim()
                    ) {
                        trackBody.isrc =
                            track.isrc.trim();
                    }

                    if (
                        track.iswc?.trim()
                    ) {
                        trackBody.iswc =
                            track.iswc.trim();
                    }

                    if (
                        track.metadata?.version?.trim()
                    ) {
                        trackBody.version =
                            track.metadata.version.trim();
                    }

                    if (
                        track.tiktokStartTime?.trim()
                    ) {
                        trackBody.tiktokStartTime =
                            track.tiktokStartTime.trim();
                    }

                    if (
                        track.lyrics?.content?.trim()
                    ) {
                        trackBody.lyrics = {
                            content:
                                track.lyrics.content.trim(),

                            explicit:
                                Boolean(
                                    track.lyrics.explicit
                                ),

                            cleanVersion:
                                Boolean(
                                    track.lyrics.cleanVersion
                                )
                        };    
                    }

                    return trackBody;
                }
            );

        const tracksResponse =
            await fetch(
                `${WORKER_BASE_URL}/api/releases/${releaseId}/tracks`,
                {
                    method: 'PUT',

                    headers: {
                        'Content-Type':
                            'application/json',

                        'Accept':
                            'application/json',

                        'Authorization':
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        tracks:
                            tooLostTracks
                    })
                }
            );

        const tracksResponseText =
            await tracksResponse.text();

        let tracksResponseData = {};

        try {
            tracksResponseData =
                JSON.parse(
                    tracksResponseText || "{}"
                );
        } catch (e) {
            tracksResponseData = {
                raw: tracksResponseText
            };
        }

        if (!tracksResponse.ok) {

            throw new Error(
                `Too Lost track save failed (${tracksResponse.status}): ${
                    tracksResponseData?.message ||
                    tracksResponseData?.error ||
                    tracksResponseData?.detail ||
                    tracksResponseText
                }`
            );
        }

        console.log(
            'TOO LOST TRACKS SAVED:',
            tracksResponseData
        );

        // =============================================================
        // NOW SUBMIT RELEASE TO TOO LOST
        // =============================================================

        updateProgress(
            95,
            'Submitting release...'
        );

        const submitEndpoint =
            `${WORKER_BASE_URL}/api/releases/${releaseId}/submit`;

        const submitPayload = {
            ...payload,
            acceptTerms: String(Boolean(window.releaseState.agreements?.termsAccepted)),
            accept_terms: Boolean(window.releaseState.agreements?.termsAccepted),
            confirmRights: String(Boolean(window.releaseState.agreements?.rightsConfirmed)),
            confirm_rights: Boolean(window.releaseState.agreements?.rightsConfirmed),
            confirmYoutubeRights: Boolean(window.releaseState.agreements?.youtubeRightsConfirmed),
            confirm_youtube_rights: Boolean(window.releaseState.agreements?.youtubeRightsConfirmed),
            idempotencyKey: `${releaseId}-${Date.now()}`
        };

        const submitRes = await fetch(submitEndpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(submitPayload)
        });

        const submitResponseText = await submitRes.text();

        try {
            submitResponseData = JSON.parse(submitResponseText);
        } catch (e) {
            submitResponseData = { raw: submitResponseText };
        }

        if (!submitRes.ok) {
            const apiMessage =
                submitResponseData?.message ||
                submitResponseData?.error ||
                submitResponseData?.detail ||
                submitResponseData?.data?.message ||
                submitResponseText ||
                `HTTP ${submitRes.status}`;

            throw new Error(`Too Lost submit failed (${submitRes.status}): ${apiMessage}`);
        }

        updateProgress(100, `Release successfully ${isEditing ? 'updated' : 'submitted'}! Redirecting...`);
        const currentUid = window.currentUser ? window.currentUser.uid : 'anonymous';
        const returnedStatus =
            submitResponseData?.status ??
            submitResponseData?.data?.status ??
            serverResponse?.status ??
            serverResponse?.data?.status ??
            'in_review';

        const validStatus = typeof formatReleaseStatus === 'function' 
            ? formatReleaseStatus(returnedStatus) 
            : returnedStatus;

        const finalId = isEditing ? editingId : (releaseId || Date.now());
        const newReleaseItem = {
            id: finalId,
            title: payload.title,
            type: payload.type,
            status: validStatus,
            coverUrl: finalCoverUrl,
            compressedArtwork: finalCoverUrl,
            participants: mappedParticipants,
            upc:
                submitResponseData?.upc ??
                submitResponseData?.data?.upc ??
                serverResponse?.upc ??
                serverResponse?.data?.upc ??
                'Pending',
            submittedBy: currentUid
        };

        if (typeof loadLiveCatalog === 'function') {
            await loadLiveCatalog();
        }

        const userLocalStorageKey = `audiory_releases_${currentUid}`;
        let localSavedReleases = JSON.parse(localStorage.getItem(userLocalStorageKey) || localStorage.getItem('audiory_local_releases') || '[]');

        if (isEditing) {
            const index = localSavedReleases.findIndex(item => String(item.id) === String(editingId));
            if (index !== -1) localSavedReleases[index] = { ...localSavedReleases[index], ...newReleaseItem };
            else localSavedReleases.unshift(newReleaseItem);
        } else {
            localSavedReleases.unshift(newReleaseItem);
        }

        localStorage.setItem(userLocalStorageKey, JSON.stringify(localSavedReleases));
        
        if (!Array.isArray(window.releasesCatalog)) window.releasesCatalog = [];
        if (isEditing) {
            const catIndex = window.releasesCatalog.findIndex(item => String(item.id) === String(editingId));
            if (catIndex !== -1) window.releasesCatalog[catIndex] = { ...window.releasesCatalog[catIndex], ...newReleaseItem };
            else window.releasesCatalog.unshift(newReleaseItem);
        } else {
            window.releasesCatalog.unshift(newReleaseItem);
        }

        window.releaseState.editingId = null;

        setTimeout(() => {
            if (typeof window.loadLiveCatalog === 'function') {
                try { window.loadLiveCatalog(); } catch (e) {}
            }
            if (typeof window.renderDashboardHome === 'function') window.renderDashboardHome();
            if (typeof window.switchView === 'function') window.switchView('catalog');
            
            if (progressCard) progressCard.style.display = 'none';
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.style.cursor = 'pointer';
                submitBtn.style.opacity = '1';
                submitBtn.innerHTML = originalBtnHTML;
            }
        }, 1200);

    } catch (err) {
        console.error('Submission Error:', err);
        if (typeof window.showToast === 'function') {
            window.showToast(`Submission failed: ${err.message}`);
        } else {
            alert(`Submission failed: ${err.message}`);
        }
        
        if (progressCard) progressCard.style.display = 'none';
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.style.cursor = 'pointer';
            submitBtn.style.opacity = '1';
            submitBtn.innerHTML = originalBtnHTML;
        }
    }
};
        
    </script>
</body>
</html>
