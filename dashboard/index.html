    <!-- Production JavaScript Module Hooking Firebase, Worker & R2 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Client Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBtii4iYkm7ummyi5SHiQMOMUPrOpwhdrk",
            authDomain: "audiory-distribution.firebaseapp.com",
            databaseURL: "https://audiory-distribution-default-rtdb.firebaseio.com",
            projectId: "audiory-distribution",
            storageBucket: "audiory-distribution.firebasestorage.app",
            messagingSenderId: "944053428828",
            appId: "1:944053428828:web:30277072355728f9c8fc99",
            measurementId: "G-MXDJH52XX4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Production Configuration Endpoints
        const WORKER_BASE_URL = "https://audiorydistribution.dandredurkofficial.workers.dev";

        // Global State Variables
        window.currentUser = null;
        window.releasesCatalog = [];
        window.formTrackList = [
            { id: Date.now(), name: '', version: '', language: 'English', artists: '', writers: '', isrc: '', audioFileName: null, rawAudioFile: null }
        ];

        // Auth Observer Hook
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                document.getElementById('userName').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('userInitials').innerText = (user.displayName || user.email).substring(0, 2).toUpperCase();
                
                await loadLiveCatalog();
                switchView('home');
            } else {
                // Redirect unauthenticated user to login view
                window.location.href = '/login/';
            }
        });

        window.handleSignOut = () => signOut(auth).then(() => window.location.href = '/login/');

        // Fetch Live Releases from Firestore
        async function loadLiveCatalog() {
            try {
                const q = query(collection(db, "releases"), where("userId", "==", window.currentUser.uid));
                const querySnapshot = await getDocs(q);
                window.releasesCatalog = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (err) {
                console.error("Error loading live catalog:", err);
            }
        }

        // Direct R2 Binary Upload via Cloudflare Worker Pre-Signed URLs
        async function uploadFileToR2(file, folder = 'audio') {
            const fileName = `${folder}/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
            const token = await window.currentUser.getIdToken();

            const res = await fetch(`${WORKER_BASE_URL}/api/presigned-url`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ key: fileName, contentType: file.type })
            });

            if (!res.ok) throw new Error('Failed to retrieve upload URL from Worker');
            const { uploadUrl, publicUrl } = await res.json();

            // Direct binary PUT to R2 Bucket
            const uploadRes = await fetch(uploadUrl, {
                method: 'PUT',
                headers: { 'Content-Type': file.type },
                body: file
            });

            if (!uploadRes.ok) throw new Error('Failed uploading binary to Cloudflare R2');
            return publicUrl;
        }

        // View Router Switching
        window.switchView = function(viewName) {
            ['home', 'catalog', 'create', 'analytics', 'settings'].forEach(v => {
                const btn = document.getElementById(`nav_${v}`);
                if (btn) {
                    btn.className = (v === viewName)
                        ? "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-brand-accent bg-brand-dark border border-brand-border/80 transition-all"
                        : "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all";
                }
            });

            const viewport = document.getElementById('mainViewport');
            if (viewName === 'home') viewport.innerHTML = renderHomeView();
            if (viewName === 'catalog') viewport.innerHTML = renderCatalogView();
            if (viewName === 'create') {
                viewport.innerHTML = renderCreateReleaseView();
                renderTrackCards();
            }
            if (viewName === 'analytics') viewport.innerHTML = renderAnalyticsView();
            if (viewName === 'settings') viewport.innerHTML = renderSettingsView();

            const sidebar = document.getElementById('sidebarNav');
            if (!sidebar.classList.contains('-translate-x-full')) sidebar.classList.add('-translate-x-full');
        };

        window.toggleMobileSidebar = () => document.getElementById('sidebarNav').classList.toggle('-translate-x-full');

        // Render Functions
        function renderHomeView() {

                            <p class="text-xs text-gray-400">Live production telemetry & Too Lost API gateway pipeline.</p>
                        </div>
                        <button onclick="switchView('create')" class="px-5 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs flex items-center gap-2 shadow-lg shadow-cyan-500/10">
                            <i class="fa-solid fa-plus text-[10px]"></i> New Release
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Active Catalog</p>
                            <h3 class="text-2xl font-black text-white font-mono">${window.releasesCatalog.length}</h3>
                        </div>
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Status</p>
                            <span class="text-xs font-bold text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> R2 & Too Lost Ready</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCatalogView() {
            if (window.releasesCatalog.length === 0) {
                return `
                    <div class="text-center py-20 bg-brand-card rounded-2xl border border-brand-border space-y-4">

            }
            return `

                    <h1 class="text-2xl font-bold text-white">Releases Catalog</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${window.releasesCatalog.map(rel => `

                                <img src="${rel.coverUrl}" class="w-full aspect-square object-cover rounded-xl border border-brand-border">

                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Global State Schema mapping your exact structure
window.releaseState = {
    metadata: { title: '', version: '', catalogNumber: '', upc: '', type: 'Single', language: 'English', explicit: false },
    artists: [{ name: '', role: 'Primary', spotifyId: '', appleId: '' }],
    label: { name: '', cLine: '', pLine: '' },
    dates: { releaseDate: '', salesStart: '', preOrderDate: '' },
    territories: { mode: 'Worldwide', countries: [] },
    distributionDeals: { dealType: 'Standard DDEX', dspExclusions: [] },
    artwork: { file: null, url: '' },
    tracks: [
        {
            id: Date.now(),
            audioFile: null,
            audioUrl: '',
            metadata: { title: '', version: '', explicit: false, language: 'English' },
            isrc: '',
            artists: [{ name: '', role: 'Primary' }],
            contributors: [{ name: '', role: 'Producer' }],
            musicalWork: { title: '', iswc: '' },
            writers: [{ name: '', role: 'Composer', ipi: '' }],
            splits: [{ partyName: '', role: 'Songwriter', percentage: 100, email: '' }],
            lyrics: { plain: '', synced: '', language: 'English' },
            rights: { isExplicit: false, containsSamples: false, sampleDetails: '' },
            licenses: { mechanicalLicenseNumber: '', publicDomain: false }
        }
    ],
    agreements: { termsAccepted: false, rightsConfirmed: false }
};

window.currentStep = 1;

// Multi-Step Form Layout Renderer
function renderCreateReleaseView() {
    return `

                </div>

                <!-- STEP 3: Artwork Upload -->
                <div id="step_3_content" class="hidden space-y-6">
                    <h3 class="text-xs font-bold text-brand-accent font-mono uppercase tracking-wider">Artwork Specs</h3>
                    <div class="p-4 rounded-xl bg-brand-dark/50 border border-brand-border text-xs text-gray-400 space-y-1">
                        <p class="text-white font-bold">Requirements:</p>
                        <p>• Minimum 3000 x 3000 pixels (Square 1:1 ratio)</p>
                        <p>• Format: JPG, PNG | Color Space: RGB</p>
                        <p>• No social handles, website URLs, or pricing details</p>
                    </div>
                    <div>
                        <label class="too-lost-form-label">Select High-Res Artwork *</label>
                        <input type="file" accept="image/*" onchange="window.handleCoverArtSelection(event)" class="too-lost-input">
                    </div>
                </div>

                <!-- STEP 4: Full Tracks Editor (Audio, Writers, Splits, Lyrics, Rights) -->
                <div id="step_4_content" class="hidden space-y-6">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold text-brand-accent font-mono uppercase tracking-wider">Tracks & Audio Assets</h3>
                        <button type="button" onclick="addNewTrackToState()" class="px-3 py-1.5 rounded-lg bg-brand-accent/10 border border-brand-accent/30 text-brand-accent text-xs font-bold">
                            + Add Track
                        </button>
                    </div>
                    <div id="tracksEditorContainer" class="space-y-6"></div>
                </div>

                <!-- STEP 5: Quality Control (QC) & Legal Agreements -->
                <div id="step_5_content" class="hidden space-y-6">
                    <h3 class="text-xs font-bold text-brand-accent font-mono uppercase tracking-wider">Automated Pre-Flight Quality Control (QC)</h3>
                    <div id="qcResultsBox" class="p-4 rounded-xl bg-brand-dark border border-brand-border space-y-2 text-xs font-mono">
                        <p class="text-emerald-400"><i class="fa-solid fa-check"></i> Metadata format verified</p>
                        <p class="text-emerald-400"><i class="fa-solid fa-check"></i> C-Line / P-Line validation passed</p>
                    </div>

                    <h3 class="text-xs font-bold text-brand-accent font-mono uppercase tracking-wider pt-4 border-t border-brand-border">Agreements & Clearance</h3>
                    <div class="space-y-3 text-xs">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" onchange="window.releaseState.agreements.termsAccepted = this.checked" class="rounded bg-brand-dark border-brand-border text-cyan-400">
                            <span class="text-gray-300">I confirm that I own or control 100% of the distribution rights for these assets.</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" onchange="window.releaseState.agreements.rightsConfirmed = this.checked" class="rounded bg-brand-dark border-brand-border text-cyan-400">
                            <span class="text-gray-300">I agree to Too Lost Terms of Service & DSP Delivery Agreements.</span>
                        </label>
                    </div>
                </div>

                <!-- STEP 6: Final Review, Delivery & Audit Log -->
                <div id="step_6_content" class="hidden space-y-6">
                    <h3 class="text-xs font-bold text-brand-accent font-mono uppercase tracking-wider">Delivery Summary</h3>
                    <div id="deliverySummary" class="p-4 rounded-xl bg-brand-dark border border-brand-border text-xs text-gray-300 font-mono space-y-2"></div>
                </div>

                <!-- Form Controls -->
                <div class="flex items-center justify-between pt-6 border-t border-brand-border">
                    <button type="button" id="prevStepBtn" onclick="navigateStep(-1)" class="px-5 py-2.5 rounded-xl bg-brand-dark border border-brand-border text-xs font-bold text-gray-400 hover:text-white disabled:opacity-30" disabled>
                        Previous
                    </button>
                    <button type="button" id="nextStepBtn" onclick="navigateStep(1)" class="px-6 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs flex items-center gap-2">
                        Next Section <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <button type="submit" id="submitReleaseBtn" class="hidden px-8 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Upload & Submit Release
                    </button>
                </div>
            </form>
        </div>
    `;
}

// Render dynamic track panels with full metadata/splits/writers/lyrics support
function renderTracksEditor() {
    const container = document.getElementById('tracksEditorContainer');
    if (!container) return;

    container.innerHTML = window.releaseState.tracks.map((track, idx) => `
        <div class="p-5 rounded-2xl bg-brand-dark border border-brand-border space-y-4">
            <div class="flex items-center justify-between border-b border-brand-border pb-3">
                <span class="text-xs font-bold font-mono text-cyan-400">Track #${idx + 1}</span>
                ${window.releaseState.tracks.length > 1 ? `<button type="button" onclick="removeTrackFromState(${idx})" class="text-xs text-red-400 hover:underline">Remove Track</button>` : ''}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="too-lost-form-label">Song Title *</label>
                    <input type="text" required value="${track.metadata.title}" onchange="window.releaseState.tracks[${idx}].metadata.title = this.value" class="too-lost-input">
                </div>
                <div>
                    <label class="too-lost-form-label">Audio Binary (WAV/FLAC) *</label>
                    <input type="file" accept="audio/*" onchange="window.handleTrackAudioFile(event, ${idx})" class="too-lost-input">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="too-lost-form-label">ISRC (Leave blank to auto-assign)</label>
                    <input type="text" value="${track.isrc}" onchange="window.releaseState.tracks[${idx}].isrc = this.value" class="too-lost-input">
                </div>
                <div>
                    <label class="too-lost-form-label">ISWC (Musical Work Code)</label>
                    <input type="text" value="${track.musicalWork.iswc}" onchange="window.releaseState.tracks[${idx}].musicalWork.iswc = this.value" class="too-lost-input">
                </div>
                <div>
                    <label class="too-lost-form-label">Explicit Content</label>
                    <select onchange="window.releaseState.tracks[${idx}].rights.isExplicit = (this.value === 'true')" class="too-lost-input">
                        <option value="false">Clean / Non-Explicit</option>
                        <option value="true">Explicit</option>
                    </select>
                </div>
            </div>

            <div class="pt-3 border-t border-brand-border/60">
                <label class="too-lost-form-label">Writers & Composers (Legal Names) *</label>
                <input type="text" placeholder="John Doe (Composer), Jane Smith (Lyricist)" required onchange="window.releaseState.tracks[${idx}].writers = [{ name: this.value, role: 'Songwriter' }]" class="too-lost-input">
            </div>

            <div class="pt-3 border-t border-brand-border/60">
                <label class="too-lost-form-label">Publishing & Revenue Splits (%)</label>
                <input type="text" placeholder="John Doe (50%), Jane Smith (50%)" onchange="window.releaseState.tracks[${idx}].splits = [{ partyName: this.value, percentage: 100 }]" class="too-lost-input">
            </div>

            <div class="pt-3 border-t border-brand-border/60">
                <label class="too-lost-form-label">Plain Lyrics</label>
                <textarea rows="2" onchange="window.releaseState.tracks[${idx}].lyrics.plain = this.value" class="too-lost-input" placeholder="Paste lyrics here..."></textarea>
            </div>
        </div>
    `).join('');
}

// Navigation Engine
window.navigateStep = function(direction) {
    const next = window.currentStep + direction;
    if (next < 1 || next > 6) return;

    document.getElementById(`step_${window.currentStep}_content`).classList.add('hidden');
    document.getElementById(`step_tab_${window.currentStep}`).className = "p-2 rounded-lg bg-brand-card text-gray-400 border border-brand-border";

    window.currentStep = next;

    document.getElementById(`step_${window.currentStep}_content`).classList.remove('hidden');
    document.getElementById(`step_tab_${window.currentStep}`).className = "p-2 rounded-lg bg-brand-accent text-brand-dark font-bold";
    document.getElementById('stepCounter').innerText = window.currentStep;

    document.getElementById('prevStepBtn').disabled = (window.currentStep === 1);
    
    if (window.currentStep === 4) renderTracksEditor();
    if (window.currentStep === 6) renderDeliverySummary();

    if (window.currentStep === 6) {
        document.getElementById('nextStepBtn').classList.add('hidden');
        document.getElementById('submitReleaseBtn').classList.remove('hidden');
    } else {
        document.getElementById('nextStepBtn').classList.remove('hidden');
        document.getElementById('submitReleaseBtn').classList.add('hidden');
    }
};

window.addNewTrackToState = function() {
    window.releaseState.tracks.push({
        id: Date.now(),
        audioFile: null,
        metadata: { title: '' },
        isrc: '',
        writers: [],
        splits: [],
        lyrics: { plain: '' },
        rights: { isExplicit: false }
    });
    renderTracksEditor();
};

window.removeTrackFromState = function(index) {
    window.releaseState.tracks.splice(index, 1);
    renderTracksEditor();
};

window.handleCoverArtSelection = (e) => {
    if (e.target.files[0]) window.releaseState.artwork.file = e.target.files[0];
};

window.handleTrackAudioFile = (e, index) => {
    if (e.target.files[0]) window.releaseState.tracks[index].audioFile = e.target.files[0];
};

function renderDeliverySummary() {
    const box = document.getElementById('deliverySummary');
    if (!box) return;
    box.innerHTML = `
        <p><strong>Title:</strong> ${window.releaseState.metadata.title || 'Untitled'}</p>
        <p><strong>Label:</strong> ${window.releaseState.label.name || 'Unspecified'}</p>
        <p><strong>Release Date:</strong> ${window.releaseState.dates.releaseDate || 'Immediate'}</p>
        <p><strong>Track Count:</strong> ${window.releaseState.tracks.length}</p>
        <p><strong>Territories:</strong> ${window.releaseState.territories.mode}</p>
        <p><strong>Audit Trail Status:</strong> Form validated. Pre-flight bundle generated.</p>
    `;
}

// Complete Assembly Submission Handler
window.handleFormSubmission = async function(e) {
    e.preventDefault();
    if (!window.releaseState.agreements.termsAccepted) {
        alert("You must accept the terms & rights confirmation before submitting.");
        return;
    }

    const btn = document.getElementById('submitReleaseBtn');
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing Assets to R2...`;

    try {
        // 1. Binaries -> R2 Direct Uploads
        if (window.releaseState.artwork.file) {
            window.releaseState.artwork.url = await uploadFileToR2(window.releaseState.artwork.file, 'artworks');
        }

        for (let i = 0; i < window.releaseState.tracks.length; i++) {
            if (window.releaseState.tracks[i].audioFile) {
                window.releaseState.tracks[i].audioUrl = await uploadFileToR2(window.releaseState.tracks[i].audioFile, 'audio');
            }
        }

        // 2. Transmit complete payload to Cloudflare Worker Gateway
        const token = await window.currentUser.getIdToken();
        const res = await fetch(`${WORKER_BASE_URL}/api/releases/submit`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                ...window.releaseState,
                userId: window.currentUser.uid,
                auditHistory: [{ action: 'SUBMITTED', timestamp: new Date().toISOString(), user: window.currentUser.email }]
            })
        });

        if (!res.ok) throw new Error('Worker rejected submission pipeline.');

        alert('Release successfully dispatched to Too Lost Distribution!');
        switchView('catalog');

    } catch (err) {
        console.error('Submission Error:', err);
        alert(`Error delivering release: ${err.message}`);
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Upload & Submit Release`;
    }
};
        function renderAnalyticsView() {
            return `<div class="max-w-7xl mx-auto"><h1 class="text-2xl font-bold text-white">Analytics & Earnings</h1><p class="text-xs text-gray-400 mt-2">Connect your Too Lost royalty reports via Worker API.</p></div>`;
        }

        function renderSettingsView() {
            return `<div class="max-w-4xl mx-auto"><h1 class="text-2xl font-bold text-white">Settings & Payouts</h1><p class="text-xs text-gray-400 mt-2">Configure Stripe payout settings and legal identity details.</p></div>`;
        }
    </script>
</body>
