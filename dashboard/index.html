        async function loadLiveCatalog() {
    try {
        // Retrieve logged-in user ID strictly
        const currentUid = window.currentUser ? (window.currentUser.uid || window.currentUser.id) : null;
        
        if (!currentUid) {
            window.releasesCatalog = [];
            renderCatalogContainer();
            return;
        }

        let serverReleases = [];

        // 1. Fetch live releases from Worker API
        try {
            const token = await window.currentUser.getIdToken();
            const workerUrl = window.WORKER_BASE_URL || WORKER_BASE_URL;
            const res = await fetch(`${workerUrl}/api/releases`, {
                method: 'GET',
                headers: { 
                    'Accept': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (res.ok) {
                const data = await res.json();
                const rawList = Array.isArray(data) ? data : (data.data || data.releases || []);
                
                // STRICT FILTER: Require item user ID to explicitly match currentUid
                serverReleases = rawList.filter(item => {
                    const itemUserId = item.submittedBy || item.userId || item.user_id || item.uid;
                    return String(itemUserId) === String(currentUid);
                });
            }
        } catch (fetchErr) {
            console.error("API Gateway fetch error:", fetchErr);
        }

        // 2. Fetch User-Scoped LocalStorage items (Isolated per UID)
        const userLocalStorageKey = `audiory_releases_${currentUid}`;
        const allLocalReleases = JSON.parse(localStorage.getItem(userLocalStorageKey) || localStorage.getItem('audiory_local_releases') || '[]');
        
        // STRICT FILTER: Match explicit user ID only
        const localReleases = allLocalReleases.filter(item => {
            const itemUserId = item.submittedBy || item.userId || item.user_id;
            return String(itemUserId) === String(currentUid);
        });

        // Helper to cleanly map cover artwork from Too Lost or custom schemas
        const resolveCoverUrl = (item) => {
            if (!item) return '';
            if (typeof item.artwork === 'string') return item.artwork;
            if (item.artwork && typeof item.artwork === 'object') {
                return item.artwork.url || item.artwork.cover_art || item.artwork.path || '';
            }
            return item.coverUrl 
                || item.compressedArtwork 
                || item.artworkUrl 
                || item.cover_url 
                || item.cover_art 
                || item.image 
                || '';
        };

        // 3. Merge Local + Server
        const releaseMap = new Map();

        // Process Server Releases First
        serverReleases.forEach(item => {
            const key = String(item.id || item.title);
            const serverCover = resolveCoverUrl(item);

            let cleanStatus = item.status || 'Submitted';
            if (cleanStatus.toLowerCase() === 'draft' || cleanStatus.toLowerCase().includes('gateway')) {
                cleanStatus = 'Submitted';
            }

            releaseMap.set(key, {
                ...item,
                submittedBy: currentUid,
                coverUrl: serverCover,
                status: cleanStatus
            });
        });

        // Overlay Local Storage Updates
        localReleases.forEach(item => {
            const key = String(item.id || item.title);
            const resolvedCover = resolveCoverUrl(item);
            const existing = releaseMap.get(key);

            let cleanStatus = item.status || 'Submitted';
            if (cleanStatus.toLowerCase() === 'draft' || cleanStatus.toLowerCase().includes('gateway')) {
                cleanStatus = 'Submitted';
            }

            releaseMap.set(key, {
                ...existing,
                ...item,
                submittedBy: currentUid,
                coverUrl: resolvedCover || (existing ? existing.coverUrl : ''),
                status: cleanStatus
            });
        });

        window.releasesCatalog = Array.from(releaseMap.values());

        // 4. Trigger UI Render
        renderCatalogContainer();

    } catch (err) {
        console.error("Error loading live catalog:", err);
    }
}

// Exact artist resolver matching renderCatalogView logic
function resolveArtistName(rel) {
    if (!rel) return 'Unknown Artist';

    if (Array.isArray(rel.participants) && rel.participants.length > 0) {
        return rel.participants
            .map(p => typeof p === 'string' ? p : p.name)
            .filter(Boolean)
            .join(', ');
    } 
    
    if (Array.isArray(rel.artists) && rel.artists.length > 0) {
        return rel.artists
            .map(a => typeof a === 'string' ? a : (a.name || ''))
            .filter(Boolean)
            .join(', ');
    } 
    
    if (rel.artist) {
        return typeof rel.artist === 'string' ? rel.artist : (rel.artist.name || 'Unknown Artist');
    }

    return 'Unknown Artist';
}

// Universal Helper: Matches resolveCoverUrl logic inside loadLiveCatalog
function resolveCoverUrl(item) {
    if (!item) return '';
    if (typeof item.artwork === 'string') return item.artwork;
    if (item.artwork && typeof item.artwork === 'object') {
        return item.artwork.url || item.artwork.cover_art || item.artwork.path || '';
    }
    return item.coverUrl 
        || item.compressedArtwork 
        || item.artworkUrl 
        || item.cover_url 
        || item.cover_art 
        || item.image 
        || '';
}
        
        // Direct Multipart Upload to Cloudflare Worker R2 Bucket
        async function uploadFileToR2(file, folder = 'audio') {
            const token = await window.currentUser.getIdToken();
            const formData = new FormData();
            formData.append('file', file);
            formData.append('folder', folder);

            const res = await fetch(`${WORKER_BASE_URL}/api/upload`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Worker upload failed with status ${res.status}: ${errText}`);
            }

            const data = await res.json();
            if (!data.success || !data.url) {
                throw new Error(`Upload failed: ${data.error || 'No public URL returned from Worker'}`);
            }

            return data.url;
        }

// Updated Dashboard Initialization Function
async function initHomeDashboard() {
    const catalogTbody = document.getElementById('home-recent-catalog-tbody');
    if (catalogTbody) {
        const catalog = window.releasesCatalog || [];
        if (catalog.length === 0) {
            catalogTbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-gray-500">No releases found. Click "New Release" to start.</td></tr>`;
        } else {
            catalogTbody.innerHTML = catalog.slice(0, 5).map(rel => {
                const title = rel.title || rel.metadata?.title || 'Untitled Release';
                const artistName = resolveArtistName(rel);

                // Exact cover resolver from renderCatalogView
                let rawCover = rel.coverUrl || rel.compressedArtwork || rel.artworkUrl || rel.cover_url;
                if (!rawCover && rel.artwork) {
                    rawCover = typeof rel.artwork === 'string' ? rel.artwork : (rel.artwork.url || rel.artwork.cover_art);
                }
                const coverArt = (typeof rawCover === 'string' && rawCover.trim() !== '') ? rawCover : '';

                // Normalize status
                let status = rel.status || 'Submitted';
                if (status.toLowerCase() === 'draft' || status.toLowerCase().includes('gateway')) {
                    status = 'Submitted';
                }

                return `
                    <tr class="border-b border-brand-border/50 hover:bg-white/5 transition-colors">
                        <td class="py-3 px-2">
                            <div class="flex items-center gap-3">
                                ${coverArt 
                                    ? `<img src="${coverArt}" class="w-10 h-10 rounded-lg object-cover border border-brand-border/60 shrink-0" alt="Cover" />`
                                    : `<div class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center shrink-0"><i class="fa-solid fa-music text-gray-400"></i></div>`
                                }
                                <span class="font-semibold text-white">${title}</span>
                            </div>
                        </td>
                        <td class="py-3 px-2 text-gray-300">${artistName}</td>
                        <td class="py-3 px-2 text-gray-400 font-mono">${rel.upc || 'Pending'}</td>
                        <td class="py-3 px-2 text-right">
                            <span class="px-2 py-0.5 text-[10px] font-medium rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 capitalize">${status}</span>
                        </td>
                    </tr>
                `;
            }).join('');
        }
    }

    // Fetch Overview Analytics
    try {
        if (!window.currentUser) return;
        const token = typeof window.currentUser.getIdToken === 'function' 
            ? await window.currentUser.getIdToken() 
            : window.currentUser.accessToken;

        if (!token) return;

        const workerUrl = window.WORKER_BASE_URL || 'https://audiorydistribution.dandredurkofficial.workers.dev';
        const res = await fetch(`${workerUrl}/api/analytics/overview?period=lastThirtyDays`, {
            headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
        });

        if (res.ok) {
            const json = await res.json();
            const data = json.data || json;

            const streamsEl = document.getElementById('home-stat-streams');
            const savesEl = document.getElementById('home-stat-saves');
            const engEl = document.getElementById('home-stat-engagement');

            if (streamsEl) streamsEl.innerText = Number(data.totalStreams || 0).toLocaleString();
            if (savesEl) savesEl.innerText = Number(data.totalSaves || 0).toLocaleString();
            if (engEl) engEl.innerText = data.engagement ? Number(data.engagement).toFixed(2) + '%' : 'N/A';

            renderHomeChart(data.chart || []);
        }
    } catch (err) {
        console.error("Home Dashboard API error:", err);
    }
}
        
function renderHomeChart(chartData) {
    const canvas = document.getElementById('homeOverviewChart');
    if (!canvas) return;

    if (homeChartInstance) {
        homeChartInstance.destroy();
    }

    const labels = chartData.map(p => p.date);
    const streams = chartData.map(p => p.totalStreams);

    const ctx = canvas.getContext('2d');
    homeChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Streams',
                data: streams,
                borderColor: '#06b6d4',
                backgroundColor: 'rgba(6, 182, 212, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.35,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#9ca3af', font: { size: 10 } } },
                y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#9ca3af', font: { size: 10 } } }
            }
        }
    });
}

// Notification UI Banner
function showNotification(message, type = 'error') {
    let container = document.getElementById('toast-container');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none';
        document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    const isError = type === 'error';
    toast.className = `pointer-events-auto flex items-center gap-3 p-4 rounded-xl border text-xs font-medium shadow-xl transition-all duration-300 opacity-0 translate-y-2 ${
        isError 
            ? 'bg-red-950/90 border-red-500/30 text-red-200' 
            : 'bg-emerald-950/90 border-emerald-500/30 text-emerald-200'
    }`;
    
    toast.innerHTML = `
        <i class="fa-solid ${isError ? 'fa-circle-exclamation text-red-400' : 'fa-circle-check text-emerald-400'} text-base shrink-0"></i>
        <span class="flex-1">${message}</span>
        <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    `;

    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-y-2'));

    setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
    }, 4000);
}

// Helper to safely retrieve token
function getAuthToken() {
    return window.currentUser?.token || localStorage.getItem('auth_token') || '';
}

// 1. Submit Request via API Endpoint
async function submitWithdrawal(e) {
    e.preventDefault();

    const token = getAuthToken();
    if (!token) {
        showNotification("Authentication token missing. Please log in again.", "error");
        return;
    }

    const amount = parseFloat(document.getElementById('withdrawAmount').value);
    const userBal = window.currentBalance || 0;

    if (amount > userBal) {
        showNotification("Requested amount exceeds current available balance.", "error");
        return;
    }

    const method = document.getElementById('payoutMethod').value;
    let detailString = '';
    if (method === 'mpesa') {
        detailString = `Phone: ${document.getElementById('field_mpesa_phone').value} (${document.getElementById('field_mpesa_name').value})`;
    } else if (method === 'bank') {
        detailString = `${document.getElementById('field_bank_name').value} - ${document.getElementById('field_bank_acc').value}`;
    } else if (method === 'payoneer') {
        detailString = `Email: ${document.getElementById('field_payoneer_email').value}`;
    } else if (method === 'tipalti') {
        detailString = `ID: ${document.getElementById('field_tipalti_id').value}`;
    }

    try {
        const response = await fetch(`${getWorkerBaseUrl()}/api/withdrawals`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                amount: amount,
                method: method,
                details: detailString
            })
        });

        const resData = await response.json();

        if (!response.ok) {
            throw new Error(resData.error || 'Failed to process request.');
        }

        closeWithdrawModal();
        await initEarningsDashboard();
        showNotification("Withdrawal request submitted successfully!", "success");

    } catch (err) {

// 3. Fetch Too Lost Sales Data
async function fetchTooLostEarnings() {
    try {
        const token = getAuthToken();
        if (!token) {
            return {
                totalBalance: 0,
                platformBreakdown: []
            };
        }

        const response = await fetch(
            `${getWorkerBaseUrl()}/api/toolost/sales/overview`,
            {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {
            console.error('Too Lost Sales Overview Error:', data);
            throw new Error(
                data?.message ||
                data?.error ||
                `Too Lost API returned ${response.status}`
            );
        }

        console.log('Too Lost Sales Overview:', data);

        return data;

    } catch (err) {
        console.error('Failed to fetch Too Lost sales:', err);

        return {
            totalBalance: 0,
            platformBreakdown: []
        };
    }

    if (tbody) {

                    : `<span class="px-2 py-0.5 text-[10px] font-medium rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20">Pending</span>`;

                        <td class="py-3 px-2 text-right">${statusBadge}</td>
                    </tr>
                `;

    }

    // Fetch Live Analytics Data

    const platformData = apiData.platformBreakdown || [];

    if (dspTbody) {

            `).join('');

    const totalRev = apiData.totalBalance !== undefined 
        ? apiData.totalBalance 
        : platformData.reduce((acc, curr) => acc + (Number(curr.revenue) || 0), 0);
        
    window.currentBalance = totalRev;

    const balEl = document.getElementById('earnings-total-balance');
    if (balEl) balEl.innerText = `$${totalRev.toFixed(2)}`;

    // Render Pie Chart
    const canvas = document.getElementById('platformEarningsPieChart');

    if (canvas) {
        const hasRevenueData = platformData.length > 0 && platformData.some(p => Number(p.revenue) > 0);

            const existingMsg = chartContainer?.querySelector('.empty-chart-msg');

// Catalog Actions - Edit Release
window.editReleaseCatalog = function(index) {
    const item = window.releasesCatalog[index];
    if (!item) return;

    // 1. Extract Artists/Participants reliably
    let extractedArtists = [];
    if (Array.isArray(item.participants) && item.participants.length > 0) {
        extractedArtists = item.participants.map(p => ({
            name: typeof p === 'string' ? p : (p.name || ''),
            role: Array.isArray(p.role) ? (p.role[0] || 'primary') : (p.role || 'primary')
        }));
    } else if (Array.isArray(item.artists) && item.artists.length > 0) {
        extractedArtists = item.artists.map(a => ({
            name: typeof a === 'string' ? a : (a.name || ''),
            role: Array.isArray(a.role) ? (a.role[0] || 'primary') : (a.role || 'primary')
        }));
    } else if (item.artist) {
        extractedArtists = [{
            name: typeof item.artist === 'string' ? item.artist : (item.artist.name || ''),
            role: 'primary'
        }];
    }

    if (extractedArtists.length === 0) {
        extractedArtists = [{ name: '', role: 'primary' }];
    }

    // 2. Extract Label cleanly
    const labelName = typeof item.label === 'object' 
        ? (item.label.name || item.label.label || '') 
        : (item.label || '');

    // 3. Set standard releaseState with editing tracking
    window.releaseState = {
        editingId: item.id || null, // Track ID to prevent creating duplicates
        metadata: {
            title: item.title || item.metadata?.title || '',
            type: item.type || item.metadata?.type || 'Single',
            language: item.language || item.metadata?.language || 'English',
            explicit: item.explicit || item.metadata?.explicit || false,
            primaryGenre: item.genre || item.primary_genre || item.metadata?.primaryGenre || item.genre_id || '',
            secondaryGenre: item.subgenre || item.secondary_genre || item.metadata?.secondaryGenre || ''
        },
        artists: extractedArtists,
        label: {
            name: labelName,
            cLine: item.cLine || item.c_line || item.label?.cLine || '',
            pLine: item.pLine || item.p_line || item.label?.pLine || ''
        },
        dates: {
            releaseDate: item.releaseDate || item.release_date || '',
            timezone: item.timezone || 'Africa/Nairobi'
        },
        dsps: item.dsps || (typeof MASTER_DSP_LIST !== 'undefined' ? MASTER_DSP_LIST.map(d => d.id) : []),
        artwork: {
            file: null,
            url: item.coverUrl || item.cover_url || item.compressedArtwork || item.cover_art || '',
            inspected: null
        },
        tracks: Array.isArray(item.tracks) && item.tracks.length > 0 
            ? item.tracks.map(t => ({
                metadata: {
                    title: t.title || t.metadata?.title || '',
                    version: t.version || t.metadata?.version || '',
                    genre: t.genre || t.metadata?.genre || '',
                    subgenre: t.subgenre || t.metadata?.subgenre || '',
                    explicit: t.explicit || t.metadata?.explicit || false
                },
                discNumber: t.discNumber || t.disc_number || 1,
                isrc: t.isrc || '',
                audioUrl: t.audio_url || t.audioUrl || '',
                tiktokStartTime: t.tiktok_start_time || t.tiktokStartTime || '00:30',
                lyrics: { plain: t.lyrics?.plain || t.lyrics || '' }
            }))
            : [{
                metadata: { title: item.title || '', explicit: false },
                discNumber: 1,
                isrc: '',
                audioUrl: '',
                tiktokStartTime: '00:30',
                lyrics: { plain: '' }
            }],
        agreements: { termsAccepted: true, rightsConfirmed: true }
    };

    // 4. Switch View & Render Step
    switchView('create');

    if (typeof window.renderStepContent === 'function') {
        window.renderStepContent(1);
    }

    // 5. Explicitly populate form fields from releaseState
    setTimeout(() => {
        populateFormFromState();
    }, 50);

    window.showToast('Release loaded for editing', false);
};

// Helper function to force form inputs to sync with window.releaseState
function populateFormFromState() {
    const state = window.releaseState;
    if (!state) return;

    // Title
    const titleInput = document.querySelector('input[name="title"]') || document.getElementById('release-title');
    if (titleInput) titleInput.value = state.metadata.title;

    // Type
    const typeSelect = document.querySelector('select[name="type"]') || document.getElementById('release-type');
    if (typeSelect) typeSelect.value = state.metadata.type;

    // Primary Genre
    const genreSelect = document.querySelector('select[name="primaryGenre"]') || document.getElementById('primary-genre');
    if (genreSelect && state.metadata.primaryGenre) genreSelect.value = state.metadata.primaryGenre;

    // Label
    const labelInput = document.querySelector('input[name="label"]') || document.getElementById('record-label');
    if (labelInput) labelInput.value = state.label.name;

    // Render / Sync Artist Inputs
    if (typeof window.renderArtistInputs === 'function') {
        window.renderArtistInputs();
    } else {
        const artistContainer = document.getElementById('artists-container') || document.querySelector('.artists-wrapper');
        if (artistContainer && state.artists.length > 0) {
            const firstArtistInput = artistContainer.querySelector('input');
            if (firstArtistInput) firstArtistInput.value = state.artists[0].name;
        }
    }
}

window.deleteReleaseCatalog = async function(releaseId) {
    try {
        const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
        
        const res = await fetch(`${WORKER_BASE_URL}/api/releases/${releaseId}`, { 
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (!res.ok) throw new Error('Failed to delete release on gateway');

        // Remove from memory
        window.releasesCatalog = (window.releasesCatalog || []).filter(r => String(r.id) !== String(releaseId));

        // Remove from Local Storage
        let localSavedReleases = JSON.parse(localStorage.getItem('audiory_local_releases') || '[]');
        localSavedReleases = localSavedReleases.filter(r => String(r.id) !== String(releaseId));
        localStorage.setItem('audiory_local_releases', JSON.stringify(localSavedReleases));

        window.showToast('Release deleted successfully', false);

        if (typeof window.loadLiveCatalog === 'function') {
            await window.loadLiveCatalog();
        } else {
            const container = document.getElementById('mainViewport');
            if (container && typeof renderCatalogView === 'function') {
                container.innerHTML = renderCatalogView();
            }
        }
    } catch (err) {
        console.error('Delete error:', err);

        // Fallback: Remove locally from storage and state if API route fails
        window.releasesCatalog = (window.releasesCatalog || []).filter(r => String(r.id) !== String(releaseId));
        let localSavedReleases = JSON.parse(localStorage.getItem('audiory_local_releases') || '[]');
        localSavedReleases = localSavedReleases.filter(r => String(r.id) !== String(releaseId));
        localStorage.setItem('audiory_local_releases', JSON.stringify(localSavedReleases));

        const container = document.getElementById('mainViewport');
        if (container && typeof renderCatalogView === 'function') {
            container.innerHTML = renderCatalogView();
        }
        window.showToast('Release removed from catalog', false);
    }
};

async function initAnalyticsDashboard(period = 'lastThirtyDays') {
    const kpiContainer = document.getElementById('analytics-kpi-container');
    const tbody = document.getElementById('analytics-tracks-tbody');

    try {
        currentAnalyticsPeriod = period;

        // Sync dropdown value & listener
        const periodSelect = document.getElementById('analytics-period-select');
        if (periodSelect) {
            periodSelect.value = period;
            if (!periodSelect.dataset.listenerAttached) {
                periodSelect.dataset.listenerAttached = "true";
                periodSelect.addEventListener('change', (e) => initAnalyticsDashboard(e.target.value));
            }
        }

        // Verify user authentication
        if (!window.currentUser) {
            console.warn("Analytics: window.currentUser is missing.");
            if (tbody) tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-rose-400">Authentication required. Please sign in again.</td></tr>`;
            renderKPIs({ totalStreams: 0, totalSaves: 0, totalSkips: 0, engagement: 0 });
            return;
        }

        // Retrieve Authorization Token
        let token = "";
        if (typeof window.currentUser.getIdToken === 'function') {
            token = await window.currentUser.getIdToken(true); // Force refresh
        } else if (window.currentUser.accessToken) {
            token = window.currentUser.accessToken;
        }

        if (!token) {
            throw new Error("Missing authentication token");
        }

        const workerUrl = window.WORKER_BASE_URL || 'https://audiorydistribution.dandredurkofficial.workers.dev';

        // Fetch Analytics Data
        const [overviewRes, tracksRes] = await Promise.all([
            fetch(`${workerUrl}/api/analytics/overview?period=${period}`, {
                method: 'GET',
                headers: { 
                    'Authorization': `Bearer ${token}`, 
                    'Content-Type': 'application/json' 
                }
            }),
            fetch(`${workerUrl}/api/analytics/tracks?period=${period}&page=1&perPage=10`, {
                method: 'GET',
                headers: { 
                    'Authorization': `Bearer ${token}`, 
                    'Content-Type': 'application/json' 
                }
            })
        ]);

        // Process Overview Data
        if (overviewRes.ok) {
            const overviewJson = await overviewRes.json();
            renderKPIs(overviewJson.data || overviewJson);
            renderChart((overviewJson.data || overviewJson).chart || []);
        } else {
            console.error(`Overview API failed: ${overviewRes.status}`);
            renderKPIs({ totalStreams: 0, totalSaves: 0, totalSkips: 0, engagement: 0 });
        }

        // Process Track Data
        if (tracksRes.ok) {
            const tracksJson = await tracksRes.json();
            renderTracksTable(tracksJson.data || []);
        } else {
            console.error(`Tracks API failed: ${tracksRes.status}`);
            if (tbody) tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-rose-400">Unauthorized (401): Check Worker auth middleware.</td></tr>`;
        }

    } catch (err) {
        console.error("Analytics Dashboard error:", err);
        if (tbody) tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-rose-400">Failed to authenticate API request.</td></tr>`;
        renderKPIs({ totalStreams: 0, totalSaves: 0, totalSkips: 0, engagement: 0 });
    }
}

function renderChart(chartData) {
    const canvas = document.getElementById('analyticsOverviewChart');
    if (!canvas) return;

    if (analyticsChartInstance) {
        analyticsChartInstance.destroy();
    }

    const labels = chartData.map(point => point.date);
    const streams = chartData.map(point => point.totalStreams);

    const ctx = canvas.getContext('2d');
    analyticsChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Streams',
                data: streams,
                borderColor: '#6366f1',
                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.35,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: {
                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                    ticks: { color: '#9ca3af', font: { size: 10 } }
                },
                y: {
                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                    ticks: { color: '#9ca3af', font: { size: 10 } }
                }
            }
        }
    });
}

        async function inspectImageFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = (e) => {
                    const arr = (new Uint8Array(e.target.result)).subarray(0, 4);
                    let header = "";
                    for (let i = 0; i < arr.length; i++) header += arr[i].toString(16);
                    
                    let mime = "unknown";
                    if (header.startsWith("89504e47")) mime = "image/png";
                    else if (header.startsWith("ffd8ff")) mime = "image/jpeg";

                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    img.onload = () => {
                        resolve({
                            filename: file.name,
                            mime: mime,
                            width: img.width,
                            height: img.height,
                            fileSize: `${(file.size / (1024 * 1024)).toFixed(2)} MB`,
                            valid: (mime !== "unknown" && img.width >= 3000 && img.height >= 3000)
                        });
                    };
                };
                reader.readAsArrayBuffer(file.slice(0, 4));
            });
        }

        // STEP 4 CONTENT & TRACK HANDLERS
        function renderStep4Content() {
            const isMultiTrack = window.releaseState.metadata.type === 'EP' || window.releaseState.metadata.type === 'Album';

            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-bold text-white">Tracks Management</h2>
                            <p class="text-xs text-gray-400">Total Tracks: ${window.releaseState.tracks.length}</p>
                        </div>
                        ${isMultiTrack ? `
                            <button type="button" onclick="addTrackToRelease()" class="px-3 py-1.5 rounded-lg bg-brand-accent text-brand-dark font-bold text-xs hover:opacity-90 transition">
                                <i class="fa-solid fa-plus mr-1"></i> Add Another Track
                            </button>
                        ` : ''}
                    </div>

                    <div class="space-y-6">
                        ${window.releaseState.tracks.map((track, idx) => `
                            <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-4 relative">
                                <div class="flex items-center justify-between border-b border-brand-border pb-3">
                                    <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Track ${idx + 1} of ${window.releaseState.tracks.length}</span>
                                    ${window.releaseState.tracks.length > 1 ? `
                                        <button type="button" onclick="removeTrackFromRelease(${idx})" class="text-xs text-red-400 hover:text-red-300">
                                            <i class="fa-solid fa-trash mr-1"></i> Remove
                                        </button>
                                    ` : ''}
                                </div>

                                <!-- Track Title, Version, Disc, ISRC -->
                                <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                                    <div class="sm:col-span-2">
                                        <label class="too-lost-form-label">Track Title *</label>
                                        <input type="text" required value="${track.metadata?.title || ''}" 
                                               oninput="window.releaseState.tracks[${idx}].metadata.title = this.value" 
                                               class="too-lost-input" placeholder="Track Title">
                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">Version / Subtitle</label>
                                        <input type="text" value="${track.metadata?.version || ''}" 
                                               oninput="window.releaseState.tracks[${idx}].metadata.version = this.value" 
                                               class="too-lost-input" placeholder="e.g. Extended Mix / Radio Edit">
                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">Disc Number</label>
                                        <input type="number" min="1" value="${track.discNumber || 1}" 
                                               onchange="window.releaseState.tracks[${idx}].discNumber = parseInt(this.value)" 
                                               class="too-lost-input">
                                    </div>
                                </div>

                                <!-- Explicit Status, Genres -->
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div>
                                        <label class="too-lost-form-label">Explicit Status *</label>
                                        <select onchange="window.releaseState.tracks[${idx}].metadata.explicit = (this.value === 'true')" class="too-lost-input">
                                            <option value="false" ${!track.metadata?.explicit ? 'selected' : ''}>Clean / Non-Explicit</option>
                                            <option value="true" ${track.metadata?.explicit ? 'selected' : ''}>Explicit</option>

                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">Track Genre *</label>
                                        <select onchange="handleTrackGenreChange(${idx}, this.value)" class="too-lost-input">
                                            <option value="">Select Genre</option>

                                            `).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">Track Subgenre *</label>
                                        <select id="track_subgenre_${idx}" onchange="window.releaseState.tracks[${idx}].metadata.subgenre = this.value" 
                                                class="too-lost-input" ${!track.metadata?.genre ? 'disabled' : ''}>
                                            <option value="">${track.metadata?.genre ? 'Select Subgenre' : '-- Select Genre First --'}</option>
                                            ${track.metadata?.genre && GENRE_MAP[track.metadata.genre] 
                                                ? GENRE_MAP[track.metadata.genre].map(sub => `
                                                    <option value="${sub}" ${track.metadata?.subgenre === sub ? 'selected' : ''}>${sub}</option>
                                                  `).join('') 
                                                : ''}
                                        </select>
                                    </div>
                                </div>

                                <!-- Audio Upload & Audio Preview -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="too-lost-form-label">Audio File (WAV/FLAC) *</label>
                                        <input type="file" accept="audio/wav,audio/flac" 
                                               onchange="handleAudioPreview(${idx}, this)" 
                                               class="too-lost-input text-xs">
                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">Audio Preview</label>
                                        <div id="audio_preview_container_${idx}" class="flex items-center h-10 px-3 rounded-xl bg-brand-dark border border-brand-border">
                                            ${track.previewUrl || track.audioUrl ? `
                                                <audio controls class="w-full h-8">
                                                    <source src="${track.previewUrl || track.audioUrl}" type="audio/mpeg">
                                                    Your browser does not support audio playback.
                                                </audio>
                                            ` : '<span class="text-xs text-gray-500">No audio uploaded yet</span>'}
                                        </div>
                                    </div>
                                </div>

                                <!-- ISRC & TikTok Start Time -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="too-lost-form-label">ISRC (Optional - Leave blank to auto-generate)</label>
                                        <input type="text" value="${track.isrc || ''}" 
                                               oninput="window.releaseState.tracks[${idx}].isrc = this.value" 
                                               class="too-lost-input" placeholder="e.g. USABC1234567">
                                    </div>
                                    <div>
                                        <label class="too-lost-form-label">TikTok Clip Start Time (MM:SS)</label>
                                        <input type="text" value="${track.tiktokStartTime || '00:30'}" 
                                               oninput="window.releaseState.tracks[${idx}].tiktokStartTime = this.value" 
                                               class="too-lost-input" placeholder="00:30">
                                    </div>
                                </div>

                                <!-- Lyrics -->
                                <div>
                                    <label class="too-lost-form-label">Plain Lyrics</label>
                                    <textarea oninput="window.releaseState.tracks[${idx}].lyrics = { plain: this.value }" 
                                              class="too-lost-input h-20" placeholder="Type plain text lyrics here...">${track.lyrics?.plain || ''}</textarea>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.handleTrackGenreChange = function(idx, genre) {
            window.releaseState.tracks[idx].metadata.genre = genre;
            window.releaseState.tracks[idx].metadata.subgenre = '';
            
            const subSelect = document.getElementById(`track_subgenre_${idx}`);
            if (!subSelect) return;

            if (genre && GENRE_MAP[genre]) {
                subSelect.disabled = false;
                subSelect.innerHTML = `<option value="">Select Subgenre</option>` + 
                    GENRE_MAP[genre].map(sub => `<option value="${sub}">${sub}</option>`).join('');
            } else {
                subSelect.disabled = true;
                subSelect.innerHTML = `<option value="">-- Select Genre First --</option>`;
            }
        };

        // Audio Preview Handler
        window.handleAudioPreview = function(trackIndex, inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            window.releaseState.tracks[trackIndex].audioFile = file;
            const previewUrl = URL.createObjectURL(file);
            window.releaseState.tracks[trackIndex].previewUrl = previewUrl;

            const container = document.getElementById(`audio_preview_container_${trackIndex}`);
            if (container) {
                container.innerHTML = `
                    <audio controls class="w-full h-8">
                        <source src="${previewUrl}" type="${file.type}">
                        Your browser does not support audio playback.
                    </audio>
                `;
            }
        };

        // Add Track for EP/Album
        window.addTrackToRelease = function() {
            window.releaseState.tracks.push({
                metadata: { title: '', version: '', genre: window.releaseState.metadata.primaryGenre || '', subgenre: window.releaseState.metadata.secondaryGenre || '', explicit: false },
                discNumber: 1,
                isrc: '',
                audioFile: null,
                previewUrl: '',
                tiktokStartTime: '00:30',
                lyrics: { plain: '' }
            });
            const container = document.getElementById('wizardStepContainer');
            if (container && window.currentStep === 4) container.innerHTML = renderStep4Content();
        };

        // Remove Track
        window.removeTrackFromRelease = function(index) {
            if (window.releaseState.tracks.length <= 1) return;
            window.releaseState.tracks.splice(index, 1);
            const container = document.getElementById('wizardStepContainer');
            if (container && window.currentStep === 4) container.innerHTML = renderStep4Content();
        };

        // Automatic track count adjustments when Release Type changes in Step 1
        window.adjustTracksForReleaseType = function() {
            const type = window.releaseState.metadata.type;
            if (type === 'Single') {
                window.releaseState.tracks = [window.releaseState.tracks[0] || {
                    metadata: { title: window.releaseState.metadata.title || '', explicit: false },
                    discNumber: 1
                }];
            }
        };

        // STEP 5 CONTENT
        function renderStep5Content() {
            return `
                <div class="space-y-4">
                    <div class="p-5 rounded-2xl bg-brand-dark border border-brand-border space-y-4 text-xs text-gray-300">
                        <h3 class="font-bold text-white text-sm">Legal & Copyright Affirmation</h3>
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" ${window.releaseState.agreements.termsAccepted ? 'checked' : ''} onchange="window.releaseState.agreements.termsAccepted = this.checked" class="mt-0.5 rounded border-brand-border">
                            <span>I certify that I am authorized to grant distribution rights for all masters, lyrics, and metadata supplied in this submission package.</span>
                        </label>
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" ${window.releaseState.agreements.rightsConfirmed ? 'checked' : ''} onchange="window.releaseState.agreements.rightsConfirmed = this.checked" class="mt-0.5 rounded border-brand-border">
                            <span>I confirm all underlying samples, interpolations, and performances are fully cleared for commercial distribution worldwide.</span>
                        </label>
                    </div>
                </div>
            `;
        }

        // STEP 6 CONTENT
function renderStep6Content() {
    const s = window.releaseState;
    return `
        <div class="space-y-4">
            <!-- Summary Card -->
            <div class="p-6 rounded-2xl bg-brand-dark border border-brand-border space-y-4 text-xs font-mono text-gray-300">
                <h3 class="text-sm font-bold text-white">Release Submission Summary</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-b border-brand-border pb-4">
                    <div>
                        <p><strong class="text-gray-400">Title:</strong> ${s.metadata.title || 'Untitled'}</p>
                        <p><strong class="text-gray-400">Type:</strong> ${s.metadata.type}</p>
                        <p><strong class="text-gray-400">Primary Genre:</strong> ${s.metadata.primaryGenre || 'N/A'}</p>
                        <p><strong class="text-gray-400">Subgenre:</strong> ${s.metadata.secondaryGenre || 'N/A'}</p>
                    </div>
                    <div>
                        <p><strong class="text-gray-400">Artists:</strong> ${s.artists.map(a => a.name).filter(Boolean).join(', ') || 'None'}</p>
                        <p><strong class="text-gray-400">Release Date:</strong> ${s.dates.releaseDate || 'Immediate'}</p>
                        <p><strong class="text-gray-400">Selected Stores:</strong> ${s.dsps.length} Platforms</p>
                        <p><strong class="text-gray-400">Total Tracks:</strong> ${s.tracks.length}</p>
                    </div>
                </div>
                <div class="text-[11px] text-cyan-400">
                    ✓ All required fields compiled.
                </div>
            </div>

            <!-- Submission Progress Card (Hidden until submit is clicked) -->
            <div id="submission-progress-card" class="hidden p-5 rounded-2xl bg-brand-dark border border-brand-border space-y-3">
                <div class="flex items-center justify-between text-xs font-semibold">
                    <span id="progress-status-text" class="text-cyan-400 flex items-center gap-2">
                        <i class="fa-solid fa-spinner animate-spin"></i> Preparing upload...
                    </span>
                    <span id="progress-percentage" class="text-gray-400 font-mono">0%</span>
                </div>
                
                <!-- Progress Bar Track -->
                <div class="w-full h-2.5 bg-brand-card rounded-full overflow-hidden border border-brand-border/40">
                    <!-- Progress Bar Fill -->
                    <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-300 rounded-full" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    `;
}

window.handleFormSubmission = async function(event) {
    if (event) event.preventDefault();

    if (!window.releaseState.agreements?.termsAccepted) {
        return window.showToast('Please confirm rights affirmation in Step 5 before submitting.');
    }

    const hasArtworkFile = Boolean(window.releaseState.artwork?.file);
    const existingArtworkUrl = window.releaseState.artwork?.url || '';
    
    if (!hasArtworkFile && !existingArtworkUrl) {
        return window.showToast('Please upload cover artwork before submitting.');
    }

    const submitBtn = document.getElementById('submit-release-btn') || document.querySelector('button[type="submit"]');
    const progressCard = document.getElementById('submission-progress-card');
    const statusText = document.getElementById('progress-status-text');
    const percentageText = document.getElementById('progress-percentage');
    const progressFill = document.getElementById('progress-bar-fill');

    const updateProgress = (percent, message) => {
        if (progressFill) progressFill.style.width = `${percent}%`;
        if (percentageText) percentageText.innerText = `${Math.round(percent)}%`;
        if (statusText) statusText.innerText = message;
    };

    let originalBtnHTML = '';
    if (submitBtn) {
        originalBtnHTML = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.style.opacity = '0.7';
        submitBtn.innerHTML = `
            <span style="display: inline-flex; align-items: center; gap: 8px;">
                <svg style="animation: spin 1s linear infinite; width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"></circle>
                </svg>
                Submitting...
            </span>
        `;
    }

    if (progressCard) progressCard.style.display = 'block';
    updateProgress(5, 'Initializing submission pipeline...');

    try {
        const totalTracks = window.releaseState.tracks?.length || 0;
        const totalUploadSteps = (hasArtworkFile ? 1 : 0) + totalTracks;
        let completedSteps = 0;

        // 1. Upload Cover Artwork
        let finalCoverUrl = existingArtworkUrl;
        if (hasArtworkFile) {
            updateProgress(10, 'Uploading Cover Artwork...');
            const uploadRes = await uploadFileToR2(window.releaseState.artwork.file, 'artwork');
            finalCoverUrl = typeof uploadRes === 'string' 
                ? uploadRes 
                : (uploadRes?.url || uploadRes?.location || uploadRes?.path || '');

            if (!finalCoverUrl) throw new Error('Artwork upload succeeded but returned an invalid URL.');

            window.releaseState.artwork.url = finalCoverUrl;
            completedSteps++;
            const stepPercent = 10 + Math.floor((completedSteps / (totalUploadSteps || 1)) * 60);
            updateProgress(stepPercent, 'Cover Artwork uploaded successfully!');
        } else {
            updateProgress(20, 'Using existing artwork...');
        }

        // 2. Upload Audio Master Tracks
        for (let i = 0; i < totalTracks; i++) {
            const track = window.releaseState.tracks[i];
            if (track.audioFile) {
                updateProgress(
                    20 + Math.floor((completedSteps / (totalUploadSteps || 1)) * 60), 
                    `Uploading Track ${i + 1} of ${totalTracks}: "${track.metadata?.title || 'Master Audio'}"...`
                );
                const trackRes = await uploadFileToR2(track.audioFile, 'audio');
                const trackUrl = typeof trackRes === 'string' ? trackRes : (trackRes?.url || trackRes?.location || '');
                window.releaseState.tracks[i].audioUrl = trackUrl;
            }
            completedSteps++;
        }

        updateProgress(80, 'Formatting release metadata & participant roles...');

        const labelNameInput = typeof window.releaseState.label === 'object' 
            ? (window.releaseState.label.name || window.releaseState.label.label) 
            : window.releaseState.label;

        const labelString = (labelNameInput && labelNameInput.trim()) ? labelNameInput.trim() : 'Independent';

        const ALLOWED_ROLES = ['primary', 'featuring', 'remixer'];
        const mappedParticipants = (window.releaseState.artists || [])
            .map(artist => {
                let rawRoles = Array.isArray(artist.role) ? artist.role : [artist.role || 'primary'];
                const cleanedRoles = rawRoles.map(r => {
                    const norm = String(r).toLowerCase().trim();
                    if (norm.includes('feat')) return 'featuring';
                    if (norm.includes('remix')) return 'remixer';
                    if (ALLOWED_ROLES.includes(norm)) return norm;
                    return 'primary';
                });

                const artistName = typeof artist === 'string' ? artist : (artist.name || artist.artist_name || '');
                return {
                    name: artistName.trim(),
                    role: Array.from(new Set(cleanedRoles)),
                    spotify_id: artist.spotify_id || '',
                    apple_id: artist.apple_id || ''
                };
            })
            .filter(p => p.name !== '');

        if (mappedParticipants.length === 0) {
            throw new Error('Please specify at least one Primary Artist name.');
        }

        const editingId = window.releaseState.editingId;
        const isEditing = Boolean(editingId);

        const payload = {
            title: window.releaseState.metadata.title,
            type: window.releaseState.metadata.type,
            language: window.releaseState.metadata.language,
            genre: window.releaseState.metadata.primaryGenre,
            subgenre: window.releaseState.metadata.secondaryGenre,
            label: labelString,
            participants: mappedParticipants,
            artists: mappedParticipants,
            releaseDate: window.releaseState.dates.releaseDate,
            timezone: window.releaseState.dates.timezone,
            dsps: window.releaseState.dsps,
            coverUrl: finalCoverUrl,
            cover_url: finalCoverUrl,
            cover_art: finalCoverUrl,
            artwork: finalCoverUrl,
            tracks: window.releaseState.tracks.map(t => ({
                title: t.metadata.title,
                version: t.metadata.version,
                explicit: t.metadata.explicit,
                isrc: t.isrc,
                audio_url: t.audioUrl,
                tiktok_start_time: t.tiktokStartTime,
                lyrics: t.lyrics?.plain
            })),
            submittedBy: window.currentUser ? window.currentUser.uid : 'anonymous',
            createdAt: new Date().toISOString()
        };

        if (isEditing) {
            payload.id = editingId;
            payload.releaseId = editingId;
            payload.isUpdate = true;
        }

        updateProgress(90, 'Dispatching metadata to Gateway...');

        const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
        const endpoint = `${WORKER_BASE_URL}/api/releases`;

        const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
        });

        const serverResponse = await res.json().catch(() => null);

        if (!res.ok) {
            const errorMsg = serverResponse?.message || serverResponse?.error || `Failed to ${isEditing ? 'update' : 'create'} release on server API`;
            throw new Error(errorMsg);
        }

        updateProgress(100, `Release successfully ${isEditing ? 'updated' : 'submitted'}! Redirecting...`);

        const currentUid = window.currentUser ? window.currentUser.uid : 'anonymous';
        let validStatus = 'Submitted';
        if (serverResponse?.status && !serverResponse.status.includes('Gateway') && !serverResponse.status.includes('Online')) {
            validStatus = serverResponse.status;
        }

        // PRESERVE EXISTING ID ON EDITING
        const finalId = isEditing ? editingId : (serverResponse?.id || serverResponse?.data?.id || Date.now());

        const newReleaseItem = {
            id: finalId,
            title: payload.title,
            type: payload.type,
            status: validStatus,
            coverUrl: finalCoverUrl,
            compressedArtwork: finalCoverUrl,
            participants: mappedParticipants,
            upc: serverResponse?.upc || serverResponse?.data?.upc || 'Pending',
            submittedBy: currentUid
        };

        // Scope storage key dynamically to current user ID
        const userLocalStorageKey = `audiory_releases_${currentUid}`;

        // Retrieve user-scoped local releases
        let localSavedReleases = JSON.parse(
            localStorage.getItem(userLocalStorageKey) || 
            localStorage.getItem('audiory_local_releases') || 
            '[]'
        );

        if (isEditing) {
            const index = localSavedReleases.findIndex(item => String(item.id) === String(editingId));
            if (index !== -1) {
                localSavedReleases[index] = { ...localSavedReleases[index], ...newReleaseItem };
            } else {
                localSavedReleases.unshift(newReleaseItem);
            }
        } else {
            localSavedReleases.unshift(newReleaseItem);
        }

        // Save back to the user-scoped localStorage key
        localStorage.setItem(userLocalStorageKey, JSON.stringify(localSavedReleases));
        
        // Update global window state in place
        if (!Array.isArray(window.releasesCatalog)) window.releasesCatalog = [];
        if (isEditing) {
            const catIndex = window.releasesCatalog.findIndex(item => String(item.id) === String(editingId));
            if (catIndex !== -1) {
                window.releasesCatalog[catIndex] = { ...window.releasesCatalog[catIndex], ...newReleaseItem };
            } else {
                window.releasesCatalog.unshift(newReleaseItem);
            }
        } else {
            window.releasesCatalog.unshift(newReleaseItem);
        }

        window.releaseState.editingId = null;

        setTimeout(() => {
            if (typeof window.loadLiveCatalog === 'function') window.loadLiveCatalog();
            if (typeof window.renderDashboardHome === 'function') window.renderDashboardHome();
            if (typeof window.switchView === 'function') window.switchView('catalog');
            
            if (progressCard) progressCard.style.display = 'none';
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.style.cursor = 'pointer';
                submitBtn.style.opacity = '1';
                submitBtn.innerHTML = originalBtnHTML;
            }
        }, 1200);

    } catch (err) {
        console.error('Submission Error:', err);
        if (typeof window.showToast === 'function') {
            window.showToast(`Submission failed: ${err.message}`);
        } else {
            alert(`Submission failed: ${err.message}`);
        }
        
        if (progressCard) progressCard.style.display = 'none';
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.style.cursor = 'pointer';
            submitBtn.style.opacity = '1';
            submitBtn.innerHTML = originalBtnHTML;
        }
    }
};
        
    </script>
