// Login History Controller
async function loadLoginHistory() {
    const tbody = document.getElementById('settings-sessions-tbody');
    if (!tbody) return;

    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/login-history`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const sessions = response.ok ? await response.json() : [];

        if (!Array.isArray(sessions) || sessions.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-500">No recorded login sessions yet.</td></tr>`;
            return;
        }

        tbody.innerHTML = sessions.map(s => `
            <tr class="border-b border-brand-border/30 hover:bg-white/5 transition">
                <td class="py-3 px-2 font-medium text-white flex items-center gap-2">
                    <i class="fa-solid ${String(s.device || '').toLowerCase().includes('mobile') ? 'fa-mobile-screen' : 'fa-desktop'} text-gray-400"></i> ${escapeHtml(s.device || 'Unknown device')}
                </td>
                <td class="py-3 px-2 font-mono text-gray-400">${escapeHtml(s.ip || '—')}</td>
                <td class="py-3 px-2 text-gray-400">${escapeHtml(s.location || '—')}</td>
                <td class="py-3 px-2 text-gray-400">${formatDateTime(s.lastActiveAt || s.lastActive || s.loginAt)}</td>
                <td class="py-3 px-2 text-right">
                    ${s.isCurrent ? `<span class="px-2 py-0.5 text-[10px] rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono">Current Session</span>` : `<button onclick="revokeSession('${escapeHtml(s.id)}')" class="text-gray-500 hover:text-red-400 text-xs transition"><i class="fa-solid fa-right-from-bracket"></i> Revoke</button>`}
                </td>
            </tr>
        `).join('');
    } catch {
        tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-500">Unable to load login history.</td></tr>`;
    }
}

async function revokeAllSessions() {
    const confirm = await showCustomConfirm("Terminate Other Sessions", "Are you sure you want to log out all other active devices?");
    if (!confirm) return;

    try {
        const token = await getAuthToken();
        await fetch(`${getWorkerBaseUrl()}/api/login-history/revoke-all`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        await loadLoginHistory();
        showToast("All other active sessions have been terminated.");
    } catch (err) {
        showToast(err.message, true);
    }
}

async function revokeSession(sessionId) {
    try {
        const token = await getAuthToken();
        await fetch(`${getWorkerBaseUrl()}/api/login-history/${sessionId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        await loadLoginHistory();
        showToast("Session revoked successfully.");
    } catch (err) {
        showToast(err.message, true);
    }
}

async function submitUserInvite(e) {
    e.preventDefault();
    const emailInput = document.getElementById('invite-user-email');
    if (!emailInput) return;
    const email = emailInput.value;
    
    const selectedRoles = [];
    if (document.getElementById('role-content')?.checked) selectedRoles.push('Content');
    if (document.getElementById('role-royalties')?.checked) selectedRoles.push('Royalties');
    if (document.getElementById('role-analytics')?.checked) selectedRoles.push('Analytics');
    if (document.getElementById('role-splitshare')?.checked) selectedRoles.push('SplitShare');
    if (document.getElementById('role-admin')?.checked) selectedRoles.push('Admin');

    if (selectedRoles.length === 0) {
        showToast("Please select at least one role.", true);
        return;
    }

    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/members/invite`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, roles: selectedRoles })
        });

        if (!response.ok) throw new Error('Failed to send invitation');

        closeInviteUserModal();
        await loadAccountMembers();
        showToast(`Invite sent to ${email}!`);
    } catch (err) {
        showToast(err.message, true);
    }
}

async function loadAccountMembers() {
    const tbody = document.getElementById('settings-members-tbody');
    if (!tbody) return;

    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/members`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        const members = response.ok ? await response.json() : [];

        if (!members || members.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-gray-500">No team members added yet.</td></tr>`;
            return;
        }

        tbody.innerHTML = members.map(m => `
            <tr class="border-b border-brand-border/50 hover:bg-white/5 transition">
                <td class="py-3 px-2 font-semibold text-white">${m.email}</td>
                <td class="py-3 px-2">
                    <div class="flex flex-wrap gap-1">
                        ${(m.roles || []).map(r => `<span class="px-2 py-0.5 text-[10px] rounded-md bg-white/10 text-gray-300 font-mono">${r}</span>`).join('')}
                    </div>
                </td>
                <td class="py-3 px-2">
                    <span class="px-2 py-0.5 text-[10px] rounded-md ${m.status === 'active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">
                        ${m.status || 'Pending'}
                    </span>
                </td>
                <td class="py-3 px-2 text-right">
                    <button type="button" onclick="removeMember('${m.id}')" class="text-gray-500 hover:text-red-400 transition"><i class="fa-solid fa-trash text-xs"></i></button>
                </td>
            </tr>
        `).join('');
    } catch {
        tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-gray-500">No team members added yet.</td></tr>`;
    }
}

async function removeMember(memberId) {
    const confirmed = await showCustomConfirm("Revoke Access", "Are you sure you want to revoke access for this team member?");
    if (!confirmed) return;

    try {
        const token = await getAuthToken();
        const response = await fetch(`${getWorkerBaseUrl()}/api/members/${memberId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error("Failed to remove team member.");

        await loadAccountMembers();
        showToast("Member access revoked.");
    } catch (err) {
        showToast(err.message, true);
    }
}

window.initUpgradePage = async function() {
    await window.fetchSubscriptionAndHistory();

window.fetchSubscriptionAndHistory = async function() {
    const btnCheck = document.getElementById('btn-check-payment-status');
    const iconCheck = document.getElementById('check-status-icon');
    const textCheck = document.getElementById('check-status-text');

    // Set Loading State for "Check Payment Status"
    if (btnCheck) btnCheck.disabled = true;
    if (iconCheck) iconCheck.className = 'fa-solid fa-spinner fa-spin';
    if (textCheck) textCheck.innerText = 'Checking payment status...';

    const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
    const baseUrl = window.WORKER_BASE_URL || '';

    try {
        const res = await fetch(`${baseUrl}/api/billing-history`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!res.ok) throw new Error('Failed to fetch subscription data');

        const data = await res.json();
        const sub = data.subscription;
        const history = data.history || [];

        // STRICT VERIFICATION: Verify if subscription status is truly Active
        const isVerifiedActive = sub?.status === 'Active';
        const activePlanId = isVerifiedActive ? (sub?.planId || 'starter') : 'starter';

        // Evaluate transaction statuses
        const hasPendingInvoice = history.some(item => item.status === 'Pending');
        const latestTx = history[0];
        const isLatestFailed = latestTx && (latestTx.status === 'Failed' || latestTx.status === 'Cancelled' || latestTx.status === 'Declined');

        // Extract planId from description or current sub target if available
        if (latestTx) {
            if (latestTx.planId) {
                window.lastAttemptedPlanId = latestTx.planId;
            } else if (sub && sub.planId && sub.status === 'Failed') {
                window.lastAttemptedPlanId = sub.planId;
            }
        }

        // Update Top Active Plan Card
        const planNameEl = document.getElementById('active-plan-name');
        const planStatusEl = document.getElementById('active-plan-status');
        const planBadgeEl = document.getElementById('active-plan-badge');

        if (planNameEl) planNameEl.innerText = sub?.planName || 'Starter Plan';
        if (planStatusEl) planStatusEl.innerText = `Verified Status: ${sub?.status || 'Active'}`;
        if (planBadgeEl) {
            planBadgeEl.innerText = sub?.status || 'Active';
            planBadgeEl.className = isVerifiedActive
                ? 'px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                : 'px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20';
        }

        // Handle Pending / Failed Transaction Banner State
        const pendingBanner = document.getElementById('pending-transaction-banner');
        const bannerIcon = document.getElementById('pending-banner-icon');
        const bannerTitle = document.getElementById('pending-banner-title');
        const bannerDesc = document.getElementById('pending-banner-desc');

        if (pendingBanner) {
            if (hasPendingInvoice) {
                pendingBanner.className = 'bg-amber-500/10 border border-amber-500/30 rounded-2xl p-4 flex items-center justify-between gap-4 transition-all';
                if (bannerIcon) bannerIcon.className = 'fa-solid fa-clock text-amber-400 text-lg';
                if (bannerTitle) {
                    bannerTitle.innerText = 'Payment Pending Confirmation';
                    bannerTitle.className = 'text-xs font-bold text-amber-300';
                }
                if (bannerDesc) bannerDesc.innerText = 'An M-Pesa push was sent to your phone. Enter your PIN to activate your tier.';
                
                if (iconCheck) iconCheck.className = 'fa-solid fa-rotate-right';
                if (textCheck) textCheck.innerText = 'Check Payment Status';
                if (btnCheck) {
                    btnCheck.onclick = function() { window.fetchSubscriptionAndHistory(); };
                    btnCheck.className = 'px-3 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5';
                }
                pendingBanner.classList.remove('hidden');
            } else if (isLatestFailed && !isVerifiedActive) {
                pendingBanner.className = 'bg-red-500/10 border border-red-500/30 rounded-2xl p-4 flex items-center justify-between gap-4 transition-all';
                if (bannerIcon) bannerIcon.className = 'fa-solid fa-circle-xmark text-red-400 text-lg';
                if (bannerTitle) {
                    bannerTitle.innerText = 'Payment Failed';
                    bannerTitle.className = 'text-xs font-bold text-red-300';
                }
                if (bannerDesc) bannerDesc.innerText = 'Transaction was cancelled or declined. Please retry to upgrade.';
                
                if (iconCheck) iconCheck.className = 'fa-solid fa-rotate-right';
                if (textCheck) textCheck.innerText = 'Please retry to upgrade';
                if (btnCheck) {
                    btnCheck.onclick = function() { window.openCheckoutModal(window.lastAttemptedPlanId || 'pro'); };
                    btnCheck.className = 'px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-300 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5';
                }
                pendingBanner.classList.remove('hidden');
            } else {
                pendingBanner.classList.add('hidden');
            }
        }

        // Highlight Plan Selection Buttons based ONLY on active verified plan
        ['starter', 'pro', 'label'].forEach(planKey => {
            const btn = document.getElementById(`btn-plan-${planKey}`);
            if (btn) {
                if (planKey === activePlanId) {
                    btn.innerText = 'Current Plan';
                    btn.disabled = true;
                    btn.className = 'mt-6 w-full py-2.5 px-4 rounded-xl text-xs font-semibold bg-gray-800 text-gray-500 cursor-not-allowed';
                } else {
                    btn.disabled = false;
                    btn.innerText = (planKey === 'pro') ? 'Upgrade to Pro' : (planKey === 'label' ? 'Upgrade to Label' : 'Select Free Plan');
                    btn.className = (planKey === 'pro') 
                        ? 'mt-6 w-full py-2.5 px-4 rounded-xl text-xs font-semibold bg-brand-accent text-black hover:brightness-110 transition-all font-bold'
                        : 'mt-6 w-full py-2.5 px-4 rounded-xl text-xs font-semibold border border-brand-border text-gray-300 hover:text-white hover:bg-brand-border/40 transition-all';
                }
            }
        });

        // Render Billing History Table
        const tbody = document.getElementById('billing-history-tbody');
        if (tbody) {
            if (history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-gray-500">No payment records found.</td></tr>`;
            } else {
                tbody.innerHTML = history.map(item => `
                    <tr>
                        <td class="py-3 px-4 font-mono font-bold text-white">${item.invoiceId || 'N/A'}</td>
                        <td class="py-3 px-4">${item.date || '-'}</td>
                        <td class="py-3 px-4 capitalize">${item.description || 'Subscription Upgrade'}</td>
                        <td class="py-3 px-4 uppercase font-bold text-gray-400">${item.gateway || 'Card'}</td>
                        <td class="py-3 px-4 font-bold text-white">$${item.amount || '0.00'}</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                                item.status === 'Paid' 
                                    ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                                    : (item.status === 'Pending' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20')
                            }">
                                ${item.status}
                            </span>
                        </td>
                    </tr>
                `).join('');
            }
        }
    } catch (err) {
        console.error('Error fetching subscription history:', err);
    } finally {
        if (btnCheck) btnCheck.disabled = false;
        if (iconCheck && iconCheck.className.includes('fa-spinner')) {
            iconCheck.className = 'fa-solid fa-rotate-right';
        }
    }
};

window.handleUpgradeSubmit = async function(e) {
    e.preventDefault();

    const planId = document.getElementById('selected_plan_id')?.value;
    const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value || 'mpesa';
    const phone = document.getElementById('checkout_phone')?.value?.trim();

    const submitBtn = document.getElementById('btn-submit-upgrade');
    const msgEl = document.getElementById('checkout-status-msg');

    if (paymentMethod === 'mpesa' && (!phone || phone.length < 10)) {
        if (msgEl) {
            msgEl.innerText = 'Please provide a valid M-Pesa phone number (e.g. 2547XXXXXXXX).';
            msgEl.classList.remove('hidden');
        }
        return;
    }

    if (submitBtn) submitBtn.disabled = true;
    if (msgEl) {
        msgEl.innerText = 'Subscribing...';
        msgEl.classList.remove('hidden');
    }

    try {
        const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
        const baseUrl = window.WORKER_BASE_URL || '';

        const res = await fetch(`${baseUrl}/api/subscription/upgrade`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                planId: planId,
                paymentMethod: paymentMethod,
                phone: phone,
                email: window.currentUser?.email || '',
                displayName: window.currentUser?.displayName || 'Artist'
            })
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data?.error || 'Upgrade request failed');
        }

        // Redirects (PayPal/PesaPal)
        if (data.redirectUrl) {
            if (msgEl) msgEl.innerText = 'Redirecting to payment portal...';
            window.location.href = data.redirectUrl;
            return;
        }

        // M-Pesa STK Push
        if (data.requiresManualAction) {
            if (msgEl) {
                msgEl.innerText = 'STK Push sent! Please enter your M-Pesa PIN on your phone.';
            }
            setTimeout(() => {
                window.closeCheckoutModal();
                window.fetchSubscriptionAndHistory();
            }, 3000);
            return;
        }

        // Free Plan or Direct Confirmations
        if (msgEl) msgEl.innerText = 'Request processed successfully!';
        setTimeout(() => {
            window.closeCheckoutModal();
            window.fetchSubscriptionAndHistory();
        }, 1500);

    } catch (err) {
        if (msgEl) {
            msgEl.innerText = err.message || 'Payment processing failed.';
        }
    } finally {
        if (submitBtn) submitBtn.disabled = false;
    }
};

// Safely declare escapeHtml
if (typeof window.escapeHtml !== 'function') {
    window.escapeHtml = function(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    };
}

// Helper to format text into URL-safe slugs
if (typeof window.slugify !== 'function') {
    window.slugify = function(text) {
        if (!text) return '';
        return text.toString().toLowerCase().trim()
            .replace(/\s+/g, '-')
            .replace(/[^\w\-]+/g, '')
            .replace(/\-\-+/g, '-');
    };
}

// Exact artist resolver matching catalog logic
if (typeof window.resolveArtistName !== 'function') {
    window.resolveArtistName = function(rel) {
        if (!rel) return 'Unknown Artist';

        // 1. Check participants array
        if (Array.isArray(rel.participants) && rel.participants.length > 0) {
            const names = rel.participants
                .map(p => typeof p === 'string' ? p : (p.name || ''))
                .filter(Boolean);
            if (names.length > 0) return names.join(', ');
        } 
        
        // 2. Check artists array
        if (Array.isArray(rel.artists) && rel.artists.length > 0) {
            const names = rel.artists
                .map(a => typeof a === 'string' ? a : (a.name || ''))
                .filter(Boolean);
            if (names.length > 0) return names.join(', ');
        } 
        
        // 3. Check single artist field (string or object)
        if (rel.artist) {
            if (typeof rel.artist === 'string' && rel.artist.trim()) return rel.artist;
            if (typeof rel.artist === 'object' && rel.artist.name) return rel.artist.name;
        }

        // 4. Check fallback string properties
        if (typeof rel.artistName === 'string' && rel.artistName.trim()) return rel.artistName;
        if (typeof rel.primaryArtist === 'string' && rel.primaryArtist.trim()) return rel.primaryArtist;
        if (typeof rel.artist_name === 'string' && rel.artist_name.trim()) return rel.artist_name;

        return 'Unknown Artist';
    };
}

// Update preview URL slug based on chosen release
window.updateSmartLinkPreviewSlug = function() {
    const releaseId = document.getElementById('sl_release_id')?.value;
    const previewEl = document.getElementById('sl_url_preview');
    if (!releaseId || !previewEl || !window._availableReleases) return;

    const selected = window._availableReleases.find((r, idx) => String(r.id || idx) === String(releaseId));
    if (selected) {
        const artistName = window.resolveArtistName(selected);
        const title = selected.title || selected.metadata?.title || 'release';
        const artistSlug = window.slugify(artistName);
        const releaseSlug = window.slugify(title);
        previewEl.innerText = `${artistSlug}/${releaseSlug}`;
    }
};

// Execute Backend Scan & Render Review Step (Step 2)
window.executeScanReleaseLinks = async function(e) {
    e.preventDefault();
    const releaseId = document.getElementById('sl_release_id').value;
    const scanBtn = document.getElementById('sl_scan_btn');
    const selectedRelease = window._availableReleases?.find((r, idx) => String(r.id || idx) === String(releaseId));

    if (scanBtn) {
        scanBtn.disabled = true;
        scanBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Scanning DSPs...</span>`;
    }

    let scannedPlatforms = { spotify: '', apple: '', deezer: '', youtube: '', tidal: '', amazon: '' };

    try {
        const token = await getAuthToken();
        const res = await fetch(`${getWorkerBaseUrl()}/api/smart-links/scan`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ releaseId })
        });

        if (res.ok) {
            const data = await res.json();
            if (data.platforms) {
                scannedPlatforms = { ...scannedPlatforms, ...data.platforms };
            }
        }
    } catch (err) {
        console.warn("Auto-scan failed, opening manual entry fallback:", err);
    }

    renderSmartLinkReviewStep(selectedRelease, scannedPlatforms);
};

// Handle Final Creation & Saving
window.handleSaveSmartLink = async function(e) {
    e.preventDefault();
    const saveBtn = document.getElementById('sl_save_btn');
    if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Saving...</span>`;
    }

    const releaseId = document.getElementById('sl_final_release_id').value;
    const slug = document.getElementById('sl_final_slug').value;
    const title = document.getElementById('sl_final_title').value;
    const coverUrl = document.getElementById('sl_final_cover').value;

    const payload = {
        releaseId,
        title,
        slug,
        coverUrl,
        shortUrl: `https://distro.audiory.site/s/${slug}`,
        platforms: {
            spotify: document.getElementById('sl_spotify')?.value || '',
            apple: document.getElementById('sl_apple')?.value || '',
            deezer: document.getElementById('sl_deezer')?.value || '',
            youtube: document.getElementById('sl_youtube')?.value || '',
            tidal: document.getElementById('sl_tidal')?.value || '',
            amazon: document.getElementById('sl_amazon')?.value || ''
        }
    };

    try {
        const token = await getAuthToken();
        const res = await fetch(`${getWorkerBaseUrl()}/api/smart-links`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Failed to save smart link");

        document.getElementById('smartlink-modal')?.remove();
        window.showToast("Smart Link created successfully!");
        window.initSmartLinksPage();
    } catch (err) {
        window.showToast(err.message || "Failed to save smart link", true);
        if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = `<i class="fa-solid fa-check text-xs"></i> <span>Save & Publish</span>`;
        }
    }
};

// Custom Delete Modal
window.confirmDeleteSmartLink = function(id) {
    const existing = document.getElementById('delete-modal');

    const deleteModalHtml = `
        <div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn">

                    <h3 class="text-sm font-bold text-white">Delete Smart Link?</h3>
                    <p class="text-xs text-gray-400">This action cannot be undone and will break existing links.</p>
                </div>
                <div class="flex items-center justify-end gap-2 pt-2">
                    <button onclick="document.getElementById('delete-modal').remove()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white">Cancel</button>
                    <button onclick="executeDeleteSmartLink('${id}')" class="px-3.5 py-1.5 bg-red-500/80 hover:bg-red-500 text-white font-semibold rounded-xl text-xs transition">Delete</button>
                </div>
            </div>
        </div>

// Execute Delete Request
window.executeDeleteSmartLink = async function(id) {
    document.getElementById('delete-modal')?.remove();
    try {
        const token = await getAuthToken();
        const res = await fetch(`${getWorkerBaseUrl()}/api/smart-links/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error("Failed to delete link");

        window.showToast("Smart Link deleted successfully.");
        window.initSmartLinksPage();
    } catch (err) {
        window.showToast(err.message || "Could not delete Smart Link", true);
    }
};

// Custom Copy Action
window.copySmartLink = function(url) {
    if (!url) return;
    navigator.clipboard.writeText(url).then(() => {
        window.showToast("Link copied to clipboard!");
    }).catch(() => {
        window.showToast("Failed to copy link.", true);
    });
};

// UI Toast Notification Helper
window.showPrefToast = function(message, type = 'success') {
    const toast = document.getElementById('pref-toast');
    if (!toast) return;

    if (type === 'success') {
        toast.className = "fixed top-5 right-5 z-50 px-4 py-3 rounded-xl text-xs font-semibold shadow-lg bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 flex items-center gap-2";
        toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${message}`;
    } else {
        toast.className = "fixed top-5 right-5 z-50 px-4 py-3 rounded-xl text-xs font-semibold shadow-lg bg-rose-500/20 border border-rose-500/50 text-rose-300 flex items-center gap-2";
        toast.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${message}`;
    }

    toast.classList.remove('hidden');
    setTimeout(() => {
        toast.classList.add('hidden');
    }, 4000);
};

// Toggle UI Modes between Form and Submitted View
window.updateUIMode = function() {
    const submittedView = document.getElementById('pref-submitted-view');
    const formView = document.getElementById('pref-section-artist');
    const headerActions = document.getElementById('pref-header-actions');

    if (window.prefState.mode === 'view' && window.prefState.artistData && window.prefState.artistData.artistName) {
        submittedView.classList.remove('hidden');
        formView.classList.add('hidden');
        headerActions.classList.add('hidden');
        window.populateSummary(window.prefState.artistData);
    } else {
        submittedView.classList.add('hidden');
        formView.classList.remove('hidden');
        headerActions.classList.remove('hidden');
    }
};

window.populateSummary = function(data) {
    document.getElementById('summary-artistName').innerText = data.artistName || 'Not specified';
    const primary = data.primaryGenre || '';
    const secondary = data.secondaryGenre ? ` / ${data.secondaryGenre}` : '';
    document.getElementById('summary-genres').innerText = (primary + secondary) || 'Not specified';
    document.getElementById('summary-language').innerText = data.language || 'Not specified';
    document.getElementById('summary-about').innerText = data.about || 'No bio submitted.';
    
    document.getElementById('summary-label').innerText = data.label || 'None';
    document.getElementById('summary-cLine').innerText = data.cLine || data.c_line || 'None';
    document.getElementById('summary-pLine').innerText = data.pLine || data.p_line || 'None';

    const p = data.platforms || {};
    document.getElementById('summary-spotify').innerText = p.spotify || 'Not linked';
    document.getElementById('summary-appleMusic').innerText = p.appleMusic || 'Not linked';
    document.getElementById('summary-vevo').innerText = p.vevo || 'Not linked';
    document.getElementById('summary-website').innerText = p.website || 'Not linked';
};

window.openEditMode = function() {
    window.prefState.mode = 'edit';
    window.updateUIMode();
};

window.promptDeleteModal = function() {
    document.getElementById('pref-delete-modal').classList.remove('hidden');
};

window.closeDeleteModal = function() {
    document.getElementById('pref-delete-modal').classList.add('hidden');
};

window.confirmDeletePreferences = async function() {
    window.closeDeleteModal();
    const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
    const baseUrl = window.WORKER_BASE_URL || '';

    try {
        const emptyPayload = {
            artistName: "",
            primaryGenre: "",
            secondaryGenre: "",
            language: "",
            about: "",
            label: "",
            cLine: "",
            pLine: "",
            platforms: { spotify: "", appleMusic: "", vevo: "", website: "" }
        };

        const res = await fetch(`${baseUrl}/api/preferences/artist/submit`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(emptyPayload)
        });

        if (res.ok) {
            window.prefState.artistData = null;
            window.prefState.mode = 'edit';
            
            document.getElementById('pref-artistName').value = '';
            document.getElementById('pref-primaryGenre').value = '';
            document.getElementById('pref-secondaryGenre').value = '';
            document.getElementById('pref-language').value = '';
            document.getElementById('pref-about').value = '';
            document.getElementById('pref-label').value = '';
            document.getElementById('pref-cLine').value = '';
            document.getElementById('pref-pLine').value = '';
            document.getElementById('pref-platform-spotify').value = '';
            document.getElementById('pref-platform-appleMusic').value = '';
            document.getElementById('pref-platform-vevo').value = '';
            document.getElementById('pref-platform-website').value = '';

            window.updateUIMode();
            window.showPrefToast('Artist preferences deleted successfully.', 'success');
        } else {
            window.showPrefToast('Failed to clear preferences.', 'error');
        }
    } catch (err) {
        console.error('Delete error:', err);
        window.showPrefToast('Server connection error.', 'error');
    }
};

window.switchPrefTab = function(tab) {
    const artistTab = document.getElementById('tab-btn-artist');
    const labelTab = document.getElementById('tab-btn-label');
    const artistSec = document.getElementById('pref-section-artist');
    const labelSec = document.getElementById('pref-section-label');
    const submittedView = document.getElementById('pref-submitted-view');

    if (tab === 'artist') {
        artistTab.className = "px-3 sm:px-4 py-1.5 text-xs font-bold rounded-lg bg-brand-dark text-brand-accent border border-brand-border/80";
        labelTab.className = "px-3 sm:px-4 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition-all";
        labelSec.classList.add('hidden');
        window.updateUIMode();
    } else {
        labelTab.className = "px-3 sm:px-4 py-1.5 text-xs font-bold rounded-lg bg-brand-dark text-brand-accent border border-brand-border/80";
        artistTab.className = "px-3 sm:px-4 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition-all";
        labelSec.classList.remove('hidden');
        artistSec.classList.add('hidden');
        submittedView.classList.add('hidden');
    }
};

window.initPreferencesPage = async function() {
    const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
    const baseUrl = window.WORKER_BASE_URL || '';

    try {
        const res = await fetch(`${baseUrl}/api/preferences/artist`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const body = await res.json();
            const artist = body.data?.artist || {};
            
            window.prefState.artistData = artist;

            document.getElementById('pref-artistName').value = artist.artistName || '';
            document.getElementById('pref-primaryGenre').value = artist.primaryGenre || '';
            document.getElementById('pref-secondaryGenre').value = artist.secondaryGenre || '';
            document.getElementById('pref-language').value = artist.language || '';
            document.getElementById('pref-about').value = artist.about || '';
            document.getElementById('pref-label').value = artist.label || '';
            document.getElementById('pref-cLine').value = artist.cLine || artist.c_line || '';
            document.getElementById('pref-pLine').value = artist.pLine || artist.p_line || '';

            if (artist.platforms) {
                document.getElementById('pref-platform-spotify').value = artist.platforms.spotify || '';
                document.getElementById('pref-platform-appleMusic').value = artist.platforms.appleMusic || '';
                document.getElementById('pref-platform-vevo').value = artist.platforms.vevo || '';
                document.getElementById('pref-platform-website').value = artist.platforms.website || '';
            }

            if (artist.artistName) {
                window.prefState.mode = 'view';
            } else {
                window.prefState.mode = 'edit';
            }
            window.updateUIMode();
        }
    } catch (err) {
        console.error('Failed to load preferences:', err);
        window.showPrefToast('Failed to load preferences from server.', 'error');
    }
};

window.savePreferences = async function() {
    const btn = document.getElementById('btn-save-preferences');
    btn.disabled = true;
    btn.innerText = 'Saving...';

    const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
    const baseUrl = window.WORKER_BASE_URL || '';

    const payload = {
        artistName: document.getElementById('pref-artistName').value,
        primaryGenre: document.getElementById('pref-primaryGenre').value,
        secondaryGenre: document.getElementById('pref-secondaryGenre').value,
        language: document.getElementById('pref-language').value,
        about: document.getElementById('pref-about').value,
        label: document.getElementById('pref-label').value,
        cLine: document.getElementById('pref-cLine').value,
        pLine: document.getElementById('pref-pLine').value,
        platforms: {
            spotify: document.getElementById('pref-platform-spotify').value,
            appleMusic: document.getElementById('pref-platform-appleMusic').value,
            vevo: document.getElementById('pref-platform-vevo').value,
            website: document.getElementById('pref-platform-website').value
        }
    };

    try {
        const res = await fetch(`${baseUrl}/api/preferences/artist/submit`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });
        
        if (res.ok) {
            window.prefState.artistData = payload;
            window.prefState.mode = 'view';
            window.updateUIMode();
            window.showPrefToast('Preferences saved successfully!', 'success');
        } else {
            window.showPrefToast('Failed to save preferences.', 'error');
        }
    } catch (err) {
        console.error('Error saving preferences:', err);
        window.showPrefToast('Error connecting to the server.', 'error');
    } finally { // <-- Fixed typo here
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Save Preferences`;
    }
};

    /* ==========================================================================

    window.handleTransferArtworkSelection = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        window.transferState.artwork.file = file;
        const previewContainer = document.getElementById('transferArtworkPreviewContainer');
        const previewImg = document.getElementById('transferArtworkPreviewImg');
        const specsBox = document.getElementById('transferArtworkSpecsBox');

        const previewUrl = URL.createObjectURL(file);
        window.transferState.artwork.url = previewUrl;
        if (previewImg) previewImg.src = previewUrl;

        const inspected = await inspectTransferImageFile(file);
        window.transferState.artwork.inspected = inspected;

        if (specsBox) {
            specsBox.innerHTML = `
                <p>File Name: ${inspected.filename}</p>
                <p>Dimensions: ${inspected.width}x${inspected.height} px</p>
                <p>Format: ${inspected.mime}</p>
                <p class="${inspected.valid ? 'text-emerald-400' : 'text-red-400'} font-bold">
                    ${inspected.valid ? '✓ Artwork Meets Requirements' : '✗ Invalid Dimensions (Min 3000x3000px required)'}
                </p>
            `;
        }
        if (previewContainer) previewContainer.classList.remove('hidden');
    };

    async function inspectTransferImageFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = (e) => {
                const arr = (new Uint8Array(e.target.result)).subarray(0, 4);
                let header = "";
                for (let i = 0; i < arr.length; i++) header += arr[i].toString(16);
                
                let mime = "unknown";
                if (header.startsWith("89504e47")) mime = "image/png";
                else if (header.startsWith("ffd8ff")) mime = "image/jpeg";

                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => {
                    resolve({
                        filename: file.name,
                        mime: mime,
                        width: img.width,
                        height: img.height,
                        fileSize: `${(file.size / (1024 * 1024)).toFixed(2)} MB`,
                        valid: (mime !== "unknown" && img.width >= 3000 && img.height >= 3000)
                    });
                };
            };
            reader.readAsArrayBuffer(file.slice(0, 4));
        });
    }

    window.handleTransferAudioPreview = function(trackIndex, inputElement) {

        if (!file) return;

        window.transferState.tracks[trackIndex].audioFile = file;

        const container = document.getElementById(`transfer_audio_preview_container_${trackIndex}`);

    /* ==========================================================================
   SUBMISSION HANDLER (TRANSFER CATALOG)
   ========================================================================== */
window.handleTransferSubmission = async function(e) {
    if (e) e.preventDefault();

    if (!window.transferState?.confirmedRights) {
        const msg = 'Please confirm rights ownership before submitting.';
        return typeof window.showToast === 'function' ? window.showToast(msg) : alert(msg);
    }

    const hasArtworkFile = Boolean(window.transferState?.artwork?.file);
    const existingArtworkUrl = window.transferState?.artwork?.url || '';

    if (!hasArtworkFile && !existingArtworkUrl) {
        const msg = 'Please upload cover artwork before submitting.';
        return typeof window.showToast === 'function' ? window.showToast(msg) : alert(msg);
    }

    const submitBtn = document.getElementById('btn_submit_transfer') || document.querySelector('button[type="submit"]');
    const progressCard = document.getElementById('submission-progress-card');
    const statusText = document.getElementById('progress-status-text');
    const percentageText = document.getElementById('progress-percentage');
    const progressFill = document.getElementById('progress-bar-fill');

    const updateProgress = (percent, message) => {
        if (progressFill) progressFill.style.width = `${percent}%`;
        if (percentageText) percentageText.innerText = `${Math.round(percent)}%`;
        if (statusText) statusText.innerText = message;
    };

    let originalBtnHTML = '';
    if (submitBtn) {
        originalBtnHTML = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.style.opacity = '0.7';
        submitBtn.innerHTML = `
            <span style="display: inline-flex; align-items: center; gap: 8px;">
                <svg style="animation: spin 1s linear infinite; width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"></circle>
                </svg>
                Transferring Release...
            </span>
        `;
    }

    if (progressCard) progressCard.style.display = 'block';
    updateProgress(5, 'Initializing transfer pipeline...');

    try {
        const tracks = window.transferState.tracks || [];
        const totalTracks = tracks.length;

                    `Uploading Audio Track ${i + 1} of ${totalTracks}: "${track.title || 'Master Audio'}"...`
                );
                const trackRes = await uploadFileToR2(track.audioFile, 'audio');

                const cleanedRoles = rawRoles.map(r => {

                    if (norm.includes('feat')) return 'featuring';
                    if (norm.includes('remix')) return 'remixer';
                    if (ALLOWED_ROLES.includes(norm)) return norm;
                    return 'primary';
                });

                const artistName = typeof artist === 'string' ? artist : (artist.name || artist.artist_name || '');
                return {

            cLine: window.transferState.cLine || '',

                apple: window.transferState.dspApple || ''
            },
            submittedBy: window.currentUser ? window.currentUser.uid : 'anonymous',
            createdAt: new Date().toISOString()

        const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
        const endpoint = `${WORKER_BASE_URL}/api/releases`;

            const previewImg = document.getElementById('artworkPreviewImg');
            const specsBox = document.getElementById('artworkSpecsBox');

            const previewUrl = URL.createObjectURL(file);
            window.releaseState.artwork.url = previewUrl;
            if (previewImg) previewImg.src = previewUrl;

            const inspected = await inspectImageFile(file);
            window.releaseState.artwork.inspected = inspected;

            if (specsBox) {
                specsBox.innerHTML = `
                    <p>File Name: ${inspected.filename}</p>
                    <p>Dimensions: ${inspected.width}x${inspected.height} px</p>
                    <p>Format: ${inspected.mime}</p>

        async function inspectImageFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = (e) => {
                    const arr = (new Uint8Array(e.target.result)).subarray(0, 4);
                    let header = "";
                    for (let i = 0; i < arr.length; i++) header += arr[i].toString(16);
                    
                    let mime = "unknown";
                    if (header.startsWith("89504e47")) mime = "image/png";
                    else if (header.startsWith("ffd8ff")) mime = "image/jpeg";

                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    img.onload = () => {
                        resolve({
                            filename: file.name,
                            mime: mime,
                            width: img.width,
                            height: img.height,
                            fileSize: `${(file.size / (1024 * 1024)).toFixed(2)} MB`,
                            valid: (mime !== "unknown" && img.width >= 3000 && img.height >= 3000)
                        });
                    };
                };
                reader.readAsArrayBuffer(file.slice(0, 4));
            });
        }

window.removeTrackWriter = function(trackIndex, writerIndex) {

    const writers = window.releaseState.tracks[trackIndex].writers;

    // Never allow the user to remove the final required writer.
    if (writers.length <= 1) {
        window.showToast(
            'Each track must have at least one Instrumentalist / Composer writer.'
        );
        return;
    }

    writers.splice(writerIndex, 1);

    document.getElementById('wizardStepContainer').innerHTML =
        renderStep4Content();
};


window.handleInstrumentalSelection = function(trackIndex, input) {

    const file = input.files?.[0];

    if (!file) return;

    const validTypes = [
        'audio/wav',
        'audio/x-wav',
        'audio/flac',
        'audio/x-flac'
    ];

    const validExtension = /\.(wav|flac)$/i.test(file.name);

    if (!validTypes.includes(file.type) && !validExtension) {
        input.value = '';

        window.showToast(
            'Instrumental must be a WAV or FLAC file.'
        );

        return;
    }

    window.releaseState.tracks[trackIndex].instrumentalFile = file;

    const url = URL.createObjectURL(file);

    window.releaseState.tracks[trackIndex].instrumentalPreviewUrl = url;

    const container = document.getElementById(
        `instrumental_preview_container_${trackIndex}`
    );

    if (container) {
        container.innerHTML = `
            <audio controls class="w-full h-8">
                <source src="${url}" type="${file.type}">
            </audio>
        `;
    }
};

window.syncTrackArtistsFromReleaseArtists = function() {

    const releaseArtists = window.releaseState.artists || [];

    window.releaseState.tracks.forEach(track => {

        if (!Array.isArray(track.artists)) {
            track.artists = [];
        }

        if (track.artists.length === 0) {

            track.artists = releaseArtists
                .filter(a => a.name)
                .map(a => ({
                    name: a.name,
                    role: String(a.role || 'primary').toLowerCase()
                }));
        }

    });
};

                </div>
                
                <!-- Progress Bar Track -->
                <div class="w-full h-2.5 bg-brand-card rounded-full overflow-hidden border border-brand-border/40">
                    <!-- Progress Bar Fill -->
                    <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-300 rounded-full" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    `;
}

window.handleFormSubmission = async function(event) {
    if (event) event.preventDefault();

    if (!window.releaseState.agreements?.termsAccepted) {
        return window.showToast(
            'Please confirm that you are authorized to distribute this release.'
        );
    }

    if (!window.releaseState.agreements?.rightsConfirmed) {
        return window.showToast(
            'Please confirm that all samples, interpolations and performances are cleared.'
        );
    }
    const hasArtworkFile = Boolean(window.releaseState.artwork?.file);
    const existingArtworkUrl = window.releaseState.artwork?.url || '';
    
    if (!hasArtworkFile && !existingArtworkUrl) {
        return window.showToast('Please upload cover artwork before submitting.');
    }

    const submitBtn = document.getElementById('submit-release-btn') || document.querySelector('button[type="submit"]');
    const progressCard = document.getElementById('submission-progress-card');
    const statusText = document.getElementById('progress-status-text');
    const percentageText = document.getElementById('progress-percentage');
    const progressFill = document.getElementById('progress-bar-fill');

    const updateProgress = (percent, message) => {
        if (progressFill) progressFill.style.width = `${percent}%`;
        if (percentageText) percentageText.innerText = `${Math.round(percent)}%`;
        if (statusText) statusText.innerText = message;
    };

    let originalBtnHTML = '';
    if (submitBtn) {
        originalBtnHTML = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.style.opacity = '0.7';
        submitBtn.innerHTML = `
            <span style="display: inline-flex; align-items: center; gap: 8px;">
                <svg style="animation: spin 1s linear infinite; width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"></circle>
                </svg>
                Submitting...
            </span>
        `;
    }

    if (progressCard) progressCard.style.display = 'block';
    updateProgress(5, 'Initializing submission pipeline...');

    try {
        const totalTracks = window.releaseState.tracks?.length || 0;
        const totalUploadSteps = (hasArtworkFile ? 1 : 0) + totalTracks;
        let completedSteps = 0;

        // 1. Upload Cover Artwork
        let finalCoverUrl = existingArtworkUrl;
        if (hasArtworkFile) {
            updateProgress(10, 'Uploading Cover Artwork...');
            const uploadRes = await uploadFileToR2(window.releaseState.artwork.file, 'artwork');
            finalCoverUrl = typeof uploadRes === 'string' 
                ? uploadRes 
                : (uploadRes?.url || uploadRes?.location || uploadRes?.path || '');

            if (!finalCoverUrl) throw new Error('Artwork upload succeeded but returned an invalid URL.');

            window.releaseState.artwork.url = finalCoverUrl;
            completedSteps++;
            const stepPercent = 10 + Math.floor((completedSteps / (totalUploadSteps || 1)) * 60);
            updateProgress(stepPercent, 'Cover Artwork uploaded successfully!');
        } else {
            updateProgress(20, 'Using existing artwork...');
        }

        // 2. Upload Audio Master Tracks
        for (let i = 0; i < totalTracks; i++) {
            const track = window.releaseState.tracks[i];
            if (track.audioFile) {
                updateProgress(
                    20 + Math.floor((completedSteps / (totalUploadSteps || 1)) * 60), 
                    `Uploading Track ${i + 1} of ${totalTracks}: "${track.metadata?.title || 'Master Audio'}"...`
                );
                const trackRes = await uploadFileToR2(track.audioFile, 'audio');
                const trackUrl = typeof trackRes === 'string' ? trackRes : (trackRes?.url || trackRes?.location || '');
                window.releaseState.tracks[i].audioUrl = trackUrl;
            }
            completedSteps++;
        }

        updateProgress(80, 'Formatting release metadata & participant roles...');

        const labelNameInput = typeof window.releaseState.label === 'object' 
            ? (window.releaseState.label.name || window.releaseState.label.label) 
            : window.releaseState.label;

        const labelString = (labelNameInput && labelNameInput.trim()) ? labelNameInput.trim() : 'Independent';

        const ALLOWED_ROLES = ['primary', 'featuring', 'remixer'];
        const mappedParticipants = (window.releaseState.artists || [])
            .map(artist => {
                let rawRoles = Array.isArray(artist.role) ? artist.role : [artist.role || 'primary'];
                const cleanedRoles = rawRoles.map(r => {
                    const norm = String(r).toLowerCase().trim();
                    if (norm.includes('feat')) return 'featuring';
                    if (norm.includes('remix')) return 'remixer';
                    if (ALLOWED_ROLES.includes(norm)) return norm;
                    return 'primary';
                });

                const artistName = typeof artist === 'string' ? artist : (artist.name || artist.artist_name || '');
                return {
                    name: artistName.trim(),
                    role: Array.from(new Set(cleanedRoles)),
                    spotify_id: artist.spotify_id || '',
                    apple_id: artist.apple_id || ''
                };
            })
            .filter(p => p.name !== '');

        if (mappedParticipants.length === 0) {
            throw new Error('Please specify at least one Primary Artist name.');
        }

        const editingId = window.releaseState.editingId;
        const isEditing = Boolean(editingId);

        const payload = {
            title: window.releaseState.metadata.title,
            type: window.releaseState.metadata.type,
            language: window.releaseState.metadata.language,
            genre: window.releaseState.metadata.primaryGenre,
            subgenre: window.releaseState.metadata.secondaryGenre,
            label: labelString,
            participants: mappedParticipants,
            artists: mappedParticipants,
            releaseDate: window.releaseState.dates.releaseDate,
            timezone: window.releaseState.dates.timezone,
            dsps: window.releaseState.dsps,
            coverUrl: finalCoverUrl,
            cover_url: finalCoverUrl,
            cover_art: finalCoverUrl,
            artwork: finalCoverUrl,
            tracks: window.releaseState.tracks.map(t => ({
                title: t.metadata.title,
                version: t.metadata.version,
                explicit: t.metadata.explicit,
                isrc: t.isrc,
                audio_url: t.audioUrl,
                tiktok_start_time: t.tiktokStartTime,
                lyrics: t.lyrics?.plain
            })),
            submittedBy: window.currentUser ? window.currentUser.uid : 'anonymous',
            createdAt: new Date().toISOString()
        };

        if (isEditing) {
            payload.id = editingId;
            payload.releaseId = editingId;
            payload.isUpdate = true;
        }

        updateProgress(90, 'Dispatching metadata to Gateway...');

        const token = window.currentUser?.getIdToken ? await window.currentUser.getIdToken() : '';
        const endpoint = `${WORKER_BASE_URL}/api/releases`;

        const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
        });

        const serverResponse = await res.json().catch(() => null);

        if (!res.ok) {
            const errorMsg = serverResponse?.message || serverResponse?.error || `Failed to ${isEditing ? 'update' : 'create'} release on server API`;
            throw new Error(errorMsg);
        }

        updateProgress(100, `Release successfully ${isEditing ? 'updated' : 'submitted'}! Redirecting...`);

        const currentUid = window.currentUser ? window.currentUser.uid : 'anonymous';
        let validStatus = 'Submitted';
        if (serverResponse?.status && !serverResponse.status.includes('Gateway') && !serverResponse.status.includes('Online')) {
            validStatus = serverResponse.status;
        }

        // PRESERVE EXISTING ID ON EDITING
        const finalId = isEditing ? editingId : (serverResponse?.id || serverResponse?.data?.id || Date.now());

        const newReleaseItem = {
            id: finalId,
            title: payload.title,
            type: payload.type,
            status: validStatus,
            coverUrl: finalCoverUrl,
            compressedArtwork: finalCoverUrl,
            participants: mappedParticipants,
            upc: serverResponse?.upc || serverResponse?.data?.upc || 'Pending',
            submittedBy: currentUid
        };

        // Scope storage key dynamically to current user ID
        const userLocalStorageKey = `audiory_releases_${currentUid}`;

        // Retrieve user-scoped local releases
        let localSavedReleases = JSON.parse(
            localStorage.getItem(userLocalStorageKey) || 
            localStorage.getItem('audiory_local_releases') || 
            '[]'
        );

        if (isEditing) {
            const index = localSavedReleases.findIndex(item => String(item.id) === String(editingId));
            if (index !== -1) {
                localSavedReleases[index] = { ...localSavedReleases[index], ...newReleaseItem };
            } else {
                localSavedReleases.unshift(newReleaseItem);
            }
        } else {
            localSavedReleases.unshift(newReleaseItem);
        }

        // Save back to the user-scoped localStorage key
        localStorage.setItem(userLocalStorageKey, JSON.stringify(localSavedReleases));
        
        // Update global window state in place
        if (!Array.isArray(window.releasesCatalog)) window.releasesCatalog = [];
        if (isEditing) {
            const catIndex = window.releasesCatalog.findIndex(item => String(item.id) === String(editingId));
            if (catIndex !== -1) {
                window.releasesCatalog[catIndex] = { ...window.releasesCatalog[catIndex], ...newReleaseItem };
            } else {
                window.releasesCatalog.unshift(newReleaseItem);
            }
        } else {
            window.releasesCatalog.unshift(newReleaseItem);
        }

        window.releaseState.editingId = null;

        setTimeout(() => {
            if (typeof window.loadLiveCatalog === 'function') window.loadLiveCatalog();
            if (typeof window.renderDashboardHome === 'function') window.renderDashboardHome();
            if (typeof window.switchView === 'function') window.switchView('catalog');
            
            if (progressCard) progressCard.style.display = 'none';
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.style.cursor = 'pointer';
                submitBtn.style.opacity = '1';
                submitBtn.innerHTML = originalBtnHTML;
            }
        }, 1200);

    } catch (err) {
        console.error('Submission Error:', err);
        if (typeof window.showToast === 'function') {
            window.showToast(`Submission failed: ${err.message}`);
        } else {
            alert(`Submission failed: ${err.message}`);
        }
        
        if (progressCard) progressCard.style.display = 'none';
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.style.cursor = 'pointer';
            submitBtn.style.opacity = '1';
            submitBtn.innerHTML = originalBtnHTML;
        }
    }
};
        
    </script>
</body>
