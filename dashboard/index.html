<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiory Distribution Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0F17',
                            card: '#121824',
                            border: '#1E293B',
                            accent: '#00F2FE',
                            hover: '#1A2333',
                            text: '#94A3B8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F17; color: #F8FAFC; }
        .too-lost-input { width: 100%; background-color: #0B0F17; border: 1px solid #1E293B; border-radius: 0.75rem; padding: 0.65rem 1rem; color: #ffffff; font-size: 0.875rem; outline: none; transition: all 0.2s; }
        .too-lost-input:focus { border-color: #00F2FE; box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.15); }
        .too-lost-form-label { display: block; font-size: 0.75rem; font-weight: 600; color: #94A3B8; margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F17; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00F2FE; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-brand-dark text-slate-100 overflow-x-hidden">

    <!-- Mobile Header Navigation -->
    <header class="lg:hidden flex items-center justify-between p-4 bg-brand-card border-b border-brand-border sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-black shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-wave-square text-xs"></i>
            </div>
            <span class="font-bold tracking-wider text-sm font-display text-white">AUDIORY</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="switchView('create')" class="px-3 py-1.5 rounded-lg bg-brand-accent text-brand-dark font-bold text-xs flex items-center gap-1.5 shadow-md shadow-cyan-500/10">
                <i class="fa-solid fa-plus text-[10px]"></i> New Release
            </button>
            <button onclick="toggleMobileSidebar()" class="p-2 rounded-lg bg-brand-dark border border-brand-border text-gray-300">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 relative">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebarNav" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-brand-card border-r border-brand-border flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
            <!-- Brand Logo -->
            <div class="p-5 border-b border-brand-border flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-black shadow-lg shadow-cyan-500/20">
                        <i class="fa-solid fa-wave-square text-sm"></i>
                    </div>
                    <div>
                        <h1 class="font-black text-sm tracking-widest text-white">AUDIORY</h1>
                        <p class="text-[10px] text-brand-accent font-mono uppercase tracking-wider">Distribution Hub</p>
                    </div>
                </div>
                <button onclick="toggleMobileSidebar()" class="lg:hidden text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Dynamic Authenticated User Profile -->
            <div class="p-4 mx-3 my-3 rounded-xl bg-brand-dark border border-brand-border flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div id="userInitials" class="w-8 h-8 rounded-lg bg-cyan-500/20 text-brand-accent font-bold flex items-center justify-center text-xs border border-cyan-500/30 flex-shrink-0">--</div>
                    <div class="overflow-hidden">
                        <p id="userName" class="text-xs font-bold text-white truncate">Loading Auth...</p>
                        <p id="userEmail" class="text-[10px] text-gray-400 truncate">Connecting Firebase...</p>
                    </div>
                </div>
                <button onclick="handleSignOut()" title="Sign Out" class="text-gray-500 hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-3 space-y-1.5 overflow-y-auto py-2">
                <p class="px-3 pb-2 text-[10px] font-bold text-gray-500 uppercase tracking-widest">Core Workspace</p>
                <button onclick="switchView('home')" id="nav_home" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-brand-accent bg-brand-dark border border-brand-border/80 transition-all">
                    <i class="fa-solid fa-house w-4"></i> Dashboard Home
                </button>
                <button onclick="switchView('catalog')" id="nav_catalog" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-compact-disc w-4"></i> Releases Catalog
                </button>
                <button onclick="switchView('create')" id="nav_create" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-circle-plus w-4 text-cyan-400"></i> Create New Release
                </button>
                <button onclick="switchView('analytics')" id="nav_analytics" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-chart-line w-4"></i> Analytics & Earnings
                </button>
                <button onclick="switchView('settings')" id="nav_settings" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-sliders w-4"></i> Settings & Payouts
                </button>
            </nav>

            <div class="p-4 border-t border-brand-border bg-brand-card/50 flex items-center justify-between text-[11px] text-gray-400">
                <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Too Lost API Gateway</span>
                <i class="fa-solid fa-gear text-gray-500 hover:text-white cursor-pointer" onclick="switchView('settings')"></i>
            </div>
        </aside>

        <!-- Main Content Viewport -->
        <main class="flex-1 flex flex-col min-w-0 bg-brand-dark">
            <header class="hidden lg:flex items-center justify-between px-8 py-4 bg-brand-card border-b border-brand-border">
                <div class="flex items-center gap-3 max-w-md w-full relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-xs text-gray-500"></i>
                    <input type="text" placeholder="Search live catalog, UPCs, ISRCs..." class="too-lost-input pl-9 py-2 text-xs bg-brand-dark/60">
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="switchView('create')" class="px-4 py-2 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs hover:bg-cyan-300 transition-all flex items-center gap-2 shadow-lg shadow-cyan-500/10">
                        <i class="fa-solid fa-plus text-[10px]"></i> New Release
                    </button>
                </div>
            </header>

            <div id="mainViewport" class="flex-1 p-4 sm:p-8 overflow-y-auto">
                <div class="flex items-center justify-center h-64">
                    <i class="fa-solid fa-spinner fa-spin text-2xl text-brand-accent"></i>
                </div>
            </div>
        </main>
    </div>

    <!-- Production JavaScript Module Hooking Firebase, Worker & R2 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Client Configuration
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Production Configuration Endpoints
        const WORKER_BASE_URL = "https://your-worker.your-subdomain.workers.dev";

        // Global State Variables
        window.currentUser = null;
        window.releasesCatalog = [];
        window.formTrackList = [
            { id: Date.now(), name: '', version: '', language: 'English', artists: '', writers: '', isrc: '', audioFileName: null, rawAudioFile: null }
        ];

        // Auth Observer Hook
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                document.getElementById('userName').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('userInitials').innerText = (user.displayName || user.email).substring(0, 2).toUpperCase();
                
                await loadLiveCatalog();
                switchView('home');
            } else {
                // Redirect unauthenticated user to login view
                window.location.href = '/login.html';
            }
        });

        window.handleSignOut = () => signOut(auth).then(() => window.location.href = '/login.html');

        // Fetch Live Releases from Firestore
        async function loadLiveCatalog() {
            try {
                const q = query(collection(db, "releases"), where("userId", "==", window.currentUser.uid));
                const querySnapshot = await getDocs(q);
                window.releasesCatalog = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (err) {
                console.error("Error loading live catalog:", err);
            }
        }

        // Direct R2 Binary Upload via Cloudflare Worker Pre-Signed URLs
        async function uploadFileToR2(file, folder = 'audio') {
            const fileName = `${folder}/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
            const token = await window.currentUser.getIdToken();

            const res = await fetch(`${WORKER_BASE_URL}/api/presigned-url`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ key: fileName, contentType: file.type })
            });

            if (!res.ok) throw new Error('Failed to retrieve upload URL from Worker');
            const { uploadUrl, publicUrl } = await res.json();

            // Direct binary PUT to R2 Bucket
            const uploadRes = await fetch(uploadUrl, {
                method: 'PUT',
                headers: { 'Content-Type': file.type },
                body: file
            });

            if (!uploadRes.ok) throw new Error('Failed uploading binary to Cloudflare R2');
            return publicUrl;
        }

        // View Router Switching
        window.switchView = function(viewName) {
            ['home', 'catalog', 'create', 'analytics', 'settings'].forEach(v => {
                const btn = document.getElementById(`nav_${v}`);
                if (btn) {
                    btn.className = (v === viewName)
                        ? "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-brand-accent bg-brand-dark border border-brand-border/80 transition-all"
                        : "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all";
                }
            });

            const viewport = document.getElementById('mainViewport');
            if (viewName === 'home') viewport.innerHTML = renderHomeView();
            if (viewName === 'catalog') viewport.innerHTML = renderCatalogView();
            if (viewName === 'create') {
                viewport.innerHTML = renderCreateReleaseView();
                renderTrackCards();
            }
            if (viewName === 'analytics') viewport.innerHTML = renderAnalyticsView();
            if (viewName === 'settings') viewport.innerHTML = renderSettingsView();

            const sidebar = document.getElementById('sidebarNav');
            if (!sidebar.classList.contains('-translate-x-full')) sidebar.classList.add('-translate-x-full');
        };

        window.toggleMobileSidebar = () => document.getElementById('sidebarNav').classList.toggle('-translate-x-full');

        // Render Functions
        function renderHomeView() {
            return `
                <div class="max-w-7xl mx-auto space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-brand-border/60">
                        <div>
                            <h1 class="text-2xl font-bold text-white tracking-tight">Welcome, <span class="text-brand-accent">${window.currentUser?.displayName || 'Partner'}</span></h1>
                            <p class="text-xs text-gray-400">Live production telemetry & Too Lost API gateway pipeline.</p>
                        </div>
                        <button onclick="switchView('create')" class="px-5 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs flex items-center gap-2 shadow-lg shadow-cyan-500/10">
                            <i class="fa-solid fa-plus text-[10px]"></i> New Release
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Active Catalog</p>
                            <h3 class="text-2xl font-black text-white font-mono">${window.releasesCatalog.length}</h3>
                        </div>
                        <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-2">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Status</p>
                            <span class="text-xs font-bold text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> R2 & Too Lost Ready</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCatalogView() {
            if (window.releasesCatalog.length === 0) {
                return `
                    <div class="text-center py-20 bg-brand-card rounded-2xl border border-brand-border space-y-4">
                        <i class="fa-solid fa-compact-disc text-4xl text-gray-600"></i>
                        <h3 class="text-lg font-bold text-white">No Releases In Your Catalog</h3>
                        <p class="text-xs text-gray-400">Create your first release to start distributing music globally.</p>
                        <button onclick="switchView('create')" class="px-5 py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs">Create Release Now</button>
                    </div>
                `;
            }
            return `
                <div class="max-w-7xl mx-auto space-y-6">
                    <h1 class="text-2xl font-bold text-white">Releases Catalog</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${window.releasesCatalog.map(rel => `
                            <div class="p-5 rounded-2xl bg-brand-card border border-brand-border space-y-4">
                                <img src="${rel.coverUrl}" class="w-full aspect-square object-cover rounded-xl border border-brand-border">
                                <div>
                                    <h3 class="font-bold text-white text-sm">${rel.title}</h3>
                                    <p class="text-xs text-gray-400">${rel.artist}</p>
                                </div>
                                <div class="text-[10px] font-mono text-gray-400 pt-2 border-t border-brand-border">UPC: ${rel.upc || 'Pending Assign'}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCreateReleaseView() {
            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="pb-4 border-b border-brand-border/60">
                        <h1 class="text-2xl font-bold text-white">Create Production Release</h1>
                        <p class="text-xs text-gray-400">Upload binaries to Cloudflare R2 and send metadata to Too Lost Distribution API.</p>
                    </div>

                    <form id="productionReleaseForm" onsubmit="handleProductionFormSubmit(event)" class="space-y-8 bg-brand-card p-6 sm:p-8 rounded-2xl border border-brand-border">
                        <div class="space-y-4">
                            <h3 class="text-sm font-bold text-brand-accent font-mono uppercase">1. Cover Art (Direct R2 Upload)</h3>
                            <div class="flex items-center gap-4">
                                <input type="file" id="coverArtFileInput" accept="image/*" required class="too-lost-input">
                            </div>
                        </div>

                        <div class="space-y-4 pt-6 border-t border-brand-border">
                            <h3 class="text-sm font-bold text-brand-accent font-mono uppercase">2. Release Metadata</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="too-lost-form-label">Release Title *</label>
                                    <input type="text" id="releaseTitle" required class="too-lost-input">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Primary Artist *</label>
                                    <input type="text" id="primaryArtists" required class="too-lost-input">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="too-lost-form-label">Genre *</label>
                                    <select id="genreSelect" required class="too-lost-input">
                                        <option value="Pop">Pop</option>
                                        <option value="Hip-Hop/Rap">Hip-Hop/Rap</option>
                                        <option value="Electronic">Electronic</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Target Release Date *</label>
                                    <input type="date" id="targetReleaseDate" required class="too-lost-input">
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6 pt-6 border-t border-brand-border">
                            <h3 class="text-sm font-bold text-brand-accent font-mono uppercase">3. Audio Files & Track List</h3>
                            <div id="tracksContainer" class="space-y-4"></div>
                        </div>

                        <div class="pt-6 border-t border-brand-border flex justify-end">
                            <button type="submit" id="submitProductionFormBtn" class="px-8 py-3 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs flex items-center gap-2">
                                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Assets & Submit
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        window.renderTrackCards = function() {
            const container = document.getElementById('tracksContainer');
            if (!container) return;
            container.innerHTML = window.formTrackList.map((track, idx) => `
                <div class="p-4 rounded-xl bg-brand-dark border border-brand-border space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="too-lost-form-label">Song Title *</label>
                            <input type="text" required onchange="window.formTrackList[${idx}].name = this.value" class="too-lost-input">
                        </div>
                        <div>
                            <label class="too-lost-form-label">Audio Binary File (WAV/FLAC) *</label>
                            <input type="file" accept="audio/*" required onchange="window.handleAudioFileSelect(event, ${idx})" class="too-lost-input">
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.handleAudioFileSelect = (e, idx) => {
            if (e.target.files[0]) {
                window.formTrackList[idx].rawAudioFile = e.target.files[0];
            }
        };

        // Form Submit Handler
        window.handleProductionFormSubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitProductionFormBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading to R2...`;

            try {
                // 1. Upload Artwork directly to R2 Bucket
                const coverArtFile = document.getElementById('coverArtFileInput').files[0];
                const coverUrl = await uploadFileToR2(coverArtFile, 'artworks');

                // 2. Upload Track Audio Binaries to R2
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading Audio Files...`;
                const processedTracks = await Promise.all(window.formTrackList.map(async (track) => {
                    const audioUrl = await uploadFileToR2(track.rawAudioFile, 'audio');
                    return { name: track.name, audioUrl };
                }));

                // 3. Assemble API Payload
                const payload = {
                    userId: window.currentUser.uid,
                    title: document.getElementById('releaseTitle').value,
                    artist: document.getElementById('primaryArtists').value,
                    genre: document.getElementById('genreSelect').value,
                    releaseDate: document.getElementById('targetReleaseDate').value,
                    coverUrl,
                    tracks: processedTracks
                };

                // 4. Proxy Request to Cloudflare Worker -> Too Lost API
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Proxying to Too Lost...`;
                const token = await window.currentUser.getIdToken();
                const workerRes = await fetch(`${WORKER_BASE_URL}/api/releases/submit`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!workerRes.ok) throw new Error('Worker gateway failed submission');
                const tooLostData = await workerRes.json();

                // 5. Store Metadata Reference in Firestore
                await addDoc(collection(db, "releases"), {
                    ...payload,
                    tooLostId: tooLostData.id || null,
                    createdAt: serverTimestamp()
                });

                await loadLiveCatalog();
                switchView('catalog');

            } catch (err) {
                console.error("Submission Error:", err);
                alert(`Error: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Upload Assets & Submit`;
            }
        };

        function renderAnalyticsView() {
            return `<div class="max-w-7xl mx-auto"><h1 class="text-2xl font-bold text-white">Analytics & Earnings</h1><p class="text-xs text-gray-400 mt-2">Connect your Too Lost royalty reports via Worker API.</p></div>`;
        }

        function renderSettingsView() {
            return `<div class="max-w-4xl mx-auto"><h1 class="text-2xl font-bold text-white">Settings & Payouts</h1><p class="text-xs text-gray-400 mt-2">Configure Stripe payout settings and legal identity details.</p></div>`;
        }
    </script>
</body>
</html>
