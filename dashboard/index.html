<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiory Distribution Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0F17',
                            card: '#121824',
                            border: '#1E293B',
                            accent: '#00F2FE',
                            hover: '#1A2333',
                            text: '#94A3B8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F17; color: #F8FAFC; }
        .too-lost-input { width: 100%; background-color: #0B0F17; border: 1px solid #1E293B; border-radius: 0.75rem; padding: 0.65rem 1rem; color: #ffffff; font-size: 0.875rem; outline: none; transition: all 0.2s; }
        .too-lost-input:focus { border-color: #00F2FE; box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.15); }
        .too-lost-form-label { display: block; font-size: 0.75rem; font-weight: 600; color: #94A3B8; margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F17; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00F2FE; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-brand-dark text-slate-100 overflow-x-hidden">

    <!-- Mobile Header Navigation -->
    <header class="lg:hidden flex items-center justify-between p-4 bg-brand-card border-b border-brand-border sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-black shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-wave-square text-xs"></i>
            </div>
            <span class="font-bold tracking-wider text-sm font-display text-white">AUDIORY</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="switchView('create')" class="px-3 py-1.5 rounded-lg bg-brand-accent text-brand-dark font-bold text-xs flex items-center gap-1.5 shadow-md shadow-cyan-500/10">
                <i class="fa-solid fa-plus text-[10px]"></i> New Release
            </button>
            <button onclick="toggleMobileSidebar()" class="p-2 rounded-lg bg-brand-dark border border-brand-border text-gray-300">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 relative">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebarNav" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-brand-card border-r border-brand-border flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
            <!-- Brand Logo -->
            <div class="p-5 border-b border-brand-border flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-black shadow-lg shadow-cyan-500/20">
                        <i class="fa-solid fa-wave-square text-sm"></i>
                    </div>
                    <div>
                        <h1 class="font-black text-sm tracking-widest text-white">AUDIORY</h1>
                        <p class="text-[10px] text-brand-accent font-mono uppercase tracking-wider">Distribution Hub</p>
                    </div>
                </div>
                <button onclick="toggleMobileSidebar()" class="lg:hidden text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Dynamic Authenticated User Profile -->
            <div class="p-4 mx-3 my-3 rounded-xl bg-brand-dark border border-brand-border flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div id="userInitials" class="w-8 h-8 rounded-lg bg-cyan-500/20 text-brand-accent font-bold flex items-center justify-center text-xs border border-cyan-500/30 flex-shrink-0">--</div>
                    <div class="overflow-hidden">
                        <p id="userName" class="text-xs font-bold text-white truncate">Loading Auth...</p>
                        <p id="userEmail" class="text-[10px] text-gray-400 truncate">Connecting Firebase...</p>
                    </div>
                </div>
                <button onclick="handleSignOut()" title="Sign Out" class="text-gray-500 hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-3 space-y-1.5 overflow-y-auto py-2">
                <p class="px-3 pb-2 text-[10px] font-bold text-gray-500 uppercase tracking-widest">Core Workspace</p>
                <button onclick="switchView('home')" id="nav_home" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-brand-accent bg-brand-dark border border-brand-border/80 transition-all">
                    <i class="fa-solid fa-house w-4"></i> Dashboard Home
                </button>
                <button onclick="switchView('catalog')" id="nav_catalog" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-compact-disc w-4"></i> Releases Catalog
                </button>
                <button onclick="switchView('create')" id="nav_create" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-circle-plus w-4 text-cyan-400"></i> Create New Release
                </button>
                <button onclick="switchView('analytics')" id="nav_analytics" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-chart-line w-4"></i> Analytics & Earnings
                </button>
                <button onclick="switchView('settings')" id="nav_settings" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-400 hover:text-white hover:bg-brand-dark/50 transition-all">
                    <i class="fa-solid fa-sliders w-4"></i> Settings & Payouts
                </button>
            </nav>

            <div class="p-4 border-t border-brand-border bg-brand-card/50 flex items-center justify-between text-[11px] text-gray-400">
                <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Too Lost API Gateway</span>
                <i class="fa-solid fa-gear text-gray-500 hover:text-white cursor-pointer" onclick="switchView('settings')"></i>
            </div>
        </aside>

        <!-- Main Content Viewport -->
        <main class="flex-1 flex flex-col min-w-0 bg-brand-dark">
            <header class="hidden lg:flex items-center justify-between px-8 py-4 bg-brand-card border-b border-brand-border">
                <div class="flex items-center gap-3 max-w-md w-full relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-xs text-gray-500"></i>
                    <input type="text" placeholder="Search live catalog, UPCs, ISRCs..." class="too-lost-input pl-9 py-2 text-xs bg-brand-dark/60">
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="switchView('create')" class="px-4 py-2 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs hover:bg-cyan-300 transition-all flex items-center gap-2 shadow-lg shadow-cyan-500/10">
                        <i class="fa-solid fa-plus text-[10px]"></i> New Release
                    </button>
                </div>
            </header>

            <div id="mainViewport" class="flex-1 p-4 sm:p-8 overflow-y-auto">
                <div class="flex items-center justify-center h-64">
                    <i class="fa-solid fa-spinner fa-spin text-2xl text-brand-accent"></i>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Block containing Global Wizard Methods & Variables -->
    <script>
        // Global Data Maps & Dynamic Arrays
        const GENRE_MAP = {
            "Pop": ["Dance Pop", "Synthpop", "Indie Pop", "K-Pop"],
            "Hip-Hop/Rap": ["Trap", "Boom Bap", "Conscious Hip-Hop", "Drill"],
            "Afrobeats": ["Afro-Pop", "Amapiano", "Afro-Fusion", "Afro-House"],
            "Electronic/Dance": ["House", "Techno", "Trance", "Dubstep"],
            "Rock": ["Alternative Rock", "Indie Rock", "Hard Rock", "Punk"]
        };

        const ALL_TIMEZONES = [
            "UTC (Coordinated Universal Time)",
            "EST (Eastern Standard Time)",
            "PST (Pacific Standard Time)",
            "GMT (Greenwich Mean Time)",
            "EAT (East Africa Time)",
            "CET (Central European Time)"
        ];

        const ALL_DSPS = [
            "Spotify", "Apple Music", "YouTube Music", "Amazon Music",
            "Deezer", "Tidal", "Pandora", "TikTok / SoundOn"
        ];

        const COUNTRY_LIST = [
            "United States", "United Kingdom", "Kenya", "Nigeria", "South Africa",
            "Canada", "Australia", "Germany", "France", "Japan", "Brazil"
        ];

        const ALL_ROLES = [
            'Primary Artist', 'Featured Artist', 'Remixer', 'Composer', 'Lyricists',
            'Producer', 'Engineer', 'Conductor', 'Orchestra', 'Performer', 'Arranger', 'Author', 'Publisher'
        ];

        // Global State Initializer
        window.currentStep = 1;

        window.releaseState = {
            metadata: {
                title: '',
                type: 'Single',
                language: 'English',
                primaryGenre: '',
                secondaryGenre: '',
                artists: [{ name: '', role: 'Primary Artist', spotifyId: '', appleMusicId: '' }]
            },
            artists: [{ name: '', role: 'Primary Artist', spotifyId: '', appleMusicId: '' }],
            label: { name: '', cLine: '', pLine: '' },
            dates: { releaseDate: '', releaseTimezone: 'UTC (Coordinated Universal Time)' },
            territories: { mode: 'Worldwide', selectedCountries: [] },
            dsps: [...ALL_DSPS],
            coverArtwork: null,
            tracks: [{
                title: '',
                audioFile: null,
                isrc: '',
                explicit: 'Clean',
                metadata: { genre: '', subgenre: '' },
                contributors: [{ name: '', role: 'Primary Artist' }]
            }],
            agreements: { termsAccepted: false }
        };

        // UI Toast Alert Component
        window.showToast = function(message, isError = true) {
            let toastBox = document.getElementById('toastContainer');
            if (!toastBox) {
                toastBox = document.createElement('div');
                toastBox.id = 'toastContainer';
                toastBox.className = 'fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none';
                document.body.appendChild(toastBox);
            }
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-xs font-semibold shadow-xl border backdrop-blur-md transition-all duration-300 pointer-events-auto flex items-center gap-2 ${
                isError ? 'bg-red-950/90 border-red-500/50 text-red-200' : 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200'
            }`;
            toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i> <span>${message}</span>`;
            toastBox.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        };

        // Main Release Wizard Renderer
        window.renderCreateReleaseView = function() {
            return `
                <div class="max-w-5xl mx-auto space-y-6">
                    <div class="flex items-center justify-between">
                        <h1 class="text-2xl font-bold text-white">Create New Release</h1>
                        <span class="text-xs text-cyan-400 font-mono">Step <span id="stepCounter">1</span> of 6</span>
                    </div>

                    <!-- Wizard Steps Navigation Tabs -->
                    <div class="grid grid-cols-6 gap-2 text-center text-xs font-semibold">
                        <div id="step_tab_1" class="p-2 rounded-lg bg-brand-accent text-brand-dark font-bold">1. Metadata</div>
                        <div id="step_tab_2" class="p-2 rounded-lg bg-brand-card text-gray-400 border border-brand-border">2. Dates & DSPs</div>
                        <div id="step_tab_3" class="p-2 rounded-lg bg-brand-card text-gray-400 border border-brand-border">3. Artwork</div>
                        <div id="step_tab_4" class="p-2 rounded-lg bg-brand-card text-gray-400 border border-brand-border">4. Tracks</div>
                        <div id="step_tab_5" class="p-2 rounded-lg bg-brand-card text-gray-400 border border-brand-border">5. Rights</div>
                        <div id="step_tab_6" class="p-2 rounded-lg bg-brand-card text-gray-400 border border-brand-border">6. Delivery</div>
                    </div>

                    <form onsubmit="handleFormSubmission(event)" class="space-y-6">
                        
                        <!-- STEP 1: METADATA -->
                        <div id="step_1_content" class="space-y-4">
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="too-lost-form-label">Release Title *</label>
                                    <input type="text" required value="${window.releaseState.metadata.title || ''}" oninput="window.releaseState.metadata.title = this.value" class="too-lost-input" placeholder="Title">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Release Type *</label>
                                    <select onchange="window.releaseState.metadata.type = this.value; adjustTracksForReleaseType();" class="too-lost-input">
                                        <option value="Single" ${window.releaseState.metadata.type === 'Single' ? 'selected' : ''}>Single</option>
                                        <option value="EP" ${window.releaseState.metadata.type === 'EP' ? 'selected' : ''}>EP</option>
                                        <option value="Album" ${window.releaseState.metadata.type === 'Album' ? 'selected' : ''}>Album</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Primary Language *</label>
                                    <select onchange="window.releaseState.metadata.language = this.value" class="too-lost-input">
                                        <option value="English">English</option>
                                        <option value="Swahili">Swahili</option>
                                        <option value="French">French</option>
                                        <option value="Spanish">Spanish</option>
                                        <option value="Portuguese">Portuguese</option>
                                        <option value="Instrumental">Instrumental (No Lyrics)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Genre & Subgenre Selection -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="too-lost-form-label">Primary Genre *</label>
                                    <select onchange="handlePrimaryGenreChange(this.value)" class="too-lost-input" required>
                                        <option value="">Select Primary Genre</option>
                                        ${Object.keys(GENRE_MAP).map(g => `<option value="${g}" ${window.releaseState.metadata.primaryGenre === g ? 'selected' : ''}>${g}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="too-lost-form-label">Subgenre / Secondary Genre *</label>
                                    <select id="secondaryGenreSelect" onchange="window.releaseState.metadata.secondaryGenre = this.value" class="too-lost-input" ${!window.releaseState.metadata.primaryGenre ? 'disabled' : ''}>
                                        <option value="">${window.releaseState.metadata.primaryGenre ? 'Select Subgenre' : '-- Select Primary Genre First --'}</option>
                                        ${window.releaseState.metadata.primaryGenre && GENRE_MAP[window.releaseState.metadata.primaryGenre] 
                                            ? GENRE_MAP[window.releaseState.metadata.primaryGenre].map(sub => `<option value="${sub}" ${window.releaseState.metadata.secondaryGenre === sub ? 'selected' : ''}>${sub}</option>`).join('')
                                            : ''}
                                    </select>
                                </div>
                            </div>

                            <div class="space-y-3">
                                <div class="flex items-center justify-between">
                                    <label class="too-lost-form-label">Primary & Associated Artists *</label>
                                    <button type="button" onclick="addArtistToState()" class="text-xs text-brand-accent hover:underline">+ Add Another Artist</button>
                                </div>
                                <div id="step_1_artists_container" class="space-y-3"></div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-brand-border">
                                <div>
                                    <label class="too-lost-form-label">Record Label *</label>
                                    <input type="text" required value="${window.releaseState.label.name || ''}" oninput="window.releaseState.label.name = this.value" class="too-lost-input" placeholder="Label Name">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">(C) Line Copyright *</label>
                                    <input type="text" required placeholder="e.g. 2026 Record Label" value="${window.releaseState.label.cLine || ''}" oninput="window.releaseState.label.cLine = this.value" class="too-lost-input">
                                </div>
                                <div>
                                    <label class="too-lost-form-label">(P) Line Phonogram *</label>
                                    <input type="text" required placeholder="e.g. 2026 Record Label" value="${window.releaseState.label.pLine || ''}" oninput="window.releaseState.label.pLine = this.value" class="too-lost-input">
                                </div>
                            </div>
                        </div>

                        <!-- STEP 2: DATES, TIMEZONES, TERRITORIES & DSPS -->
                        <div id="step_2_content" class="hidden space-y-4"></div>

                        <!-- STEP 3: ARTWORK SPECS & INSPECTION -->
                        <div id="step_3_content" class="hidden space-y-4">
                            <div>
                                <label class="too-lost-form-label">Cover Artwork Upload (Min 3000x3000px JPG/PNG) *</label>
                                <input type="file" accept="image/png, image/jpeg" onchange="handleCoverArtSelection(event)" class="too-lost-input">
                            </div>
                            <div id="artworkPreviewContainer" class="hidden p-4 rounded-xl bg-brand-dark border border-brand-border flex flex-col sm:flex-row gap-4 items-center">
                                <img id="artworkPreviewImg" class="w-40 h-40 rounded-xl object-cover border border-brand-border shadow-lg">
                                <div id="artworkSpecsBox" class="text-xs space-y-1.5 text-gray-300 font-mono"></div>
                            </div>
                        </div>

                        <!-- STEP 4: TRACKS & AUDIO ASSETS -->
                        <div id="step_4_content" class="hidden space-y-4"></div>

                        <!-- STEP 5: RIGHTS & TERMS -->
                        <div id="step_5_content" class="hidden space-y-4">
                            <div class="p-5 rounded-2xl bg-brand-dark border border-brand-border space-y-4 text-xs text-gray-300">
                                <h3 class="font-bold text-white text-sm">Legal & Copyright Affirmation</h3>
                                <label class="flex items-start gap-3 cursor-pointer">
                                    <input type="checkbox" onchange="window.releaseState.agreements.termsAccepted = this.checked" class="mt-0.5 rounded border-brand-border">
                                    I certify that I am authorized to grant distribution rights for all masters, lyrics, and metadata supplied in this submission package.
                                </label>
                            </div>
                        </div>

                        <!-- STEP 6: DELIVERY SUMMARY -->
                        <div id="step_6_content" class="hidden space-y-4">
                            <div id="deliverySummary" class="p-5 rounded-2xl bg-brand-dark border border-brand-border space-y-2 text-xs text-gray-300 font-mono"></div>
                        </div>

                        <!-- Step Navigation Controls -->
                        <div class="flex justify-between items-center pt-4 border-t border-brand-border">
                            <button type="button" id="prevStepBtn" disabled onclick="navigateStep(-1)" class="px-4 py-2 rounded-xl bg-brand-card text-gray-300 text-xs font-bold disabled:opacity-50">Back</button>
                            <button type="button" id="nextStepBtn" onclick="navigateStep(1)" class="px-5 py-2.5 rounded-xl bg-brand-accent text-brand-dark text-xs font-bold">Next Step</button>
                            <button type="submit" id="submitReleaseBtn" class="hidden px-6 py-2.5 rounded-xl bg-emerald-400 text-black font-bold text-xs">Upload & Submit Release</button>
                        </div>
                    </form>
                </div>

                <!-- Modal Container for Territories -->
                <div id="territoriesModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-brand-card border border-brand-border rounded-2xl max-w-xl w-full p-6 space-y-4 max-h-[80vh] flex flex-col">
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-bold text-white">Select Specified Territories</h3>
                            <button type="button" onclick="closeTerritoriesModal()" class="text-gray-400 hover:text-white text-sm">&times;</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 overflow-y-auto p-2">
                            ${COUNTRY_LIST.map(country => `
                                <label class="flex items-center gap-2 p-2 rounded bg-brand-dark border border-brand-border text-xs text-gray-200">
                                    <input type="checkbox" value="${country}" ${window.releaseState.territories.selectedCountries.includes(country) ? 'checked' : ''} onchange="toggleCountrySelection('${country}', this.checked)">
                                    ${country}
                                </label>
                            `).join('')}
                        </div>
                        <button type="button" onclick="closeTerritoriesModal()" class="w-full py-2 bg-brand-accent text-brand-dark font-bold text-xs rounded-xl">Done</button>
                    </div>
                </div>
            `;
        };

        // Step 1: Genre & Dynamic Artist Inputs
        window.handlePrimaryGenreChange = function(genre) {
            window.releaseState.metadata.primaryGenre = genre;
            window.releaseState.metadata.secondaryGenre = '';
            const select = document.getElementById('secondaryGenreSelect');
            if (select) {
                select.disabled = !genre;
                select.innerHTML = `<option value="">${genre ? 'Select Subgenre' : '-- Select Primary Genre First --'}</option>` +
                    (GENRE_MAP[genre] ? GENRE_MAP[genre].map(sub => `<option value="${sub}">${sub}</option>`).join('') : '');
            }
        };

        window.renderArtistInputs = function() {
            const container = document.getElementById('step_1_artists_container');
            if (!container) return;
            const artistList = window.releaseState.metadata.artists || window.releaseState.artists;
            container.innerHTML = artistList.map((artist, idx) => `
                <div class="p-3 bg-brand-dark border border-brand-border rounded-xl space-y-2">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" required placeholder="Artist Name" value="${artist.name || ''}" oninput="window.releaseState.metadata.artists[${idx}].name = this.value; if(window.releaseState.artists[${idx}]) window.releaseState.artists[${idx}].name = this.value;" class="too-lost-input">
                        <select onchange="window.releaseState.metadata.artists[${idx}].role = this.value; if(window.releaseState.artists[${idx}]) window.releaseState.artists[${idx}].role = this.value;" class="too-lost-input">
                            ${ALL_ROLES.map(r => `<option value="${r}" ${artist.role === r ? 'selected' : ''}>${r}</option>`).join('')}
                        </select>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" placeholder="Spotify ID (Optional)" value="${artist.spotifyId || ''}" oninput="window.releaseState.metadata.artists[${idx}].spotifyId = this.value" class="too-lost-input">
                        <input type="text" placeholder="Apple Music ID (Optional)" value="${artist.appleMusicId || artist.appleId || ''}" oninput="window.releaseState.metadata.artists[${idx}].appleMusicId = this.value" class="too-lost-input">
                    </div>
                    ${artistList.length > 1 ? `
                        <button type="button" onclick="removeArtistFromState(${idx})" class="text-xs text-red-400 hover:underline">Remove Artist</button>
                    ` : ''}
                </div>
            `).join('');
        };

        window.addArtistToState = function() {
            if (!window.releaseState.metadata.artists) window.releaseState.metadata.artists = [];
            window.releaseState.metadata.artists.push({ name: '', role: 'Featured Artist', spotifyId: '', appleMusicId: '' });
            window.releaseState.artists = window.releaseState.metadata.artists;
            window.renderArtistInputs();
        };

        window.removeArtistFromState = function(idx) {
            window.releaseState.metadata.artists.splice(idx, 1);
            window.releaseState.artists = window.releaseState.metadata.artists;
            window.renderArtistInputs();
        };

        // Direct Multipart Upload to Cloudflare Worker R2 Bucket
        async function uploadFileToR2(file, folder = 'audio') {
            const token = await window.currentUser.getIdToken();
            const formData = new FormData();
            formData.append('file', file);
            formData.append('folder', folder);

            const res = await fetch(`${WORKER_BASE_URL}/api/upload`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Worker upload failed with status ${res.status}: ${errText}`);
            }

            const data = await res.json();
            if (!data.success || !data.url) {
                throw new Error(`Upload failed: ${data.error || 'No public URL returned from Worker'}`);
            }

            return data.url;

                                                <button type="button" onclick="deleteReleaseCatalog('${rel.id || idx}')" title="Delete Release" class="p-1.5 rounded-lg text-gray-400 hover:text-red-400 hover:bg-brand-dark transition">
                                                    <i class="fa-solid fa-trash text-xs"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // Catalog Actions
        window.editReleaseCatalog = function(index) {
            const item = window.releasesCatalog[index];
            if (!item) return;
            window.releaseState = JSON.parse(JSON.stringify(item));
            switchView('create');
            window.showToast('Release loaded for editing', false);
        };

        window.deleteReleaseCatalog = async function(releaseId) {
            if (!confirm('Are you sure you want to delete this release from your catalog?')) return;

            try {
                const res = await fetch(`${WORKER_BASE_URL}/api/releases/${releaseId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete release');
                
                window.showToast('Release deleted successfully', false);
                await loadLiveCatalog();
            } catch (err) {
                console.error('Delete error:', err);
                window.releasesCatalog = window.releasesCatalog.filter(r => r.id !== releaseId);
                const viewport = document.getElementById('mainViewport');
                if (viewport) viewport.innerHTML = renderCatalogView();
                window.showToast('Release removed from catalog view', false);
            }
        };

        // Analytics View Stub
        function renderAnalyticsView() {
            return `
                <div class="max-w-7xl mx-auto space-y-6">
                    <h1 class="text-2xl font-bold text-white tracking-tight">Analytics & Earnings</h1>
                    <div class="p-8 rounded-2xl bg-brand-card border border-brand-border text-center space-y-3">
                        <i class="fa-solid fa-chart-line text-4xl text-brand-accent"></i>
                        <p class="text-sm text-gray-300">Live streams, storefront performance & monthly royalty statements will display here.</p>
                    </div>
                </div>
            `;
        }

        // Settings View Stub
        function renderSettingsView() {
            return `
                <div class="max-w-7xl mx-auto space-y-6">
                    <h1 class="text-2xl font-bold text-white tracking-tight">Settings & Payouts</h1>
                    <div class="p-8 rounded-2xl bg-brand-card border border-brand-border space-y-4">
                        <h3 class="text-base font-bold text-white">Payout Method</h3>
                        <p class="text-xs text-gray-400">Configure bank accounts and automatic royalty distribution parameters.</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
