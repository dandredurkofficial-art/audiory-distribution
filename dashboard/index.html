    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            query, 
            where, 
            onSnapshot, 
            addDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyAudioryProductionApiKeyPlaceholder",
            authDomain: "audiory-distro.firebaseapp.com",
            projectId: "audiory-distro",
            storageBucket: "audiory-distro.appspot.com",
            messagingSenderId: "892496899076",
            appId: "1:892496899076:web:audioryproductionkey"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State
        window.userState = { uid: null, displayName: 'Artist', email: '' };
        window.userReleases = [];
        window.userTelemetry = [];
        let chartInstance = null;

        // Auto Authentication
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.userState.uid = user.uid;
                window.userState.displayName = user.displayName || user.email?.split('@')[0] || "Artist Account";
                window.userState.email = user.email || `${user.uid.substring(0, 8)}@audiory.io`;
                updateUserUI();
                listenToUserData();
            } else {
                signInAnonymously(auth).catch(err => console.error("Auth error:", err));
            }
        });

        function updateUserUI() {
            const name = window.userState.displayName;
            const initials = name.substring(0, 2).toUpperCase();
            document.getElementById('userName').textContent = name;
            document.getElementById('userEmail').textContent = window.userState.email;
            document.getElementById('userAvatar').textContent = initials;
            document.getElementById('topAvatar').textContent = initials;
            document.getElementById('topUserName').textContent = name;
        }

        // Realtime User Data Subscription
        function listenToUserData() {
            if (!window.userState.uid) return;

            // Releases Listener
            const relQuery = query(collection(db, "releases"), where("userId", "==", window.userState.uid));
            onSnapshot(relQuery, (snapshot) => {
                window.userReleases = [];
                snapshot.forEach(doc => {
                    window.userReleases.push({ id: doc.id, ...doc.data() });
                });
                renderCurrentPage();
            }, (error) => {
                console.error("Releases snapshot error:", error);
            });

            // Telemetry Listener
            const telemQuery = query(collection(db, "telemetry"), where("userId", "==", window.userState.uid));
            onSnapshot(telemQuery, (snapshot) => {
                window.userTelemetry = [];
                snapshot.forEach(doc => {
                    window.userTelemetry.push({ id: doc.id, ...doc.data() });
                });
                if (window.currentPage === 'dashboard' || window.currentPage === 'ana_streams') {
                    renderCurrentPage();
                }
            }, (error) => {
                console.error("Telemetry snapshot error:", error);
            });
        }

        // Global Navigation & Page Switching
        window.currentPage = 'dashboard';

        window.navigateTo = function(pageId) {
            window.currentPage = pageId;
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            const activeBtn = document.getElementById(`nav-${pageId}`);
            if (activeBtn) activeBtn.classList.add('active');
            
            // Close mobile menu if open
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.add('hidden');

            renderCurrentPage();
        };

        window.toggleMobileSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        };

        // Render Active View
        function renderCurrentPage() {
            const container = document.getElementById('mainContentView');
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }

            switch(window.currentPage) {
                case 'dashboard':
                    container.innerHTML = renderDashboardView();
                    initDashboardChart();
                    break;
                case 'cat_releases':
                    container.innerHTML = renderReleasesView();
                    break;
                case 'cat_artists':
                    container.innerHTML = renderArtistsView();
                    break;
                case 'cat_create':
                    container.innerHTML = renderCreateReleaseView();
                    break;
                case 'cat_ringtone':

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitReleaseBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...`;

            const title = document.getElementById('formTitle').value;
            const artist = document.getElementById('formArtist').value;
            const type = document.getElementById('formType').value;
            const genre = document.getElementById('formGenre').value;
            const releaseDate = document.getElementById('formDate').value;
            const coverUrl = document.getElementById('formCoverUrl').value;
            const explicit = document.getElementById('formExplicit').value;
            let upc = document.getElementById('formUpc').value;

            if (!upc) {
                upc = Math.floor(100000000000 + Math.random() * 900000000000).toString();
            }

            const isrc = "US-AUD-" + Math.floor(10000 + Math.random() * 90000);

            try {
                await addDoc(collection(db, "releases"), {
                    userId: window.userState.uid,
                    title,
                    artist,
                    type,
                    genre,
                    releaseDate,
                    coverUrl,
                    explicit,
                    upc,
                    isrc,
                    status: 'Active',
                    createdAt: serverTimestamp()
                });

                navigateTo('cat_releases');
            } catch (err) {
                console.error("Error submitting release:", err);
                alert("Could not save release. Check console.");
                btn.disabled = false;
                btn.textContent = "Save & Distribute Release";
            }
        };

                    <div class="flex justify-between items-center pb-4 border-b border-brand-border/60">
                        <div>
                            <h1 class="text-2xl font-bold font-display text-white">SplitShare Collaborators</h1>
                            <p class="text-xs text-gray-400">Configure automated royalty splits with producers and co-writers.</p>
                        </div>
                    </div>

                    <div class="p-6 rounded-2xl bg-brand-card border border-brand-border space-y-4">
                        <h4 class="text-sm font-bold text-white">Active Split Contracts</h4>
                        <p class="text-xs text-gray-400">Select a release in your catalog to configure revenue share percentages.</p>
                    </div>
                </div>
            `;
        }

        function renderRightsView(title, description) {
            return `
                <div class="max-w-2xl mx-auto space-y-6">
                    <div class="pb-4 border-b border-brand-border/60">
                        <h1 class="text-2xl font-bold font-display text-white">${title}</h1>
                        <p class="text-xs text-gray-400">${description}</p>
                    </div>

                    <form onsubmit="handleGenericSubmit(event, '${title}')" class="p-6 rounded-2xl bg-brand-card border border-brand-border space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Target Channel / Video / Account URL</label>
                            <input type="url" required placeholder="https://..." class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-brand-accent">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Associated Release</label>
                            <select class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-brand-accent">
                                ${window.userReleases.length > 0 
                                    ? window.userReleases.map(r => `<option value="${r.id}">${r.title}</option>`).join('')
                                    : `<option value="">No releases registered</option>`
                                }
                            </select>
                        </div>

                        <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-accent text-brand-dark font-bold text-xs hover:bg-cyan-300">Submit Enforcement Request</button>
                    </form>
                </div>
            `;
        }

        // ==================== CHART INITIALIZERS ====================

        function initDashboardChart() {
            const canvas = document.getElementById('dashboardChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const labels = window.userTelemetry.length > 0 ? window.userTelemetry.map(t => t.date || 'Day') : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const dataPoints = window.userTelemetry.length > 0 ? window.userTelemetry.map(t => t.count || 0) : [0, 0, 0, 0, 0, 0, 0];

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Streams',
                        data: dataPoints,
                        borderColor: '#00f2fe',
                        backgroundColor: 'rgba(0, 242, 254, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1b2436' }, ticks: { color: '#9ca3af', font: { size: 10 } } },
                        y: { grid: { color: '#1b2436' }, ticks: { color: '#9ca3af', font: { size: 10 } } }
                    }
                }
            });
        }

        function initStreamsChart() {
            const canvas = document.getElementById('streamsDetailChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Spotify', 'Apple Music', 'YouTube', 'TikTok', 'Amazon', 'Deezer'],
                    datasets: [{
                        label: 'Streams by Platform',
                        data: [12000, 8500, 14200, 22000, 4100, 1800],
                        backgroundColor: '#6366f1'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1b2436' }, ticks: { color: '#9ca3af' } },
                        y: { grid: { color: '#1b2436' }, ticks: { color: '#9ca3af' } }
                    }
                }
            });
        }

        // Initialize First View
        renderCurrentPage();
    </script>
</body>
</html>
